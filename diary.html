<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>r4box diary</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="world/world.css?v=13">
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root { --mono: ui-monospace, "SF Mono", Menlo, monospace;
      /* the Timeline and All ideas cards (world/cards.js) */
      --r4-bg: #000000; --r4-panel: #0D0B1F; --r4-panel-2: #141130; --r4-line: #251F48; --r4-ink: #F3F1FF; --r4-muted: #ACA5D6; --r4-faint: #7A73A8;
      --teal-ink: #062A26; --mint: #C9FFF8; --font-display: "Unbounded", "Arial Black", Impact, sans-serif; --font-body: "Sora", system-ui, sans-serif; --font-mono: var(--mono); }
    :focus-visible { outline: 3px solid #F5C542; outline-offset: 2px; }
    #app { max-width: 560px; }
    .isfull .pick { width: calc(min(560px, 100vw) - 24px); }
    .solo .page { padding-bottom: max(40px, env(safe-area-inset-bottom)); }
    header select { pointer-events: auto; background: #000000cc; color: #F3F1FF; border: 1px solid #251F48; border-radius: 10px; padding: 6px 8px; font: 700 13px/1 Sora, system-ui, sans-serif; }
    .empty { margin: 18px 0; padding: 16px 18px; border-radius: 18px; background: #0D0B1F; border: 1px solid #251F48; }
    .empty b { display: block; font: 800 18px/1.2 Unbounded, sans-serif; margin-bottom: 6px; }
    .empty p { margin: 0; color: #ACA5D6; font-size: 14px; }
    .xbody { min-width: 0; overflow: hidden; padding: 4px 16px 8px; } .xbody > * { max-width: 100%; }
    .built { margin: 22px 0 0; font-size: 12px; color: #7A73A8; }
  </style>
</head>
<body>
<div id="app">
  <header><button class="back" id="back" hidden aria-label="Back">‹</button><a class="mark" href="/" id="markA"><i aria-hidden="true"></i>r4box</a><span class="sep">/</span><h1 id="title">diary</h1><span class="grow"></span><select id="who" hidden aria-label="Whose world"></select></header>
  <div class="world" id="worldBox"><canvas id="cv" aria-label="Your world, grown from your diary"></canvas><div class="hint" id="hint"></div><div class="tools" id="tools" hidden><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zHome" aria-label="Whole world">⤢</button><button id="zFull" aria-label="Full screen">⛶</button><button id="plantBtn" class="plant">🌱 Plant</button></div><div class="legend" id="legend"></div></div>
  <main class="page">
    <div class="pick" id="pick" hidden></div>
    <p class="note" id="private" hidden></p>
    <div id="body"><p class="note">Loading your world…</p></div>
  </main>
</div>
<script src="world/story-kit.js?v=2"></script>
<script src="diary-tree.js?v=10"></script>
<script src="world/world-parts.js"></script>
<script src="world/world-layout.js"></script>
<script src="world/world-engine.js?v=12"></script>
<script type="module">
  // A kid's own world, or (for a parent) a kid's world with its names but never its words.
  // The world comes from r4_world (108): summaries and entries only for the kid, or what
  // they shared. A parent's own world is the Clearing diary, read straight from the box
  // (diary.r4box.com/data.json, through the box's door, parents only): it never goes to Supabase. Seeds and shares are real rows (kid_seeds, kid_shares); this page keeps
  // them in memory for the world app (world/world-app.js) and writes each change through.
  import { sb, roleOf, gateApp, handOver } from './auth.js?v=114';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  await gateApp(session?.user, 'diary');
  const me = session?.user, PARENT = roleOf(me) === 'parent';

  async function load() {
    const { data: fam } = await sb.rpc('r4_family');
    const family = fam || [], self = family.find((f) => f.id === me.id) || { id: me.id, username: 'me', role: PARENT ? 'parent' : 'kid' };
    const kids = family.filter((f) => f.role === 'kid');
    const want = new URLSearchParams(location.search).get('kid');
    // A kid opens only their own world; a parent, their diary (no ?kid) or any kid's.
    const owner = PARENT ? kids.find((k) => k.id === want) || null : self;
    if (PARENT) {
      $('who').hidden = !kids.length;
      $('who').innerHTML = `<option value="">My diary</option>` + kids.map((k) => `<option value="${k.id}" ${k.id === owner?.id ? 'selected' : ''}>${esc(k.username)}</option>`).join('');
      $('who').onchange = () => { location.search = $('who').value ? '?kid=' + encodeURIComponent($('who').value) : ''; };
      if (!owner) return clearing(self);
    }
    const [{ data: w, error }, { data: shares }, { data: seeds }, { data: projs }] = await Promise.all([
      sb.rpc('r4_world', { p_kid: owner.id }),
      sb.from('kid_shares').select('*').eq('owner', owner.id),
      owner.id === me.id ? sb.from('kid_seeds').select('*').order('created_at') : { data: [] },
      // Their projects grow as plants: all of them for their maker, the published ones for anyone else (110).
      sb.from('projects').select('id, kit, name, published, versions, cur').eq('owner', owner.id).eq('archived', false).order('created_at'),
    ]);
    if (error) { $('body').innerHTML = `<div class="empty"><b>Can’t open this world</b><p>${esc(error.message)}</p></div>`; return; }

    // The world app keys people by username; shares are "entry:<username>:<day>" and "story:<username>:<topic id>".
    const person = (f, world) => ({ id: f.username, uid: f.id, name: f.username, role: f.role, age: null, world: { topics: world.topics, events: world.events, projects: world.projects || [] }, entries: world.entries || [] });
    const KITK = { catch: ['game', '🎮'], timer: ['app', '⏱'], page: ['page', '🌐'], comic: ['story', '📖'], drums: ['toy', '🥁'], code: ['code', '⌨'] };
    w.projects = (projs || []).map((x) => ({ id: x.id, name: x.name, published: x.published, versions: x.versions.slice(0, x.cur + 1), kind: KITK[x.kit]?.[0] || 'game', em: x.versions[x.cur]?.params?.sprite || KITK[x.kit]?.[1] || '⚒' }));
    const ownerP = person(owner, w), viewerP = owner.id === me.id ? ownerP : person(self, { topics: [], events: [], entries: [] });
    const sharedMap = {};
    for (const s of shares || []) sharedMap[`${s.kind}:${owner.username}:${s.ref}`] = { kind: s.kind, title: s.title, day: s.day, text: s.text, at: String(s.created_at).slice(0, 10) };
    // A seed planted from the home has no spot yet (x < 0): the world finds it one beside the tree.
    let mySeeds = (seeds || []).map((s) => ({ id: s.id, title: s.title, kind: s.kind, x: s.x < 0 ? null : s.x, y: s.x < 0 ? null : s.y, day: s.day }));
    const say = (t) => { const p = $('pick'); p.hidden = false; p.innerHTML = `<p>${esc(t)}</p>`; };

    window.R4Store = {
      shared: () => sharedMap,
      setShared(id, on, meta) {
        const [kind, user, ...rest] = id.split(':'), ref = rest.join(':');
        if (user !== self.username || !['entry', 'story'].includes(kind)) return;
        if (on) {
          sharedMap[id] = meta;
          sb.from('kid_shares').upsert({ owner: me.id, kind, ref, title: String(meta.title || '').slice(0, 120), day: meta.day || null, text: String(meta.text || '').slice(0, 400) })
            .then(({ error }) => { if (error) { delete sharedMap[id]; say('Could not share it: ' + error.message); } });
        } else {
          delete sharedMap[id];
          sb.from('kid_shares').delete().eq('owner', me.id).eq('kind', kind).eq('ref', ref).then(({ error }) => { if (error) say('Could not unshare it: ' + error.message); });
        }
      },
      seeds: (p) => (p.uid === me.id ? mySeeds : []),
      async plant(p, seed) {
        const { data, error } = await sb.from('kid_seeds').insert({ title: seed.title.slice(0, 60), kind: seed.kind, x: seed.x, y: seed.y }).select('id, day').single();
        if (error) { say('Could not plant it: ' + error.message); return null; }
        mySeeds = [...mySeeds, { ...seed, id: data.id, day: data.day }];
        return { id: data.id, day: data.day };
      },
      async dig(p, id) {
        const { error } = await sb.from('kid_seeds').delete().eq('id', id);
        if (error) { say('Could not dig it up: ' + error.message); return; }
        mySeeds = mySeeds.filter((s) => s.id !== id);
      },
    };
    window.FAMILY = owner.id === me.id ? [ownerP] : [viewerP, ownerP];
    window.R4_VIEWER = viewerP.id;
    window.R4_VIEW_HOME = true;   // the view is set in ⚙ Settings on the home page
    window.R4_SOLO = { person: ownerP.id, title: owner.id === me.id ? 'my world' : 'world', density: 'explore' };
    $('body').innerHTML = '';
    if (!w.topics.length) {
      document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="empty"><b>${owner.id === me.id ? 'Your world starts tonight 🌱' : 'Nothing growing yet'}</b><p>${owner.id === me.id
        ? 'What you learn with the tutor grows your tree. Chat questions become flowers, games you finish become bushes, and trips hang in the sky as stars. It’s built every night.'
        : esc(owner.username) + '’s world is built every night from what they ask Claude, the games they finish and the trips they plan.'}</p></div>`);
    }
    const s = document.createElement('script'); s.src = 'world/world-app.js?v=15'; document.body.append(s);
  }
  // ---- a parent's own world: the Clearing diary, from the box ----
  const BOX = 'https://diary.r4box.com';
  async function fromBox() {
    const get = async () => { const r = await fetch(BOX + '/data.json', { credentials: 'include', cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); };
    try { return await get(); } catch {}
    // No door cookie yet (or it ran out, a week): the same two-minute hand-over the box apps use, then again.
    handOver(session);
    try { await fetch(BOX + '/.r4door/enter?next=' + encodeURIComponent(BOX + '/data.json'), { credentials: 'include', mode: 'no-cors', cache: 'no-store' }); } catch {}
    handOver(null);
    return get();
  }
  async function clearing(self) {
    let d;
    try { d = await fromBox(); }
    catch { $('body').innerHTML = '<div class="empty"><b>Can’t reach the box</b><p>Your diary lives on r4box (the box), and it isn’t answering right now. Try again in a minute.</p></div>'; return; }
    d.events.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id)));
    window.DIARY_DATA = d;
    const world = {
      topics: d.ideas.map((i) => ({ id: i.id, slug: i.id, title: i.title, source: 'tutor', stage: i.stage, parent: i.parent || null, created: i.created, summary: i.body })),
      events: d.events.map((e) => ({ id: e.id, topic: e.idea, day: e.date, kind: e.kind, effort: e.effort || 1, summary: e.summary })),
      projects: [],
    };
    const id = self.username || 'me';
    window.FAMILY = [{ id, uid: me.id, name: id, role: 'parent', age: null, world, entries: d.entries.map((e) => ({ day: e.date, body: e.narrative })) }];
    window.R4_VIEWER = id;
    window.R4Store = { shared: () => ({}), setShared() {}, seeds: () => [] };
    let cards = null;
    window.R4_VIEW_HOME = true;
    window.R4_SOLO = {
      person: id, title: 'diary', density: 'dev', noSeeds: true, noShare: true,
      cards: [
        { id: 'timeline', title: 'Timeline', color: '#B9A6FF', sum: 'One row per idea, left to right by date' },
        { id: 'ideas', title: 'All ideas', color: '#3DD6C6', n: d.ideas.length, sum: 'The roster, longest silence first, nothing hidden' },
      ],
      // the Timeline and All ideas cards (React, bundled) load the first time one opens
      mount(cid, el, api) {
        cards ??= new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'world/cards.js?v=1'; s.onload = ok; s.onerror = no; document.body.append(s); });
        cards.then(() => window.ClearingCards.mount(cid, el, api));
      },
    };
    $('body').innerHTML = '';
    const s = document.createElement('script'); s.src = 'world/world-app.js?v=15'; document.body.append(s);
    if (d.builtAt) document.querySelector('main').insertAdjacentHTML('beforeend', `<p class="built">Built ${new Date(d.builtAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })} · ${d.ideas.length} ideas · ${d.events.length} events · from the box</p>`);
  }
  if (session) load();
</script>
</body>
</html>
