<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06050F">
  <meta name="robots" content="noindex">
  <title>r4box diary</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="world/world.css">
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; }
    :focus-visible { outline: 3px solid #F5C542; outline-offset: 2px; }
    #app { max-width: 560px; }
    .world.full { max-width: 560px; }
    .isfull .pick { width: calc(min(560px, 100vw) - 24px); }
    .solo .page { padding-bottom: max(40px, env(safe-area-inset-bottom)); }
    header select { pointer-events: auto; background: #06050Fcc; color: #F3F1FF; border: 1px solid #2F2957; border-radius: 10px; padding: 6px 8px; font: 700 13px/1 Sora, system-ui, sans-serif; }
    .empty { margin: 18px 0; padding: 16px 18px; border-radius: 18px; background: #171331; border: 1px solid #2F2957; }
    .empty b { display: block; font: 800 18px/1.2 Unbounded, sans-serif; margin-bottom: 6px; }
    .empty p { margin: 0; color: #ACA5D6; font-size: 14px; }
  </style>
</head>
<body>
<div id="app">
  <header><button class="back" id="back" hidden aria-label="Back">‹</button><a class="mark" href="/" id="markA"><i aria-hidden="true"></i>r4box</a><span class="sep">/</span><h1 id="title">diary</h1><span class="grow"></span><select id="who" hidden aria-label="Whose world"></select></header>
  <div class="world" id="worldBox"><canvas id="cv" aria-label="Your world, grown from your diary"></canvas><div class="hint" id="hint"></div><div class="tools" id="tools" hidden><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zHome" aria-label="Whole world">⤢</button><button id="zFull" aria-label="Full screen">⛶</button><button id="plantBtn" class="plant">🌱 Plant</button></div><div class="legend" id="legend"></div></div>
  <main class="page">
    <div class="pick" id="pick" hidden></div>
    <p class="note" id="private" hidden></p>
    <div id="body"><p class="note">Loading your world…</p></div>
  </main>
</div>
<script src="world/story-kit.js"></script>
<script src="diary-tree.js"></script>
<script src="world/world-parts.js"></script>
<script src="world/world-layout.js"></script>
<script src="world/world-engine.js"></script>
<script type="module">
  // A kid's own world, or (for a parent) a kid's world with its names but never its words.
  // The world comes from r4_world (108): summaries and entries only for the kid, or what
  // they shared. Seeds and shares are real rows (kid_seeds, kid_shares); this page keeps
  // them in memory for the world app (world/world-app.js) and writes each change through.
  import { sb, roleOf } from './auth.js';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  const me = session?.user, PARENT = roleOf(me) === 'parent';

  async function load() {
    const { data: fam } = await sb.rpc('r4_family');
    const family = fam || [], self = family.find((f) => f.id === me.id) || { id: me.id, username: 'me', role: PARENT ? 'parent' : 'kid' };
    const kids = family.filter((f) => f.role === 'kid');
    const want = new URLSearchParams(location.search).get('kid');
    // A kid opens only their own world; a parent, any kid's (theirs is the Clearing diary).
    const owner = PARENT ? kids.find((k) => k.id === want) || kids[0] : self;
    if (!owner) { $('body').innerHTML = '<div class="empty"><b>No kids yet</b><p>Each kid’s world grows here from what they ask, play and plan.</p></div>'; return; }
    if (PARENT) {
      $('who').hidden = kids.length < 2;
      $('who').innerHTML = kids.map((k) => `<option value="${k.id}" ${k.id === owner.id ? 'selected' : ''}>${esc(k.username)}</option>`).join('');
      $('who').onchange = () => { location.search = '?kid=' + encodeURIComponent($('who').value); };
    }
    const [{ data: w, error }, { data: shares }, { data: seeds }] = await Promise.all([
      sb.rpc('r4_world', { p_kid: owner.id }),
      sb.from('kid_shares').select('*').eq('owner', owner.id),
      owner.id === me.id ? sb.from('kid_seeds').select('*').order('created_at') : { data: [] },
    ]);
    if (error) { $('body').innerHTML = `<div class="empty"><b>Can’t open this world</b><p>${esc(error.message)}</p></div>`; return; }

    // The world app keys people by username; shares are "entry:<username>:<day>" and "story:<username>:<topic id>".
    const person = (f, world) => ({ id: f.username, uid: f.id, name: f.username, role: f.role, age: null, world: { topics: world.topics, events: world.events }, entries: world.entries || [] });
    const ownerP = person(owner, w), viewerP = owner.id === me.id ? ownerP : person(self, { topics: [], events: [], entries: [] });
    const sharedMap = {};
    for (const s of shares || []) sharedMap[`${s.kind}:${owner.username}:${s.ref}`] = { kind: s.kind, title: s.title, day: s.day, text: s.text, at: String(s.created_at).slice(0, 10) };
    let mySeeds = (seeds || []).map((s) => ({ id: s.id, title: s.title, kind: s.kind, x: s.x, y: s.y, day: s.day }));
    const say = (t) => { const p = $('pick'); p.hidden = false; p.innerHTML = `<p>${esc(t)}</p>`; };

    window.R4Store = {
      shared: () => sharedMap,
      setShared(id, on, meta) {
        const [kind, user, ...rest] = id.split(':'), ref = rest.join(':');
        if (user !== self.username || !['entry', 'story'].includes(kind)) return;
        if (on) {
          sharedMap[id] = meta;
          sb.from('kid_shares').upsert({ owner: me.id, kind, ref, title: String(meta.title || '').slice(0, 120), day: meta.day || null, text: String(meta.text || '').slice(0, 400) })
            .then(({ error }) => { if (error) { delete sharedMap[id]; say('Could not share it: ' + error.message); } });
        } else {
          delete sharedMap[id];
          sb.from('kid_shares').delete().eq('owner', me.id).eq('kind', kind).eq('ref', ref).then(({ error }) => { if (error) say('Could not unshare it: ' + error.message); });
        }
      },
      seeds: (p) => (p.uid === me.id ? mySeeds : []),
      async plant(p, seed) {
        const { data, error } = await sb.from('kid_seeds').insert({ title: seed.title.slice(0, 60), kind: seed.kind, x: seed.x, y: seed.y }).select('id, day').single();
        if (error) { say('Could not plant it: ' + error.message); return null; }
        mySeeds = [...mySeeds, { ...seed, id: data.id, day: data.day }];
        return { id: data.id, day: data.day };
      },
      async dig(p, id) {
        const { error } = await sb.from('kid_seeds').delete().eq('id', id);
        if (error) { say('Could not dig it up: ' + error.message); return; }
        mySeeds = mySeeds.filter((s) => s.id !== id);
      },
    };
    window.FAMILY = owner.id === me.id ? [ownerP] : [viewerP, ownerP];
    window.R4_VIEWER = viewerP.id;
    window.R4_SOLO = { person: ownerP.id, title: owner.id === me.id ? 'my world' : 'world', density: 'explore' };
    $('body').innerHTML = '';
    if (!w.topics.length) {
      document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="empty"><b>${owner.id === me.id ? 'Your world starts tonight 🌱' : 'Nothing growing yet'}</b><p>${owner.id === me.id
        ? 'What you learn with the tutor grows your tree. Chat questions become flowers, games you finish become bushes, and trips hang in the sky as stars. It’s built every night.'
        : esc(owner.username) + '’s world is built every night from what they ask Claude, the games they finish and the trips they plan.'}</p></div>`);
    }
    const s = document.createElement('script'); s.src = 'world/world-app.js'; document.body.append(s);
  }
  if (session) load();
</script>
</body>
</html>
