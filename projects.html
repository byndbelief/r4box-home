<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>projects · r4box</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Projects + workbench (design system: projects kit). The kit's pages run as they are
       (projects/projects-*.js); this page gives them the signed-in person, the family's projects
       (public.projects, 110) and Claude (the project-build function). Everything a project runs is
       shown in a sandboxed frame: scripts, but no access to r4box.com or your sign-in. -->
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
  </style>
  <link rel="stylesheet" href="world/world.css?v=57">
  <link rel="stylesheet" href="projects/projects.css?v=67">
  <style>:root { --mint: #C9FFF8; } #app { max-width: 760px; margin: 0 auto; } [hidden] { display: none !important; } main.page { box-sizing: border-box; width: 100%; max-width: 100%; } .bbar { min-width: 0; flex-wrap: wrap; } .pcard { flex-wrap: wrap; } .pcard .pmain { min-width: 150px; } .pacts { margin-left: auto; }
    .talkbar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 22px; background: #141130; border: 1px solid #3DD6C688; box-shadow: 0 10px 24px #000c; font-size: 14px; max-width: calc(100% - 32px); }
    .talkbar i { font-style: normal; animation: talkp 1.4s ease-in-out infinite; } @keyframes talkp { 50% { opacity: .45; } }
    .talkbar button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 16px; background: #FF5A4A; color: #fff; font-weight: 800; }</style>
</head>
<body>
<div id="app">
<header><button class="back" id="back" hidden aria-label="Back to projects">‹</button><a class="mark" id="mark" href="/"><i aria-hidden="true"></i>r4box</a><span class="sep">/</span><h1 id="title">projects</h1><span class="grow"></span><button class="gear" id="toClaude" hidden aria-label="Back to the Claude chat" title="Back to the Claude chat, with this page in the message box" style="margin-right:6px;color:var(--gold,#F5C542)">✦</button><button class="gear" id="gear" aria-label="Settings">⚙</button></header>
<main class="page" style="padding-top:calc(58px + env(safe-area-inset-top))"><div id="body"><p class="note">Loading…</p></div></main>
<dialog class="psheet" id="sheet"></dialog>
</div>
<script src="world/story-kit.js?v=2"></script>
<script src="projects/beautifier.min.js?v=54"></script>
<script src="projects/structure.js?v=54"></script>
<script src="projects/projects-data.js?v=61"></script>
<script type="module">
  import { sb, roleOf, gateApp } from './auth.js?v=114';
  const FN = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  await gateApp(session?.user, 'projects');
  const me = session.user.id;
  const call = async (fn, payload) => {
    const { data: { session: s } } = await sb.auth.getSession();
    const r = await fetch(FN + fn, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
    return j;
  };

  const [{ data: fam }, { data: rows, error }, built] = await Promise.all([
    sb.rpc('r4_family'),
    sb.from('projects').select('*').order('updated_at', { ascending: false }),
    call('project-build', {}).catch(() => ({ left: null })),
  ]);
  window.FAMILY = (fam || []).map((f) => ({ id: f.id, name: f.username, role: f.role, age: null }));
  if (!window.FAMILY.some((f) => f.id === me)) window.FAMILY.push({ id: me, name: 'me', role: roleOf(session.user), age: null });
  window.R4Me = me;
  // ✦: back to the Claude chat on the r4box box (os.r4box.com, only reachable on the tailnet), with what's on screen
  // (the project, its version and link, its console errors) in the message box, to finish and send. Parents only; it
  // shows only when the box answers. Both sides open each other in one named tab, so going back and forth reuses it.
  if (roleOf(session.user) === 'parent') fetch('https://os.r4box.com/r4.css', { mode: 'no-cors', cache: 'no-store' }).then(() => {
    const b = document.getElementById('toClaude'); b.hidden = false;
    b.onclick = () => {
      const h = window.R4Here ? window.R4Here() : null;
      let t = h ? `On ${h.name} v${h.v} (${location.href})` : `On ${location.href}`;
      if (h && h.errors.length) t += `\nIts console: ${h.errors.join(' | ')}`;
      window.open('https://os.r4box.com/c/last?draft=' + encodeURIComponent(t + '\n\n'), 'r4-os.r4box.com');
    };
  }).catch(() => {});
  if (error) document.getElementById('body').innerHTML = `<p class="note">Projects couldn’t load: ${error.message}</p>`;

  // The kit keeps its list in memory and calls save(list) after every change; here each project
  // that changed since it was last written is saved: the maker writes the row, a helper saves
  // through project_save (versions, which one shows, and the name).
  const fromRow = (r) => ({ id: r.id, owner: r.owner, kit: r.kit, name: r.name, published: r.published, from: r.remix_of || undefined, collab: r.collab || [], requests: r.requests || [], versions: r.versions, cur: r.cur, archived: !!r.archived, brief: r.brief || '', cover: r.cover || '' });
  let list = (rows || []).map(fromRow);
  const last = new Map(list.map((p) => [p.id, JSON.stringify(p)]));
  // Every project is code: one of mine still showing a kit version (made by an older page) gets the
  // kit's page as files, as its next version. Its kit versions stay in its history.
  const toCode = list.filter((p) => p.owner === me && p.kit !== 'code' && !p.versions[p.cur].files);
  for (const p of toCode) {
    const v = p.versions[p.cur];
    p.versions = [...p.versions, { v: Math.max(...p.versions.map((x) => x.v)) + 1, at: Date.now(), by: me, note: 'Now real code: the kit’s page as files', params: v.params, files: window.R4Projects.kitFiles(p.kit, v.params) }];
    p.cur = p.versions.length - 1;
  }
  let chain = Promise.resolve();
  function persist(all) {
    list = all;
    for (const p of all) {
      const now = JSON.stringify(p);
      if (last.get(p.id) === now) continue;
      const was = last.get(p.id); last.set(p.id, now);
      if (p.owner !== me && !(p.collab || []).includes(me)) continue;   // someone else's (asking to help goes through project_ask_help)
      chain = chain.then(async () => {
        const { error: e } = p.owner === me
          ? await sb.from('projects').upsert({ id: p.id, owner: p.owner, kit: p.kit, name: (p.name || 'Untitled').slice(0, 80), published: !!p.published, remix_of: p.from || null,
              collab: p.collab || [], requests: p.requests || [], versions: p.versions, cur: p.cur, archived: !!p.archived, cover: p.cover || '', updated_at: new Date().toISOString() })
          : await sb.rpc('project_save', { p_id: p.id, p_versions: p.versions, p_cur: p.cur, p_name: p.name });
        if (e) { if (was) last.set(p.id, was); else last.delete(p.id); toastErr('Couldn’t save ' + p.name + ': ' + e.message); }
      });
    }
    return chain;
  }
  function toastErr(t) { const el = document.createElement('div'); el.className = 'ctoast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 4000); }
  Object.assign(window.R4Projects, { all: () => list, save: persist });
  if (toCode.length) persist(list);

  window.R4Build = {
    left: built.left,
    saved: () => chain,
    // Claude changes (or answers about) a project. Saved first, so it reads what's on screen.
    // start: a project just begun from an idea, which Claude builds whole (a kid's first few a day are free)
    async ask(p, ask, files, logs, image, chat, start) {
      await chain;
      // a kit project sends the page it builds, so Claude can rebuild it as code when the kit can't do it
      const html = window.R4Projects.isCode(p) ? undefined : window.R4Projects.html(p);
      const r = await call('project-build', { project: p.id, ask, files: files || undefined, logs: logs || undefined, image: image || undefined, chat: chat || undefined, html, start: start || undefined });
      if (r.left !== undefined) this.left = r.left;
      if (r.brief) p.brief = r.brief;   // Claude's note on the project (it saves it itself)
      if (!r.files) return r;
      const t = await tryOut(p, r);
      // project-build saved the new version itself (kept even if this page had closed): take it, one thing per line
      if (t.saved) {
        p.versions = t.saved.versions.map((x, i) => (i === t.saved.cur && x.srv ? (({ srv, ...y }) => ({ ...y, files: window.R4Structure.structure(y.files) }))(x) : x));
        p.cur = t.saved.cur; if (t.saved.name) p.name = t.saved.name;
      }
      return t;
    },
    // 💡 Help: Claude's note for the lines of one file ({ help: [{ n, text }] }); counts as a question, not a build.
    explain: (p, file, src) => call('project-build', { project: p.id, explain: { file, src } }),
    // Deleting is for good: the row goes (its chat cards stay, saying it's gone).
    async remove(id) { await chain; const { error: e } = await sb.from('projects').delete().eq('id', id); if (e) throw new Error('Couldn’t delete: ' + e.message); last.delete(id); },
    askHelp: async (id) => { const { error: e } = await sb.rpc('project_ask_help', { p_id: id }); if (e) throw new Error(e.message); },
    // A line in the family chat with the project's card (family-chat builds the card from the row).
    post: (text, id) => call('family-chat', { text, ref: { type: 'project', id } }),
    // 🧱 What they asked needs something r4box doesn't let projects do yet (Claude says so, with what r4box would need).
    // A parent sends it to Claude on r4box: os fills in a task for r4box-home (to read and start, never started by
    // itself). A kid asks a parent in the family chat, with the project's card.
    wall(p, wall, asked) {
      if (roleOf(session.user) !== 'parent') return call('family-chat', { text: `🧱 ${p.name} needs something r4box can’t do yet: ${wall}. Can a parent send it to Claude on r4box?`, ref: { type: 'project', id: p.id } });
      const t = `A project on r4box.com hit a limit of r4box itself, not of its code.\nProject: ${p.name} (projects row ${p.id}, ${location.origin}/projects.html?open=${p.id})\nThey asked: ${String(asked || '').slice(0, 600)}\nThe projects Claude says r4box would need: ${wall}\n\nMake r4box able to do it if it can be done safely (projects run in a sandboxed frame: r4box-home projects.html and projects/*.js; what the projects Claude is told it can and can't do is in r4box's supabase/functions/project-build), then update that list and check the project works. If it shouldn't be allowed, say why.`;
      window.open('https://os.r4box.com/#project=r4box-home&task=' + encodeURIComponent(t), 'r4-os.r4box.com');
    },
  };

  // Before anyone sees a change: run it in a hidden preview for a moment, and if it throws errors as it starts,
  // give them back to Claude to fix (project-build with fix; no build used), up to twice. What's left over is said.
  function trial(files) {
    return new Promise((done) => {
      const f = document.createElement('iframe'), errs = [];
      f.dataset.check = '1'; f.setAttribute('sandbox', 'allow-scripts'); f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:fixed;left:0;top:0;width:390px;height:700px;border:0;opacity:0;pointer-events:none;z-index:-1';
      const on = (e) => { const l = e.source === f.contentWindow && e.data && e.data.r4log; if (l && l[0] === 'error') errs.push(String(l[1]).slice(0, 300)); };
      addEventListener('message', on);
      f.srcdoc = window.R4Projects.codeDoc(files);
      document.body.append(f);
      setTimeout(() => { removeEventListener('message', on); f.remove(); done([...new Set(errs)].slice(0, 8)); }, 2500);
    });
  }
  async function tryOut(p, r) {
    for (let round = 0; ; round++) {
      const errs = await trial(r.files);
      if (!errs.length) return r;
      if (round === 2) return { ...r, say: r.say + ' (It still shows an error as it starts: ' + errs[0] + ')' };
      let f;
      try { f = await call('project-build', { project: p.id, fix: true, ask: 'Running it showed errors as it started: fix them.', files: r.files, logs: errs.map((x) => ['error', x]) }); }
      catch { return r; }
      if (!f.files) return { ...r, say: r.say + (f.say ? ' ' + f.say : '') };
      r = { ...r, files: f.files, saved: f.saved || r.saved, say: r.say + (f.say ? ' ' + f.say : '') };
    }
  }

  // The voice kit in a preview (project-voice, ElevenLabs). r4.say / r4.sfx / r4.music: the frame asks,
  // project-voice makes (or finds) the clip, the frame plays its URL. r4.talk: a live conversation with
  // the project's character, run here (the frame has no microphone), its lines and turns passed back.
  window.R4Build.voice = (q) => call('project-voice', q);
  let voiceNoted = false, talking = null;
  const fromPreview = (e) => [...document.querySelectorAll('iframe:not([data-check])')].some((f) => f.contentWindow === e.source);   // (not a hidden trial run)
  addEventListener('message', async (e) => {
    const d = e.data || {};
    if (!(d.r4voice || d.r4talk || d.r4hangup) || !fromPreview(e)) return;
    if (d.r4hangup) return talking && talking.src === e.source && talking.end();
    if (d.r4talk) return talk(e.source, d.r4talk);
    const m = d.r4voice, q = m.q && (m.q.say ? { say: m.q.say } : m.q.sfx ? { sfx: m.q.sfx } : m.q.music ? { music: m.q.music } : null);
    let back;
    try { back = q ? { id: m.id, ...(await call('project-voice', q)) } : { id: m.id, error: 'Not a sound.' }; }
    catch (err) { back = { id: m.id, error: err.message }; if (!voiceNoted) { voiceNoted = true; toastErr(err.message); } }
    e.source.postMessage({ r4voiceback: back }, '*');
  });
  // The microphone for a preview: the sandboxed frame is refused it, so a project that asks for sound gets it
  // through here. The bar says which project is listening, with a Stop; it ends when the project stops, runs
  // again or closes. The frame gets the sound only, never the page.
  let hearing = null;
  addEventListener('message', (e) => {
    const m = (e.data || {}).r4mic;
    if (!m || !fromPreview(e)) return;
    if (m.stop) return hearing && hearing.src === e.source && hearing.end(true);
    if (m.start) listenFor(e.source, m.start, String(m.name || '').slice(0, 60));
  });
  async function listenFor(src, want, name) {
    const tell = (x) => { try { src.postMessage({ r4mic: x }, '*'); } catch {} };
    if (hearing && hearing.src !== src) hearing.end();
    if (hearing) return tell({ ok: 1 });
    const bar = document.createElement('div'); bar.className = 'talkbar';
    bar.innerHTML = '<i>🎤</i><span></span><button>Stop</button>';
    bar.querySelector('span').textContent = (name || 'This project') + ' is listening';
    let stream = null, ac = null, done = false, watch;
    const end = (fromFrame) => {
      if (done) return; done = true; clearInterval(watch); bar.remove(); if (hearing && hearing.src === src) hearing = null;
      stream?.getTracks().forEach((t) => t.stop()); ac?.close().catch(() => {});
      if (!fromFrame) tell({ ended: 1 });
    };
    hearing = { src, end };
    bar.querySelector('button').onclick = () => end();
    bar.onclick = () => ac?.state === 'suspended' && ac.resume();
    watch = setInterval(() => { if (!fromPreview({ source: src })) end(true); }, 1000);
    document.body.append(bar);
    try {
      const pick = (k) => (want && typeof want === 'object' && typeof want[k] === 'boolean' ? want[k] : undefined);
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: pick('echoCancellation'), noiseSuppression: pick('noiseSuppression'), autoGainControl: pick('autoGainControl') } });
      if (done) return stream.getTracks().forEach((t) => t.stop());
      ac = new AudioContext(); await ac.resume().catch(() => {});
      if (ac.state === 'suspended') bar.querySelector('span').textContent = 'Tap here so ' + (name || 'this project') + ' can listen';
      ac.onstatechange = () => { if (ac.state === 'running') bar.querySelector('span').textContent = (name || 'This project') + ' is listening'; };
      const node = ac.createScriptProcessor(2048, 1, 1);
      node.onaudioprocess = (ev) => { const pcm = new Float32Array(ev.inputBuffer.getChannelData(0)); try { src.postMessage({ r4mic: { pcm, rate: ac.sampleRate } }, '*', [pcm.buffer]); } catch {} };
      ac.createMediaStreamSource(stream).connect(node); node.connect(ac.destination);   // (it outputs silence; it runs only when connected)
      tell({ ok: 1 });
    } catch (err) {
      const no = /permission|denied|notallowed/i.test(String(err && (err.name + err.message))) ? 'The microphone is off for r4box.com: allow it in the browser.' : (err && err.message) || 'No microphone.';
      tell({ no }); toastErr(no); end(true);
    }
  }
  async function talk(src, { id, q }) {
    const send = (ev) => { try { src.postMessage({ r4talkev: { id, ...ev } }, '*'); } catch {} };
    if (talking) return send({ type: 'end', error: 'Already talking: hang up first.' });
    const bar = document.createElement('div'); bar.className = 'talkbar';
    bar.innerHTML = '<i>🎙</i><span>Starting…</span><button>End</button>';
    document.body.append(bar);
    const state = (t) => { bar.querySelector('span').textContent = t; };
    let conv = null, log = null, done = false, watch;
    const end = async () => {
      if (done) return; done = true; clearInterval(watch); bar.remove(); talking = null;
      const cid = conv && conv.getId && conv.getId();
      try { await conv?.endSession(); } catch {}
      send({ type: 'end' });
      if (cid && log) call('project-voice', { talked: { log, conversation: cid } }).catch(() => {});
    };
    talking = { src, end };
    bar.querySelector('button').onclick = end;
    // the preview closed or the page went away: hang up
    watch = setInterval(() => { if (![...document.querySelectorAll('iframe')].some((f) => f.contentWindow === src)) end(); }, 1000);
    try {
      const [{ Conversation }, t] = await Promise.all([
        import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.30.0/+esm'),
        call('project-voice', { talk: { persona: q.persona, voice: q.voice, project: q.project } }),
      ]);
      log = t.log;
      if (done) return;
      conv = await Conversation.startSession({
        signedUrl: t.signedUrl, connectionType: 'websocket',
        overrides: { agent: q.first ? { firstMessage: q.first } : {}, tts: { voiceId: t.voiceId } },
        dynamicVariables: { persona: t.persona, project: String(q.project || 'a project').slice(0, 80), who: t.who },
        onConnect: () => state('Listening… talk any time'),
        onModeChange: ({ mode }) => { state(mode === 'speaking' ? 'Speaking…' : 'Listening… talk any time'); send({ type: 'mode', mode }); },
        onMessage: ({ message, source }) => send({ type: 'message', who: source === 'ai' ? 'character' : 'me', text: message }),
        onDisconnect: () => end(),
        onError: (msg) => console.warn('talk', msg),
      });
      if (done) conv.endSession().catch(() => {});
    } catch (err) {
      const msg = /permission|denied|notallowed/i.test(String(err && (err.name + err.message))) ? 'Talking needs the microphone: allow it for r4box.com.' : err.message || 'Talking didn’t start.';
      toastErr(msg); send({ type: 'end', error: msg }); done = true; clearInterval(watch); bar.remove(); talking = null;
    }
  }

  // ?v= changes with each update, so a phone never runs a stale bench (Pages lets browsers keep files 10 minutes).
  const V = document.querySelector('link[href*="projects.css"]').href.split('?v=')[1];
  for (const src of ['projects/projects-code.js?v=' + V, 'projects/projects-app.js?v=' + V]) await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.body.append(s); });
  // A helper's changes and new family projects come in when the page comes back.
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    const { data } = await sb.from('projects').select('*').order('updated_at', { ascending: false });
    if (!data) return;
    for (const r of data) { const p = fromRow(r), i = list.findIndex((x) => x.id === p.id), s = JSON.stringify(p); if (last.get(p.id) !== s && (i < 0 || JSON.stringify(list[i]) === last.get(p.id))) { last.set(p.id, s); i < 0 ? list.push(p) : (list[i] = p); } }
  });
</script>
</body>
</html>
