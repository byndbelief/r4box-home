<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>r4box</title>
  <meta name="description" content="r4box: the family game room, and the box that runs the rest.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script type="module">import { forward } from './door.js'; forward();</script>
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --bg: #000000; --panel: #0D0B1F; --glow: 0 0 0 1px #B9A6FF0d, 0 0 18px -6px #7B6BFF40; --panel-2: #141130; --line: #251F48; --ink: #F3F1FF; --muted: #ACA5D6; --faint: #7A73A8;
      --teal: #3DD6C6; --teal-ink: #062A26; --gold: #F5C542; --hot: #FF5A4A; --hot-soft: #4A2230; --violet: #B9A6FF; --mint: #C9FFF8;
      --display: "Unbounded", "Arial Black", Impact, sans-serif;
      --body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --grad-mark: conic-gradient(from 210deg, var(--teal), var(--violet), var(--gold), var(--hot), var(--teal));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100dvh;
      background: var(--bg); background-attachment: fixed; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg canvas { width: 100%; height: 100%; display: block; }
    #bifwrap { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 40%, #0000 82%); mask-image: linear-gradient(180deg, #000 0%, #000 40%, #0000 82%); opacity: .9; }
    #bifwrap.faint { opacity: .35; }
    #treewrap { top: 70px; bottom: 210px; }
    #ecowrap { opacity: .55; }

    .page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
    @media (min-width: 760px) { .page { padding: 24px 32px 32px; } }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font: 800 22px/1 var(--display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
    .mark i { width: 1.05em; height: 1.05em; border-radius: 22%; background: var(--grad-mark); box-shadow: inset 0 0 0 .18em var(--bg), 0 0 18px #3DD6C666; animation: spin 18s linear infinite; }
    .mark small { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); align-self: flex-end; margin-bottom: .1em; }
    @keyframes spin { to { filter: hue-rotate(360deg); } }
    .xpill { font: 600 12px/1 var(--mono); color: var(--muted); padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
    .xpill b { color: var(--teal); }
    .eyebrow { font: 800 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--teal); margin: 0 0 12px; }
    h1 { font: 800 clamp(40px, 9vw, 64px)/.98 var(--display); letter-spacing: -.035em; margin: 0; text-wrap: balance; }
    #hi.long { font-size: clamp(30px, 7.4vw, 56px); overflow-wrap: anywhere; }
    button { font: inherit; }
    .btn { appearance: none; cursor: pointer; border: 1.5px solid #ffffff22; background: #ffffff0e; color: var(--ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); font: 700 16px/1 var(--display); min-height: 50px; padding: 0 22px; box-shadow: 0 10px 34px #3DD6C64d; width: 100%; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .45; cursor: default; }
    .link { all: unset; cursor: pointer; color: var(--teal); text-decoration: underline; font-weight: 700; }
    .link.quiet { color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; box-shadow: var(--glow); }
    label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
    input, select { font: 400 16px/1.2 var(--body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
    .msg { margin: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--panel-2); }
    .msg.bad { background: var(--hot-soft); }

    /* login (3a: who's here, then passkey) */
    /* the tree login (design system: Login, baby tree): trace buds, blossoms and fruit, then passkey */
    #treein { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 12px; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #treein .tbox { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: crosshair; max-width: 720px; width: 100%; margin: 0 auto; }
    #treein .tbox > div { position: absolute; inset: 0; }
    #treein canvas { display: block; }
    #treein svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #treein .tkey { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--muted); }
    #treein .tkey span { display: flex; align-items: center; gap: 6px; }
    #treein .tkey i { width: 9px; height: 9px; border-radius: 9px; }
    #treein .tfoot { display: grid; justify-items: center; gap: 10px; }
    #treein .msg { max-width: 420px; text-align: center; }
    #login .body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; max-width: 520px; padding-top: 40px; }
    .who { display: flex; gap: 10px; flex-wrap: wrap; }
    .who button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #ffffff0e; border: 1px solid #ffffff22; font-weight: 700; }
    .who button:hover { background: #ffffff1a; }
    .who img, .who .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
    .who .av { display: grid; place-items: center; font: 800 12px/1 var(--display); color: var(--teal-ink); background: linear-gradient(160deg, var(--teal), var(--violet)); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .sheet { position: fixed; inset: 0; z-index: 5; display: grid; place-items: end center; background: #00000099; }
    .sheet > div { width: min(390px, calc(100% - 24px)); margin: 12px; padding: 22px 20px 18px; border-radius: 24px; background: var(--panel-2); border: 1px solid var(--line); display: grid; justify-items: center; gap: 12px; text-align: center; }
    .sheet .ring { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; border: 2px solid var(--line); color: var(--muted); }

    @media (prefers-reduced-motion: reduce) { .mark i { animation: none; } }

    /* the kids' tutor (Claude, text only) and a parent's flagged chats */
    .flags button { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #ffffff0a; }
    .flags button:hover { background: #ffffff14; }
    .flags small { color: var(--muted); }
    #tutor { position: fixed; inset: 0; z-index: 4; background: var(--bg); display: flex; flex-direction: column; }
    #tutor header { padding: max(14px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
    #tutor header .t { display: grid; gap: 2px; min-width: 0; }
    #tutor header b { font: 800 18px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tutor header small { color: var(--muted); font-size: 12px; }
    #tutor header .acts { display: flex; gap: 8px; flex: none; }
    .tlog { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
    .bub { max-width: 86%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
    .bub p { margin: 0 0 8px; } .bub p:last-child { margin: 0; }
    .bub.user { align-self: flex-end; background: var(--teal); color: var(--teal-ink); border-bottom-right-radius: 4px; }
    .bub.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .bub.wait { color: var(--muted); }
    .bub.flagged { box-shadow: 0 0 0 2px var(--gold); }
    .tnote { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 440px; }
    .tlist { display: grid; gap: 6px; }
    .tlist button { all: unset; cursor: pointer; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tsend { display: flex; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
    .tsend textarea { flex: 1; font: 400 16px/1.4 var(--body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; max-height: 160px; }
    .tsend .btn { flex: none; background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
    .tset { display: grid; gap: 10px; }
    .tset .row label { flex: 1 1 90px; }

    /* ---------- home: the family world behind, then today, apps, recent (design system: r4box home) ---------- */
    #home { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100dvh; background: var(--bg); box-shadow: 0 0 0 1px #ffffff0c; }
    #home > header { position: absolute; z-index: 3; inset: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 16px 0; pointer-events: none; }
    #home > header > * { pointer-events: auto; }
    #home > header .mark { font-size: 18px; }
    #home > header .sep { color: var(--faint); }
    #home > header h1 { font: 800 18px/1 var(--display); margin: 0; letter-spacing: -.02em; }
    .gear { all: unset; cursor: pointer; margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: #000000cc; color: var(--muted); font-size: 18px; }
    .gmenu { position: absolute; z-index: 15; right: 16px; top: calc(max(14px, env(safe-area-inset-top)) + 48px); width: 210px; padding: 6px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 32px #000b; }
    .gmenu button, .gmenu a { all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: block; padding: 10px 12px; border-radius: 11px; font-size: 14px; font-weight: 700; }
    .gmenu button:hover, .gmenu a:hover { background: #ffffff0c; }
    .gmenu small { display: block; font-weight: 600; font-size: 11.5px; color: var(--faint); }
    .gmenu { width: 250px; }
    .gmenu > p { margin: 6px 12px 4px; font: 700 10.5px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
    .gmenu > p small { display: inline; letter-spacing: 0; text-transform: none; font-weight: 500; }
    .gmenu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
    .gmenu .gview button { display: grid; grid-template-columns: 28px 1fr; column-gap: 8px; align-items: center; padding: 8px 10px; }
    .gmenu .gview span { grid-row: span 2; font-size: 19px; text-align: center; } .gmenu .gview b { font-size: 14px; } .gmenu .gview em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); }
    .gmenu .gview button.on { background: #ffffff12; box-shadow: inset 2px 0 0 var(--teal); }
    /* the first screen: the world, then Claude and four apps; the rest is a swipe up */
    .hero { display: flex; flex-direction: column; height: 100dvh; min-height: 520px; }
    .world { position: relative; overflow: hidden; flex: 1; min-height: 240px; }
    .world .pick { position: absolute; z-index: 3; left: 12px; right: 12px; bottom: 12px; margin: 0; max-height: 70%; overflow: auto; }
    .hquick { padding: 0 16px; }
    .hquick .hcmd { margin-top: 0; }
    .hquick .hres { top: auto; bottom: calc(100% + 6px); }
    .hquick .hdock { margin-top: 12px; }
    /* which world: mine (the default) or the family's */
    .wswitch { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top) + 64px);   /* below the header that sits over the world */
      left: 50%; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 99px; background: #0D0B1Fcc; border: 1px solid var(--line); backdrop-filter: blur(6px); }
    .wswitch button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 99px; font: 700 13px/1 var(--body); color: var(--muted); }
    .wswitch button[aria-pressed="true"] { background: var(--violet, #B9A6FF); color: #150F33; }
    /* talk from home: the chat's latest, and a call */
    .htalk { display: flex; gap: 8px; margin-top: 10px; }
    .htalk button { all: unset; cursor: pointer; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
    .htalk .hpeek { position: relative; flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; padding: 10px 12px; font-size: 13.5px; }
    .hpeek b { flex: none; color: var(--violet); } .hpeek span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .hpeek .badge { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--hot, #FF5A4A); color: #fff; font: 700 11px/18px var(--body); text-align: center; font-style: normal; }
    .htalk .hvid { flex: none; padding: 0 14px; font-size: 18px; font-weight: 700; display: grid; place-items: center; }
    .htalk .hvid.live { background: var(--teal); color: var(--teal-ink, #062A26); border-color: var(--teal); font-size: 14px; animation: hvpulse 1.6s ease-in-out infinite; }
    .htalk .hvid.mine { color: var(--teal); border-color: #3DD6C688; font-size: 14px; }
    @keyframes hvpulse { 50% { box-shadow: 0 0 0 6px #3DD6C633; } }
    @media (prefers-reduced-motion: reduce) { .hvid.live { animation: none; } }
    dialog.qd { border: 1px solid var(--line); border-radius: 18px; background: #0D0B1F; color: var(--ink); padding: 14px; width: min(420px, calc(100% - 24px)); box-shadow: 0 20px 50px #000c; }
    dialog.qd::backdrop { background: #000b; }
    dialog.qd header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: static; padding: 0; background: none; border: 0; }
    dialog.qd header b { font: 800 16px/1 var(--display); } dialog.qd header a { color: var(--teal); font-weight: 700; font-size: 13px; text-decoration: none; }
    .qlog { max-height: min(50dvh, 380px); overflow: auto; display: grid; gap: 6px; padding: 2px; }
    .qlog p { margin: 0; padding: 7px 10px; border-radius: 12px; background: #141130; font-size: 14px; overflow-wrap: anywhere; justify-self: start; max-width: 85%; }
    .qlog p b { display: block; font-size: 11.5px; color: var(--violet); } .qlog p.me { justify-self: end; background: #3DD6C61f; } .qlog p.c b { color: var(--gold, #F5C542); } .qlog .none { color: var(--muted); background: none; }
    #qsend { display: flex; gap: 8px; margin-top: 10px; } #qsend input { flex: 1; min-width: 0; box-sizing: border-box; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: #000; color: var(--ink); font: inherit; font-size: 16px; }
    #qsend button, .qd .qx { all: unset; cursor: pointer; padding: 0 14px; border-radius: 12px; background: var(--teal); color: #062A26; font-weight: 800; display: grid; place-items: center; }
    .qd .qx { background: none; color: var(--muted); padding: 4px 6px; font-size: 18px; }
    .qnote { margin: 6px 0 0; font-size: 12px; color: var(--muted); min-height: 1em; }
    .cpicks { display: grid; gap: 7px; margin-top: 4px; } .cpicks button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 13px; border: 1px solid var(--line); background: #141130; font-weight: 700; }
    .cpicks .dot { width: 10px; height: 10px; border-radius: 50%; }
    .hquick .hgo input { padding-right: 52px; } .hquick .hgo:has(#hsd) input { padding-right: 96px; }
    .hquick .hgo .hacts { position: absolute; right: 6px; top: 0; height: 46px; margin: 0; display: flex; align-items: center; gap: 4px; }
    .hquick .hgo .hacts button { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 10px; font-size: 16px; }
    .hmore { all: unset; cursor: pointer; display: grid; place-items: center; height: calc(34px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
    .hmore i { width: 40px; height: 5px; border-radius: 9px; background: var(--faint); opacity: .6; animation: hmore 2.4s ease-in-out infinite; }
    @keyframes hmore { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .hmore i { animation: none; } }
    .hpage { border-top: 1px solid var(--line); }
    .dens-pilot .hquick .hgo .hacts { height: 38px; } .dens-pilot .hquick .hgo .hacts button { width: 30px; height: 30px; }
    .world canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    .legend { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.2; padding: 4px 10px; border-radius: 99px; background: #000000b3; border: 1px solid #ffffff1a; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px); }
    .legend i { width: 7px; height: 7px; border-radius: 9px; flex: none; }
    .hpage { padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
    .pick { box-shadow: var(--glow); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 16px; }
    .pick h2 { font: 800 18px/1.2 var(--display); margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .pick h2 small { font: 700 12px/1.3 var(--body); color: var(--muted); }
    .pick p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .pick ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 14px; }
    .pick li span { color: var(--faint); font-size: 12px; margin-right: 6px; }
    .pick .go { display: inline-flex; margin-top: 12px; min-height: 40px; align-items: center; padding: 0 14px; border-radius: 12px; background: var(--teal); color: var(--teal-ink); font-weight: 700; font-size: 14px; text-decoration: none; }
    .hhead { display: flex; align-items: center; gap: 10px; }
    .hhead > div:first-child { flex: 1; min-width: 0; }
    .hhead h2 { margin: 0; font: 800 24px/1.05 var(--display); letter-spacing: -.03em; }
    .hhead p { margin: 3px 0 0; font-size: 12.5px; color: var(--faint); }
    .hcmd { position: relative; margin-top: 12px; }
    .hcmd input { min-height: 46px; padding: 0 16px; border-radius: 14px; background: var(--panel); }
    .hres { position: absolute; z-index: 8; left: 0; right: 0; top: calc(100% + 6px); padding: 5px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 30px #000b; }
    .hres a { box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 10px; color: inherit; text-decoration: none; }
    .hres a:hover, .hres a.on { background: #ffffff0d; }
    .hres b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hres small { font-size: 11px; color: var(--faint); }
    .hres .g { text-align: center; font: 600 15px/1 var(--mono); }
    .hres a.ask b { color: var(--gold); }
    .htoday { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px; }
    .htoday::-webkit-scrollbar { display: none; }
    .htoday a { flex: none; box-sizing: border-box; width: 200px; display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--c); color: inherit; text-decoration: none; }
    .htoday .g { font-size: 17px; line-height: 1.1; color: var(--c); }
    .htoday b { display: block; font-size: 13.5px; line-height: 1.25; }
    .htoday small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
    #home h3.k { font: 700 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 22px 0 10px; }
    .hdock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

  <!-- the tutor: a kid's chats with Claude; for a parent, a flagged chat (read only) -->

  <div class="sheet" id="sheet" hidden><div>
    <div class="ring" id="ring">◎</div>
    <b id="sheett">Sign in to r4box</b>
    <span id="sheets" style="font-size:13px;color:var(--muted)"></span>
  </div></div>

  <script src="diary-tree.js?v=10"></script>
  <script src="ecosystem.js"></script>
  <script src="together.js?v=3"></script>
  <script type="module">
    import { sb, FAMILY, roleOf, nameOf, handOver } from './auth.js';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hr = (h) => `${h % 12 || 12}:00 ${h % 24 < 12 ? 'AM' : 'PM'}`;   // an hour, standard: 21 -> 9:00 PM

    // The live x: the logistic map at r = 4, one step every half second.
    let x = Math.random() * .8 + .1;
    setInterval(() => { x = 4 * x * (1 - x); if (x < 1e-6 || x > 1 - 1e-6) x = Math.random(); document.querySelectorAll('.x').forEach((e) => (e.textContent = x.toFixed(4))); }, 500);

    // ---------------- signed out ----------------
    let who = null;
    // ---------------- the tree login ----------------
    // A baby diary tree whose buds, blossoms and fruit you trace (four or more), then your
    // passkey: the trace is the ritual, the passkey is the sign-in (and picks who you are).
    // "Use a password or email link" is the way in without a passkey on this device.
    const SAPLING = (() => {
      const day = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
      const roots = [['r1', 16], ['r2', 14], ['r3', 12], ['r4', 9], ['r5', 7], ['r6', 4]];
      const ideas = roots.map(([id, n]) => ({ id, created: day(n), stage: 'explored', parent: null })), events = [];
      roots.forEach(([id, n]) => { for (let i = 0; i < 4; i++) events.push({ id: `ev-${id}-${i}`, date: day(Math.max(0, n - i)), idea: id, kind: 'deepen', effort: 1 + (i % 2) }); });
      [['r1', 2], ['r3', 1], ['r5', 2]].forEach(([p, at], j) => {
        const d = day(Math.max(0, roots.find((r) => r[0] === p)[1] - at)), id = 'k' + j;
        ideas.push({ id, created: d, stage: 'explored', parent: p });
        for (let i = 0; i < 3; i++) events.push({ id: `ev-${id}-${i}`, date: d, idea: id, kind: 'deepen', effort: 1 });
      });
      events.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
      return { ideas, events };
    })();
    const JIT = [[-.14, .1], [.06, -.12], [.16, .04], [.1, -.08], [-.05, .13], [-.12, -.06], [-.08, .05], [.13, .12], [.02, -.1]];
    const DOTC = { spark: '#B9A6FF', branch: '#FF5A4A', ship: '#F5C542' };
    // Nine dots on a loose 3x3 grid over the trunk (rows: fruit, blossoms, buds), each tied to the tree by a twig.
    function codeDots(nodes, w, h) {
      if (nodes.length < 9) return [];
      const ys = nodes.map((n) => n.y), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const sx = Math.min(w * .3, 150), sy = Math.min((y1 - y0) * .42, sx * 1.9), cy = (y0 + y1) / 2 - sy * .1, kinds = ['ship', 'branch', 'spark'], out = [];
      for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
        const [jx, jy] = JIT[row * 3 + col], x = w / 2 + (col - 1 + jx) * sx, y = cy + (row - 1 + jy) * sy;
        let a = null, bd = Infinity;
        nodes.forEach((n) => { if (n.y < y + 18) return; const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; a = n; } });
        if (!a) nodes.forEach((n) => { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; a = n; } });
        const bend = (col - 1 || (row % 2 ? 1 : -1)) * 14;
        out.push({ x, y, kind: kinds[row], ax: a.x, ay: a.y, cx: (a.x + x) / 2 + bend, cy: (a.y + y) / 2 + 6 });
      }
      return out;
    }
    let dots = [], tpath = [], tbad = false, stopTree = null, tbusy = false;
    function drawDots() {
      const L = (a, b) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${tbad ? '#FF5A4A' : '#F3F1FF'}" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>`;
      $('tsvg').innerHTML = tpath.slice(1).map((i, k) => L(dots[tpath[k]], dots[i])).join('')
        + dots.map((n) => `<path d="M${n.ax} ${n.ay} Q${n.cx} ${n.cy} ${n.x} ${n.y}" fill="none" stroke="#3A335F" stroke-width="4.5" stroke-linecap="round"/><path d="M${n.ax} ${n.ay} Q${n.cx} ${n.cy} ${n.x} ${n.y}" fill="none" stroke="${DOTC[n.kind]}" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>`).join('')
        + dots.map((n) => `<circle cx="${n.x}" cy="${n.y}" r="16" fill="${DOTC[n.kind]}" opacity=".22"/><circle cx="${n.x}" cy="${n.y}" r="8.5" fill="${DOTC[n.kind]}" style="filter:drop-shadow(0 0 8px ${DOTC[n.kind]})"/>`).join('')
        + tpath.map((i) => `<circle cx="${dots[i].x}" cy="${dots[i].y}" r="22" fill="none" stroke="${tbad ? '#FF5A4A' : DOTC[dots[i].kind]}" stroke-width="2"/>`).join('');
    }
    function showTree(msg) {
      $('home').hidden = true; $('login').hidden = true; $('treein').hidden = false; $('bifwrap').hidden = true;
      $('treemsg').hidden = !msg; $('treemsg').textContent = msg || ''; $('treemsg').className = 'msg bad';
      tpath = []; tbad = false;
      if (!stopTree) stopTree = window.mountDiaryTree($('tcv'), SAPLING, {
        palette: { '--bark': '#3A335F', '--c-park': '#4A4470', '--c-growth': '#B9A6FF', '--c-turn': '#FF5A4A', '--c-close': '#3DD6C6', '--accent': '#F5C542', '--ground': '#000000' },
        flow: { colors: ['#3DD6C6', '#C9FFF8', '#B9A6FF', '#F5C542', '#FF5A4A'], wave: 70, speed: .45, tail: 2.6 },
        spin: false, fill: true, segScale: 1.7, withTips: true, onLayout: (n, w, h) => { dots = codeDots(n, w, h); drawDots(); },
      });
      drawDots();
    }
    function hideTree() { $('treein').hidden = true; if (stopTree) { stopTree(); stopTree = null; } }
    function hitDot(e) {
      const b = $('tbox').getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
      let best = -1, bd = 30 * 30;
      dots.forEach((n, i) => { const d = (n.x - mx) ** 2 + (n.y - my) ** 2; if (d < bd) { bd = d; best = i; } });
      if (best >= 0 && !tpath.includes(best)) { tpath.push(best); drawDots(); }
    }
    $('tbox').addEventListener('pointerdown', (e) => { if (tbusy) return; $('tbox').setPointerCapture(e.pointerId); tpath = []; tbad = false; $('treemsg').hidden = true; hitDot(e); });
    $('tbox').addEventListener('pointermove', (e) => { if (e.buttons && !tbusy) hitDot(e); });
    $('tbox').addEventListener('pointerup', async () => {
      if (tbusy) return;
      if (tpath.length && tpath.length < 4) { tbad = true; drawDots(); setTimeout(() => { tbad = false; tpath = []; drawDots(); }, 600); return; }
      if (!tpath.length) return;
      if (!window.PublicKeyCredential) { showLogin('This browser has no passkeys: use your password.', true); return; }
      tbusy = true; who = null; sheet('wait');
      const { error } = await sb.auth.signInWithPasskey();
      tbusy = false;
      if (error) {
        sheet(null); tpath = []; drawDots();
        const m = (error.code || '') + error.message;
        showTree(/disabled/.test(m) ? 'Passkeys are not switched on yet: use a password or email link.'
          : /not_found|NotAllowed|abort/i.test(m) ? 'No passkey for you on this device yet: sign in with a password or email link once, then add one.'
          : 'That did not work: ' + error.message);
        return;
      }
      sheet('ok');
    });
    $('tfall').onclick = () => { hideTree(); showLogin(); };

    function showLogin(msg, bad) {
      hideTree(); $('home').hidden = true; $('login').hidden = false; $('bifwrap').hidden = false; $('treewrap').hidden = true; $('ecowrap').hidden = true; $('bifwrap').classList.remove('faint'); if (live) { live.destroy(); live = null; }
      $('who').innerHTML = FAMILY.map((f, i) => `<button data-i="${i}">${f.avatar ? `<img src="${f.avatar}" alt="">` : `<span class="av">${esc(f.name[0].toUpperCase())}</span>`}${esc(f.name)}</button>`).join('');
      pick(null);
      if (msg) say(msg, bad);
    }
    function pick(f) {
      who = f;
      $('hi').textContent = f ? `Hi, ${f.name}.` : "Who's here?";
      $('hi').classList.toggle('long', !!f && f.name.length > 10);
      $('who').hidden = !!f; $('how').hidden = !f; $('pw').hidden = true; $('mail').hidden = true; $('loginmsg').hidden = true;
      $('usemail').hidden = !(f && f.mail);
    }
    function say(text, bad) { const m = $('loginmsg'); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); m.hidden = false; }
    $('who').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) pick(FAMILY[+b.dataset.i]); });
    $('notme').onclick = () => pick(null);
    $('usepw').onclick = () => { $('how').hidden = true; $('pw').hidden = false; $('pass').focus(); };
    $('usemail').onclick = () => { $('how').hidden = true; $('mail').hidden = false; $('mailto').textContent = who.email; };
    document.querySelectorAll('[data-back]').forEach((b) => (b.onclick = () => pick(who)));

    $('passkey').onclick = async () => {
      if (!window.PublicKeyCredential) { say('This browser has no passkeys: use your password.', true); return; }
      sheet('wait');
      const { error } = await sb.auth.signInWithPasskey();
      if (error) {
        sheet(null);
        say(/disabled/.test(error.code || error.message) ? 'Passkeys are not switched on yet: use your password.'
          : /not_found|NotAllowed|abort/i.test((error.code || '') + error.message) ? 'No passkey for you on this device yet: sign in with your password once, then add one.'
          : 'That did not work: ' + error.message, true);
        return;
      }
      sheet('ok');
    };
    $('pw').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: who.email, password: $('pass').value });
      $('pass').value = '';
      if (error) say(/invalid/i.test(error.message) ? 'That password is not right.' : error.message, true);
    };
    $('mail').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithOtp({ email: who.email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + '/' } });
      say(error ? error.message : `Check ${who.email} for your sign-in link.`, !!error);
      if (!error) $('mail').hidden = true;
    };
    function sheet(st) {
      $('sheet').hidden = !st;
      $('ring').textContent = st === 'ok' ? '✓' : '◎';
      $('ring').style.borderColor = st === 'ok' ? 'var(--teal)' : 'var(--line)';
      $('sheett').textContent = st === 'ok' ? 'Passkey confirmed' : 'Sign in to r4box';
      $('sheets').textContent = st === 'ok' ? 'Opening the box…' : `Use Face ID or your passkey${who ? ' for ' + who.name : ''}.`;
    }

    // ---------------- signed in ----------------
    // The box's apps and the game room (other r4box.com subdomains) open inside open.html, full
    // screen, so the installed app never leaves r4box.com (Android puts its own address bar on
    // another address). open.html hands over the sign-in: the door's cookie, the game room's fragment.
    function go(href) {
      const u = new URL(href);
      if (u.protocol === 'https:' && u.hostname.endsWith('.r4box.com')) location.assign('/open.html?to=' + encodeURIComponent(u.href));
      else location.assign(u.href);
    }
    // ---------------- the home ----------------
    // The family world fills the top (together.js: everyone's tree on one ground, roots for
    // games played together, stars for shared trips). Below: greeting and view, Where to?,
    // today, apps with live status, recent across apps, the family. All of it is real:
    // r4_family_world (names only for your own world, or for a parent), r4_home (your
    // turns, games together, trips), box_status (the box apps, a parent only), the chat,
    // the game room's news for you, the trips.
    const DOTS = ['#F5C542', '#3DD6C6', '#FF5A4A', '#B9A6FF', '#C9FFF8'];
    const KIND = { battleship: ['⚓', 'Battleship', ''], golf: ['⛳', 'Putt Post', 'golf.html'], duel: ['💥', 'Hilltop Duel', 'duel.html'], cards: ['🃏', 'Chaos Cards', 'cards.html'], war: ['⚔️', 'War', 'war.html'] };
    const gameUrl = (kind, id) => `https://games.r4box.com/${KIND[kind]?.[2] || ''}${id ? '#game=' + id : ''}`;
    const DENSITY = [
      { id: 'play', name: 'Play', em: '🧸', blurb: 'A few big controls' },
      { id: 'explore', name: 'Explore', em: '🧭', blurb: 'The main things, a little text' },
      { id: 'pilot', name: 'Pilot', em: '✈️', blurb: 'Every instrument at once' },
      { id: 'dev', name: 'Developer', em: '⌘', blurb: 'Pilot, plus the details', parent: true },
    ];
    const iso = (d) => d.toISOString().slice(0, 10);
    const dn = (d) => Math.round(Date.parse(String(d).slice(0, 10) + 'T00:00:00Z') / 864e5);
    function streak(days) {
      const set = new Set(days.map(dn)); if (!set.size) return { now: 0, sinceLast: null };
      const t = dn(iso(new Date())); let d = set.has(t) ? t : set.has(t - 1) ? t - 1 : null, now = 0;
      if (d != null) while (set.has(d)) { now++; d--; }
      return { now, sinceLast: t - Math.max(...set) };
    }
    const agoOf = (ts) => { const m = Math.max(0, (Date.now() - new Date(ts)) / 60e3); return m < 1 ? 'now' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
    let H = null, live = null;
    const fam = () => H?.family || [];
    const person = (id) => fam().find((p) => p.id === id);
    const nm = (id) => person(id)?.name || 'someone';

    async function showHome(session) {
      sheet(null);
      const user = session.user, role = roleOf(user), name = nameOf(user);
      // Came from a box page that asked for a sign-in: go back there.
      const next = new URLSearchParams(location.search).get('next');
      if (next) {
        try { const u = new URL(next); if (u.protocol === 'https:' && (u.hostname === 'r4box.com' || u.hostname.endsWith('.r4box.com'))) { history.replaceState(null, '', '/'); go(u.href); return; } } catch {}
      }
      ME = { role, name, id: user.id };
      hideTree(); $('login').hidden = true; $('home').hidden = false;
      for (const id of ['bifwrap', 'treewrap', 'ecowrap']) $(id).hidden = true;
      await loadHome();
      if (role === 'parent') showFlags();
      if (location.hash === '#tutor' && role !== 'parent') openTutor();
      if (location.hash === '#settings') { history.replaceState(null, '', '/'); setTimeout(() => $('gear').click(), 0); }   // from another app's "change the view"
      offerPasskey();
    }

    async function loadHome() {
      const parent = ME.role === 'parent', since = new Date(Date.now() - 7 * 864e5).toISOString();
      const [w, h, box, reads, chat, news, items, mine, shares, projects, off] = await Promise.all([
        sb.rpc('r4_family_world'), sb.rpc('r4_home'),
        parent ? sb.from('box_status').select('*') : { data: [] },
        sb.from('chat_reads').select('read_at').eq('user_id', ME.id).maybeSingle(),
        sb.from('chat_messages').select('id, author, is_claude, body, image, ref, reply_to, created_at').order('id', { ascending: false }).limit(30),
        sb.from('chaos_events').select('icon, message, game_kind, game_id, created_at').eq('player', ME.id).order('id', { ascending: false }).limit(6),
        sb.from('trip_items').select('id, trip, title, created_by, by_claude, created_at').gte('created_at', since).neq('created_by', ME.id).order('created_at', { ascending: false }).limit(6),
        sb.from('kid_events').select('topic, day, kind, summary, created_at').eq('kid', ME.id).order('day', { ascending: false }).limit(8),
        sb.from('kid_shares').select('owner, kind, ref, title, day, text, created_at').order('created_at', { ascending: false }).limit(8),
        sb.from('projects').select('id', { count: 'exact', head: true }).eq('published', true).eq('archived', false),
        parent ? { data: null } : sb.from('tutor_settings').select('apps_off').eq('kid', ME.id).maybeSingle(),
      ]);
      const family = (w.data || []).map((p, i) => ({ id: p.id, name: p.username, role: p.role, dot: DOTS[i % DOTS.length], world: { topics: p.topics, events: p.events } }));
      const readAt = reads.data?.read_at ? new Date(reads.data.read_at) : null;
      const msgs = chat.data || [];
      H = { family, home: h.data || { turns: [], together: [], trips: [] }, box: Object.fromEntries((box.data || []).map((b) => [b.app, b])),
        unread: msgs.filter((m) => m.author !== ME.id && (!readAt || new Date(m.created_at) > readAt)).length,
        msgs, news: news.data || [], items: items.data || [], mine: mine.data || [], shares: shares.data || [], projects: projects.count || 0, off: new Set(off.data?.apps_off || []) };
      drawWorld(); renderHome();
    }

    // The ground: each person's tree, plus what they share as roots (games) and stars (trips).
    // Their own game and trip topics stay in their worlds; the shared ones come from the
    // game room's results and the trips' who's going.
    const worldMode = () => { try { return localStorage.getItem('r4.world.' + ME.id) === 'family' ? 'family' : 'me'; } catch { return 'me'; } };
    function drawWorld() {
      const today = iso(new Date());
      const ground = fam().map((p) => ({ ...p, world: { topics: p.world.topics.filter((t) => t.source === 'tutor'), events: p.world.events } }));
      for (const g of H.home.together) for (const x of g.who) {
        const p = ground.find((q) => q.id === x.id); if (!p) continue;
        const id = 'game-' + g.kind;
        p.world.topics.push({ id, slug: id, source: 'game', title: KIND[g.kind]?.[1] || g.kind, stage: 'explored', created: today });
        p.world.events = [...p.world.events, { id: id + p.id, topic: id, day: today, kind: 'deepen', effort: 1, meta: { played: x.played } }];
      }
      for (const t of H.home.trips) for (const p of ground) {
        if (Array.isArray(t.members) && !t.members.includes(p.id)) continue;
        const id = 'trip-' + t.id;
        p.world.topics.push({ id, slug: id, source: 'trip', title: t.name, stage: 'explored', created: today, trip: t.id });
      }
      // My world (the default) or the family's, on one ground; the choice stays on this device.
      const mode = worldMode();
      $('wswitch').querySelectorAll('[data-w]').forEach((b) => { b.setAttribute('aria-pressed', String(b.dataset.w === mode)); b.onclick = () => { try { localStorage.setItem('r4.world.' + ME.id, b.dataset.w); } catch {} $('pick').hidden = true; drawWorld(); }; });
      if (live) live.destroy();
      live = window.mountTogether($('cv'), mode === 'me' ? ground.filter((p) => p.id === ME.id) : ground, { onPick: pickWorld, solo: mode === 'me' });
    }
    function worldLink(p) {
      if (p.id === ME.id) return '/diary.html';
      return ME.role === 'parent' && p.role === 'kid' ? `/diary.html?kid=${encodeURIComponent(p.id)}` : null;
    }
    function pickWorld(hit) {
      const box = $('pick');
      if (!hit) { box.hidden = true; return; }
      if (hit.person) {
        const p = person(hit.person.id), n = p.world.topics.length, st = streak(p.world.events.map((e) => e.day)), href = worldLink(p);
        box.innerHTML = `<h2>${p.id === ME.id ? 'My world' : esc(p.name) + '’s world'} <small>${n} thing${n === 1 ? '' : 's'} growing${st.now ? ' · ' + st.now + '-day streak' : ''}</small></h2>
          <p>${p.id === ME.id ? (ME.role === 'parent' ? 'Your tree is your Clearing diary: every idea a limb.' : 'Your tree grows from what you ask, play and plan.')
            : href ? 'You see the names of what grows here, never their words.' : `This one is ${esc(p.name)}’s: you see its shape here, on the family ground.`}</p>
          ${href ? `<a class="go" href="${href}">Open ${p.id === ME.id ? 'my world' : 'it'} ›</a>` : ''}`;
      } else {
        const s = hit.shared;
        box.innerHTML = `<h2>${s.source === 'game' ? KIND[s.slug.slice(5)]?.[0] || '🌀' : '✶'} ${esc(s.title)} <small>${s.source === 'game' ? 'a root between your trees' : 'a star over your trees'}</small></h2>
          <ul>${s.who.map((x) => `<li><span>${esc(fam()[x.pi]?.name || '')}</span>${s.source === 'game' ? x.played + ' games together' : 'going'}</li>`).join('')}</ul>
          <a class="go" href="${s.source === 'game' ? gameUrl(s.slug.slice(5)) : '/trip.html?t=' + encodeURIComponent(s.slug.slice(5))}">${s.source === 'game' ? 'Play' : 'Open the trip'} ›</a>`;
      }
      box.hidden = false;
    }

    // The view (r4.density.<id>, on this device) is one setting for every app, set from ⚙ Settings here.
    function viewOf() { try { const v = localStorage.getItem('r4.density.' + ME.id); if (DENSITY.some((d) => d.id === v && (!d.parent || ME.role === 'parent'))) return v; } catch {} return ME.role === 'parent' ? 'pilot' : 'explore'; }
    function densityOf() { const v = viewOf(); return v === 'dev' ? 'pilot' : v; }   // the home shows Developer as Pilot
    function renderHome() {
      const parent = ME.role === 'parent', dens = densityOf(), play = dens === 'play', tight = dens === 'pilot';
      $('home').classList.remove('dens-play', 'dens-explore', 'dens-pilot'); $('home').classList.add('dens-' + dens);
      const me = person(ME.id) || { world: { topics: [], events: [] } };
      const st = streak(me.world.events.map((e) => e.day));
      const grew = st.now ? `${st.now}-day streak` : st.sinceLast != null ? `last grew ${st.sinceLast}d ago` : 'nothing yet';
      const B = (k) => H.box[k], boxLine = (k) => { const b = B(k); return !b ? 'no word from the box' : Date.now() - new Date(b.at) > 15 * 60e3 ? 'box quiet ' + agoOf(b.at) : b.line; };
      const turns = H.home.turns, next = H.home.trips.find((t) => t.ends && t.ends >= iso(new Date()));
      const daysTo = next?.starts ? dn(next.starts) - dn(iso(new Date())) : null;
      const tripLine = next ? (daysTo > 0 ? `${next.name} · in ${daysTo} day${daysTo === 1 ? '' : 's'}` : `${next.name} · now`) : 'plan a trip';
      const turnLine = turns.length ? `your turn · ${KIND[turns[0].kind]?.[1] || ''}` : 'no turns waiting';

      const APPS = [
        ...(parent ? [
          { k: 'os', g: '◎', c: '#3DD6C6', href: 'https://os.r4box.com/', s: boxLine('os'), hot: B('os')?.hot },
          { k: 'diary', g: '✎', c: '#F5C542', href: '/diary.html', s: grew },
          { k: 'term', g: '›_', c: '#C9FFF8', href: 'https://term.r4box.com/', s: boxLine('term') },
          { k: 'code', g: '{ }', c: '#B9A6FF', href: 'https://code.r4box.com/', s: boxLine('code') },
          { k: 'browser', g: '◫', c: '#FF5A4A', href: 'https://browser.r4box.com/', s: boxLine('browser') },
          { k: 'ntfy', g: '◉', c: '#F5C542', href: 'https://ntfy.r4box.com/', s: boxLine('ntfy') },
        ] : [
          { k: 'diary', g: '🌱', c: '#3DD6C6', href: '/diary.html', s: grew, emoji: true },
          { k: 'tutor', g: '✦', c: '#F5C542', href: '#tutor', s: 'ask anything', ask: true },
        ]),
        { k: 'games', g: '⚓', c: '#3DD6C6', href: turns[0] ? gameUrl(turns[0].kind, turns[0].id) : 'https://games.r4box.com/', s: turnLine, hot: !!turns.length, emoji: true },
        { k: 'chat', g: '💬', c: '#B9A6FF', href: '/chat.html', s: H.unread ? `${H.unread} new` : 'all read', badge: H.unread, emoji: true },
        { k: 'projects', g: '⚒', c: '#7DF0C8', href: '/projects.html', s: H.projects ? `${H.projects} in the family` : 'make things' },
        { k: 'trip', g: '✈️', c: '#F5C542', href: next ? '/trip.html?t=' + encodeURIComponent(next.id) : '/trip.html', s: tripLine, emoji: true },
        ...(parent ? [{ k: 'admin', g: '⚙', c: '#ACA5D6', href: '/admin.html', s: 'box, kids, devices' }] : []),
      ].filter((a) => !H.off.has(a.k));   // apps a parent turned off in admin
      const PLAY = parent ? APPS : APPS.filter((a) => ['games', 'diary', 'chat', 'tutor', 'projects'].includes(a.k));

      const today = [
        ...(parent && B('os')?.hot ? [{ g: '◎', c: '#F5C542', t: B('os').line, s: B('os').detail || 'os', href: 'https://os.r4box.com/' }] : []),
        ...(H.off.has('games') ? [] : turns).slice(0, 2).map((t) => { const vs = (t.players || []).filter((p) => p !== ME.id); return { g: KIND[t.kind]?.[0] || '🎮', c: '#3DD6C6', t: 'Your turn', s: `${KIND[t.kind]?.[1] || t.kind}${vs.length ? ' vs ' + vs.map(nm).join(', ') : ' · solo'}`, href: gameUrl(t.kind, t.id) }; }),
        ...(H.unread && !H.off.has('chat') ? [{ g: '💬', c: '#B9A6FF', t: `${H.unread} new in chat`, s: (() => { const m = H.msgs.find((x) => x.author !== ME.id); return m ? `${m.is_claude ? 'Claude' : nm(m.author)}: ${m.body || '📷 Photo'}` : ''; })(), href: '/chat.html' }] : []),
        ...(next && !H.off.has('trip') ? [{ g: '✈️', c: '#F5C542', t: next.name, s: `${daysTo > 0 ? `in ${daysTo} day${daysTo === 1 ? '' : 's'}` : 'now'}${next.place ? ' · ' + next.place : ''}`, href: '/trip.html?t=' + encodeURIComponent(next.id) }] : []),
        parent ? { g: '✎', c: '#F5C542', t: 'Clearing rollup', s: `tonight 23:30 · ${grew}`, href: '/diary.html' }
          : H.off.has('diary') ? null : st.sinceLast === 0 || st.sinceLast === 1 ? { g: '🌳', c: '#B9A6FF', t: 'Your world grew', s: grew, href: '/diary.html' } : { g: '🌱', c: '#B9A6FF', t: 'Grow your world', s: 'ask, play or plan something', href: '/diary.html' },
      ];

      const titleOf = Object.fromEntries(me.world.topics.map((t) => [t.id, t.title]));
      const recent = [
        ...H.msgs.filter((m) => m.author !== ME.id).slice(0, 4).map((m) => ({ g: '💬', c: '#B9A6FF', t: `${m.is_claude ? 'Claude' : nm(m.author)}: ${m.body || '📷 Photo'}`, at: m.created_at, href: '/chat.html' })),
        ...H.news.map((n) => ({ g: n.icon || KIND[n.game_kind]?.[0] || '🎮', c: '#3DD6C6', t: n.message, at: n.created_at, href: n.game_id ? gameUrl(n.game_kind, n.game_id) : 'https://games.r4box.com/' })),
        ...H.items.map((i) => ({ g: '✈️', c: '#F5C542', t: `${i.by_claude ? '✦ Claude' : nm(i.created_by)} added ${i.title}`, sub: H.home.trips.find((t) => t.id === i.trip)?.name, at: i.created_at, href: `/trip.html?t=${encodeURIComponent(i.trip)}&i=${encodeURIComponent(i.id)}` })),
        ...H.mine.filter((e) => e.summary).slice(0, 4).map((e) => ({ g: parent ? '✎' : '🌳', c: '#B9A6FF', t: e.summary, sub: titleOf[e.topic], at: e.day + 'T20:00:00', href: '/diary.html' })),
      ].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, tight ? 9 : 6);

      const glyph = (a) => `<span class="g${a.emoji ? ' emoji' : ''}">${a.g}</span>`;
      // The family chat: the last few messages (not thread replies), straight into the chat.
      const line = (m) => (m.ref && ({ poll: '📊 Poll', item: '📍 Trip place', call: '📹 Video call', story: '🌳 Shared a story', added: '✦ Added to a trip', project: '⚒ ' + (m.ref.name || 'A project') }[m.ref.type])) || m.body || (m.image ? '📷 Photo' : '');
      const chatTop = H.msgs.filter((m) => !m.reply_to).slice(0, tight ? 4 : 3).reverse();
      const chatCard = play || !chatTop.length ? '' : `<h3 class="k">Family chat</h3><a class="hchat" href="/chat.html">${chatTop.map((m) => `<span class="l${m.is_claude ? ' c' : ''}"><b>${esc(m.is_claude ? 'Claude' : nm(m.author))}</b><span>${esc(line(m))}</span></span>`).join('')}<span class="go">Open the chat ›<small>${H.unread ? H.unread + ' new' : 'all caught up'}</small></span></a>`;
      // the first screen: Claude (Where to?) and four apps, each with its badge
      const pref = (parent ? ['os', 'diary', 'chat', 'projects'] : ['games', 'chat', 'diary', 'projects']).map((k) => APPS.find((a) => a.k === k)).filter(Boolean);
      const QUICK = play ? PLAY.slice(0, 4) : [...pref, ...APPS.filter((a) => !pref.includes(a))].slice(0, 4);   // an app turned off makes room for the next
      const dock = (list, big, small) => `<div class="hdock${big ? ' big' : ''}">${list.map((a) => `<a href="${a.href}" style="--c:${a.c}"${a.ask ? ' data-ask="1"' : ''}>${glyph(a)}<b>${a.k}</b>${small ? `<small class="${a.hot ? 'hot' : ''}">${esc(a.s)}</small>` : ''}${a.badge ? `<span class="badge">${a.badge > 99 ? '99+' : a.badge}</span>` : ''}</a>`).join('')}</div>`;
      $('hquick').innerHTML = `${play ? '' : `<form class="hcmd hgo" id="hgo"><input id="q" placeholder="${parent ? 'Where to? Or what should Claude do?' : 'Where to? Ask Claude, or name a seed…'}" autocomplete="off" aria-label="Where to, or start Claude"><div class="hres" id="hits" hidden></div>
          <div class="hacts"><button type="submit" class="hclaude" aria-label="Start Claude" title="Start Claude">✦</button>${parent ? '' : '<button type="button" class="hseed" id="hsd" aria-label="Plant seed" title="Plant seed">🌱</button>'}</div><p class="hmsg" id="hmsg" hidden></p></form>`}
        ${dock(QUICK, play, false)}
        ${H.off.has('chat') ? '' : talkBar()}`;
      $('htop').innerHTML = `${play ? '' : `<div class="htoday">${today.filter(Boolean).map((t) => `<a href="${t.href}" style="--c:${t.c}"><span class="g">${t.g}</span><span><b>${esc(t.t)}</b><small>${esc(t.s)}</small></span></a>`).join('')}</div>`}`;
      $('hrest').innerHTML = `${chatCard}<h3 class="k">Apps</h3>
        ${dock(play ? PLAY : APPS, play, !play)}
        ${play ? '' : `<h3 class="k">Recent</h3><div class="hrecent">${recent.length ? recent.map((r) => `<a href="${r.href}"><span class="g" style="color:${r.c}">${r.g}</span><span class="t">${esc(r.t)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span><span class="a">${agoOf(r.at)}</span></a>`).join('') : '<div class="hempty">Nothing new this week.</div>'}</div>`}
        ${familyCard()}`;
      wireHome(APPS);
    }

    // ---- talk from home: the latest in the family chat (tap: a quick chat right here) and 📹 ----
    const CHAT_FN = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/family-chat';
    const said = (m) => (m.ref && ({ poll: '📊 Poll', item: '📍 Trip place', call: '📹 Video call', story: '🌳 Shared a story', added: '✦ Added to a trip', project: '⚒ ' + (m.ref.name || 'A project'), trip: '✈️ ' + (m.ref.name || 'A trip') }[m.ref.type])) || m.body || (m.image ? '📷 Photo' : '');
    function talkBar() {
      const m = H.msgs.find((x) => !x.reply_to);
      return `<div class="htalk"><button class="hpeek" id="hpeek" aria-label="Chat with the family">${m ? `<b>${esc(m.is_claude ? 'Claude' : nm(m.author))}</b><span>${esc(said(m))}</span>` : '<span>Say something to the family…</span>'}${H.unread ? `<i class="badge">${H.unread > 99 ? '99+' : H.unread}</i>` : ''}</button><button class="hvid" id="hvid" aria-label="Video call">📹</button></div>`;

    // The quick chat: the last messages and a box to write in; everything else is in the chat itself.

          e.preventDefault();
          const v = { daily_cap: +f.cap.value, start_hour: +f.start.value, end_hour: +f.end.value, tz, updated_at: new Date().toISOString() };
          const { error } = await sb.from('tutor_settings').update(v).eq('kid', r.kid);
          f.querySelector('small').textContent = error ? 'Could not save: ' + error.message : 'Saved.';
        };
        $('tlog').append(f);
      }
    }

    // After a password sign-in, offer a passkey for this device (once per device).
    async function offerPasskey() {
      $('offer').hidden = true;
      let skip = false; try { skip = localStorage.getItem('r4-nokey') === '1'; } catch {}
      if (skip || !window.PublicKeyCredential || !sb.auth.passkey) return;
      const { data, error } = await sb.auth.passkey.list();
      if (!error && Array.isArray(data) && data.length === 0) $('offer').hidden = false;
    }
    $('addkey').onclick = async () => {
      const { error } = await sb.auth.registerPasskey();
      $('offer').innerHTML = error ? `<p class="msg bad">Could not add a passkey: ${esc(error.message)}</p>` : '<p class="msg">Passkey added. Next time: tap your name, then Face ID.</p>';
    };
    $('nokey').onclick = () => { try { localStorage.setItem('r4-nokey', '1'); } catch {} $('offer').hidden = true; };

    // ---------------- session ----------------
    // One sign-out: the box's door too (reachable only on the tailnet; best effort).
    const doorOut = () => { handOver(null); fetch('https://os.r4box.com/.r4door/out', { mode: 'no-cors', credentials: 'include' }).catch(() => {}); };
    // Signed out in the game room or at the box: out of here too.
    if (new URLSearchParams(location.search).has('signout')) {
      await sb.auth.signOut();
      doorOut();
      history.replaceState(null, '', '/');
    }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        doorOut();
        showTree();
      }
      else if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) showHome(session);
      else if (!session && event === 'INITIAL_SESSION') showTree();
    });
  </script>

  <script>
    // The bifurcation diagram, drawn left to right as r climbs from 2.5 to 4.
    // Coloured as the games colour the curve: teal calm, violet doubling, gold at the onset, hot in chaos.
    (() => {
      const cv = document.getElementById('bif'), ctx = cv.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const R0 = 2.5, R1 = 4, ONSET = 3.5699;
      const colour = (r) => r < 3 ? [61, 214, 198] : r < 3.449 ? [185, 166, 255] : r < ONSET ? [245, 197, 66]
        : (r > 3.8284 && r < 3.857) ? [201, 255, 248] : [255, 90, 74];
      let w, h, col, raf;
      function size() {
        const dpr = Math.min(devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
        w = cv.width = Math.round(b.width * dpr); h = cv.height = Math.round(b.height * dpr);
        ctx.clearRect(0, 0, w, h); col = 0;
      }
      function column(i) {
        const r = R0 + (R1 - R0) * (i / w), [cr, cg, cb] = colour(r);
        const pts = r < ONSET ? 60 : 260, a = r < ONSET ? .5 : .14;
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        let x = 0.5;
        for (let k = 0; k < 300; k++) x = r * x * (1 - x);
        for (let k = 0; k < pts; k++) { x = r * x * (1 - x); ctx.fillRect(i, h * 0.08 + (1 - x) * h * 0.84, 1, 1); }
      }
      function frame() {
        const step = Math.max(2, Math.round(w / 140));
        for (let n = 0; n < step && col < w; n++) column(col++);
        if (col < w) raf = requestAnimationFrame(frame);
      }
      function draw() { cancelAnimationFrame(raf); size(); if (still) { while (col < w) column(col++); } else frame(); }
      let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
      draw();
    })();
  </script>
