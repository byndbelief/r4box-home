<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>r4box</title>
  <meta name="description" content="r4box: the family game room, and the box that runs the rest.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0918">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script type="module">import { forward } from './door.js'; forward();</script>
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --bg: #0B0918; --panel: #171331; --panel-2: #1F1A3F; --line: #2F2957; --ink: #F3F1FF; --muted: #ACA5D6; --faint: #7A73A8;
      --teal: #3DD6C6; --teal-ink: #062A26; --gold: #F5C542; --hot: #FF5A4A; --hot-soft: #4A2230; --violet: #B9A6FF; --mint: #C9FFF8;
      --display: "Unbounded", "Arial Black", Impact, sans-serif;
      --body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --grad-mark: conic-gradient(from 210deg, var(--teal), var(--violet), var(--gold), var(--hot), var(--teal));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100dvh;
      background: radial-gradient(900px 420px at 15% -10%, #2A1F5E55, transparent 60%), radial-gradient(700px 380px at 100% 0%, #0E4A4655, transparent 60%), var(--bg); background-attachment: fixed; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg canvas { width: 100%; height: 100%; display: block; }
    #bifwrap { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 40%, #0000 82%); mask-image: linear-gradient(180deg, #000 0%, #000 40%, #0000 82%); opacity: .9; }
    #bifwrap.faint { opacity: .35; }
    #treewrap { top: 70px; bottom: 210px; }
    #ecowrap { opacity: .55; }

    .page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
    @media (min-width: 760px) { .page { padding: 24px 32px 32px; } }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font: 800 22px/1 var(--display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
    .mark i { width: 1.05em; height: 1.05em; border-radius: 22%; background: var(--grad-mark); box-shadow: inset 0 0 0 .18em var(--bg), 0 0 18px #3DD6C666; animation: spin 18s linear infinite; }
    .mark small { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); align-self: flex-end; margin-bottom: .1em; }
    @keyframes spin { to { filter: hue-rotate(360deg); } }
    .xpill { font: 600 12px/1 var(--mono); color: var(--muted); padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
    .xpill b { color: var(--teal); }
    .eyebrow { font: 800 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--teal); margin: 0 0 12px; }
    h1 { font: 800 clamp(40px, 9vw, 64px)/.98 var(--display); letter-spacing: -.035em; margin: 0; text-wrap: balance; }
    #hi.long { font-size: clamp(30px, 7.4vw, 56px); overflow-wrap: anywhere; }
    button { font: inherit; }
    .btn { appearance: none; cursor: pointer; border: 1.5px solid #ffffff22; background: #ffffff0e; color: var(--ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); font: 700 16px/1 var(--display); min-height: 50px; padding: 0 22px; box-shadow: 0 10px 34px #3DD6C64d; width: 100%; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .45; cursor: default; }
    .link { all: unset; cursor: pointer; color: var(--teal); text-decoration: underline; font-weight: 700; }
    .link.quiet { color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
    label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
    input { font: 400 16px/1.2 var(--body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
    .msg { margin: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--panel-2); }
    .msg.bad { background: var(--hot-soft); }

    /* login (3a: who's here, then passkey) */
    #login .body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; max-width: 520px; padding-top: 40px; }
    .who { display: flex; gap: 10px; flex-wrap: wrap; }
    .who button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #ffffff0e; border: 1px solid #ffffff22; font-weight: 700; }
    .who button:hover { background: #ffffff1a; }
    .who img, .who .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
    .who .av { display: grid; place-items: center; font: 800 12px/1 var(--display); color: var(--teal-ink); background: linear-gradient(160deg, var(--teal), var(--violet)); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .sheet { position: fixed; inset: 0; z-index: 5; display: grid; place-items: end center; background: #0B091899; }
    .sheet > div { width: min(390px, calc(100% - 24px)); margin: 12px; padding: 22px 20px 18px; border-radius: 24px; background: var(--panel-2); border: 1px solid var(--line); display: grid; justify-items: center; gap: 12px; text-align: center; }
    .sheet .ring { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; border: 2px solid var(--line); color: var(--muted); }

    /* cockpit (1c: command bar, pinned dock) */
    #cockpit .body { flex: 1; display: grid; align-content: center; justify-items: center; gap: 22px; padding: 40px 0; }
    #cockpit h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1; text-align: center; }
    .hello { color: var(--muted); margin: -10px 0 0; text-align: center; }
    .search { width: min(560px, 100%); position: relative; }
    .search input { padding: 16px 20px; font-size: 17px; background: var(--panel); border-radius: 14px; }
    .hits { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 3; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 24px #0003; }
    .hits a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; color: inherit; text-decoration: none; }
    .hits a:hover, .hits a.on { background: #ffffff10; }
    .hits code { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--faint); }
    .glyph { width: var(--s, 40px); height: var(--s, 40px); flex: none; display: grid; place-items: center; border-radius: 12px; font: 600 calc(var(--s, 40px) * .4)/1 var(--mono); color: var(--c); background: color-mix(in oklab, var(--c) 14%, transparent); }
    .glyph.emoji { font: calc(var(--s, 40px) * .5)/1 system-ui; }
    .dock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    @media (min-width: 760px) { .dock { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; } }
    .dock a { display: grid; justify-items: center; gap: 10px; padding: 12px 4px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: border-color .2s, background .2s; }
    .dock a:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
    .dock b { font-size: 12px; }
    .dock a { position: relative; }
    .dock .badge { position: absolute; top: 6px; right: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--hot); color: #fff; font: 800 11px/20px var(--body); text-align: center; }
    @media (min-width: 760px) { .dock a { padding: 16px 8px; border-radius: 20px; } .dock b { font-size: 14px; } }
    .who-menu { display: flex; align-items: center; gap: 10px; }
    .offer { width: min(560px, 100%); }
    @media (prefers-reduced-motion: reduce) { .mark i { animation: none; } }

    /* the kids' tutor (Claude, text only) and a parent's flagged chats */
    .hits a.ask b { color: var(--gold); }
    .flags { width: min(560px, 100%); }
    .flags button { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #ffffff0a; }
    .flags button:hover { background: #ffffff14; }
    .flags small { color: var(--muted); }
    #tutor { position: fixed; inset: 0; z-index: 4; background: var(--bg); display: flex; flex-direction: column; }
    #tutor header { padding: max(14px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
    #tutor header .t { display: grid; gap: 2px; min-width: 0; }
    #tutor header b { font: 800 18px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tutor header small { color: var(--muted); font-size: 12px; }
    #tutor header .acts { display: flex; gap: 8px; flex: none; }
    .tlog { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
    .bub { max-width: 86%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
    .bub p { margin: 0 0 8px; } .bub p:last-child { margin: 0; }
    .bub.user { align-self: flex-end; background: var(--teal); color: var(--teal-ink); border-bottom-right-radius: 4px; }
    .bub.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .bub.wait { color: var(--muted); }
    .bub.flagged { box-shadow: 0 0 0 2px var(--gold); }
    .tnote { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 440px; }
    .tlist { display: grid; gap: 6px; }
    .tlist button { all: unset; cursor: pointer; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tsend { display: flex; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
    .tsend textarea { flex: 1; font: 400 16px/1.4 var(--body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; max-height: 160px; }
    .tsend .btn { flex: none; background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
    .tset { display: grid; gap: 10px; }
    .tset .row label { flex: 1 1 90px; }
  </style>
</head>
<body>
  <div class="bg" id="bifwrap"><canvas id="bif" aria-hidden="true"></canvas></div>
  <div class="bg" id="treewrap" hidden><canvas id="tree" aria-hidden="true"></canvas></div>
  <div class="bg" id="ecowrap" hidden><canvas id="eco" aria-hidden="true"></canvas></div>

  <!-- signed out: 3a, who's here -->
  <main class="page" id="login" hidden>
    <header><a class="mark" href="/"><i aria-hidden="true"></i>r4box<small>r = 4</small></a><span class="xpill">x = <b class="x">0.0000</b></span></header>
    <div class="body">
      <div><p class="eyebrow">Sign in</p><h1 id="hi">Who's here?</h1></div>
      <div class="who" id="who"></div>
      <div id="how" hidden>
        <div style="display:grid;gap:10px">
          <button class="btn primary" id="passkey">Sign in with passkey</button>
          <div class="row">
            <button class="link" id="usepw">Use password</button>
            <button class="link" id="usemail" hidden>Email me a link</button>
            <button class="link quiet" id="notme" style="margin-left:auto">Not you?</button>
          </div>
        </div>
      </div>
      <form class="card" id="pw" hidden>
        <label>Password<input type="password" id="pass" autocomplete="current-password" required></label>
        <div class="row"><button class="btn primary" style="width:auto" type="submit">Sign in</button><button class="link" type="button" data-back>Back</button></div>
      </form>
      <form class="card" id="mail" hidden>
        <p style="margin:0">We'll email <b id="mailto"></b> a sign-in link.</p>
        <div class="row"><button class="btn primary" style="width:auto" type="submit">Send link</button><button class="link" type="button" data-back>Back</button></div>
      </form>
      <p class="msg" id="loginmsg" hidden></p>
    </div>
  </main>

  <!-- signed in: 1c, where to? -->
  <main class="page" id="cockpit" hidden>
    <header>
      <a class="mark" href="/"><i aria-hidden="true"></i>r4box<small>r = 4</small></a>
      <div class="who-menu"><span class="xpill">x = <b class="x">0.0000</b></span><button class="link quiet" id="signout">Sign out</button></div>
    </header>
    <div class="body">
      <h1>Where to?</h1>
      <p class="hello" id="hello"></p>
      <div class="search">
        <input id="q" placeholder="os, diary, battleship…" autocomplete="off" aria-label="Where to?">
        <div class="hits" id="hits" hidden></div>
      </div>
      <div class="card flags" id="flags" hidden></div>
      <div class="card offer" id="offer" hidden>
        <p style="margin:0"><b>Sign in faster next time.</b> Add a passkey on this device: Face ID, fingerprint or your phone's lock.</p>
        <div class="row"><button class="btn" id="addkey">Add a passkey</button><button class="link quiet" id="nokey">Not now</button></div>
      </div>
    </div>
    <nav class="dock" id="dock" aria-label="Places"></nav>
  </main>

  <!-- the tutor: a kid's chats with Claude; for a parent, a flagged chat (read only) -->
  <section id="tutor" hidden aria-label="Tutor">
    <header>
      <div class="t"><b id="ttitle">Tutor</b><small id="tsub"></small></div>
      <div class="acts"><button class="btn" id="tchats">Chats</button><button class="btn" id="tclose" aria-label="Close">✕</button></div>
    </header>
    <div class="tlog" id="tlog" aria-live="polite"></div>
    <form class="tsend" id="tsend">
      <textarea id="ttext" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
      <button class="btn" id="tgo">Send</button>
    </form>
  </section>

  <div class="sheet" id="sheet" hidden><div>
    <div class="ring" id="ring">◎</div>
    <b id="sheett">Sign in to r4box</b>
    <span id="sheets" style="font-size:13px;color:var(--muted)"></span>
  </div></div>

  <script src="diary-tree.js"></script>
  <script src="ecosystem.js"></script>
  <script type="module">
    import { sb, FAMILY, roleOf, nameOf, handOver } from './auth.js';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Places. A kid gets games (and, later, their own tree); a parent gets the whole box.
    const BOX = [
      { g: '◎', t: 'os', d: 'Start a task, approve what Claude wants to do.', h: 'os.r4box.com', c: 'var(--teal)' },
      { g: '✎', t: 'diary', d: 'Clearing: every session written up nightly.', h: 'diary.r4box.com', c: 'var(--gold)' },
      { g: '›_', t: 'term', d: 'A shell on the box.', h: 'term.r4box.com', c: 'var(--mint)' },
      { g: '{ }', t: 'code', d: 'The editor, with every project.', h: 'code.r4box.com', c: 'var(--violet)' },
      { g: '◫', t: 'browser', d: 'Watch the browser the agent drives.', h: 'browser.r4box.com', c: 'var(--hot)' },
      { g: '◉', t: 'ntfy', d: 'The notification relay.', h: 'ntfy.r4box.com', c: 'var(--gold)' },
    ];
    const GAMES = [['⚓', 'Battleship'], ['⛳', 'Putt Post'], ['💥', 'Hilltop Duel'], ['🃏', 'Chaos Cards'], ['⚔️', 'War'], ['🏆', 'The Gauntlet'], ['🏁', 'Rally'], ['🕹️', 'Arcade']]
      .map(([g, t]) => ({ g, t, d: 'Game room', h: 'games.r4box.com', c: 'var(--teal)', emoji: true }));
    const GAMES_TILE = { g: '⚓', t: 'games', h: 'games.r4box.com', c: 'var(--teal)', emoji: true };
    const TRIP_TILE = { g: '✈️', t: 'trip', d: 'Trip planning', h: 'r4box.com/trip', u: '/trip.html', c: 'var(--gold)', emoji: true };
    const ADMIN_TILE = { g: '⚙', t: 'admin', d: 'Admin: box health, kids & Claude, devices, content', h: 'r4box.com/admin', u: '/admin.html', c: 'var(--muted)' };
    const DIARY_TILE = { g: '🌱', t: 'diary', d: 'My diary and my world', h: 'r4box.com/diary', u: '/diary.html', c: 'var(--teal)', emoji: true };
    const CHAT_TILE = { g: '💬', t: 'chat', d: 'Family chat', h: 'r4box.com/chat', u: '/chat.html', c: 'var(--violet)', emoji: true };

    // The live x: the logistic map at r = 4, one step every half second.
    let x = Math.random() * .8 + .1;
    setInterval(() => { x = 4 * x * (1 - x); if (x < 1e-6 || x > 1 - 1e-6) x = Math.random(); document.querySelectorAll('.x').forEach((e) => (e.textContent = x.toFixed(4))); }, 500);

    // ---------------- signed out ----------------
    let who = null;
    function showLogin(msg, bad) {
      $('cockpit').hidden = true; $('login').hidden = false; $('treewrap').hidden = true; $('ecowrap').hidden = true; $('bifwrap').classList.remove('faint');
      $('who').innerHTML = FAMILY.map((f, i) => `<button data-i="${i}">${f.avatar ? `<img src="${f.avatar}" alt="">` : `<span class="av">${esc(f.name[0].toUpperCase())}</span>`}${esc(f.name)}</button>`).join('');
      pick(null);
      if (msg) say(msg, bad);
    }
    function pick(f) {
      who = f;
      $('hi').textContent = f ? `Hi, ${f.name}.` : "Who's here?";
      $('hi').classList.toggle('long', !!f && f.name.length > 10);
      $('who').hidden = !!f; $('how').hidden = !f; $('pw').hidden = true; $('mail').hidden = true; $('loginmsg').hidden = true;
      $('usemail').hidden = !(f && f.mail);
    }
    function say(text, bad) { const m = $('loginmsg'); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); m.hidden = false; }
    $('who').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) pick(FAMILY[+b.dataset.i]); });
    $('notme').onclick = () => pick(null);
    $('usepw').onclick = () => { $('how').hidden = true; $('pw').hidden = false; $('pass').focus(); };
    $('usemail').onclick = () => { $('how').hidden = true; $('mail').hidden = false; $('mailto').textContent = who.email; };
    document.querySelectorAll('[data-back]').forEach((b) => (b.onclick = () => pick(who)));

    $('passkey').onclick = async () => {
      if (!window.PublicKeyCredential) { say('This browser has no passkeys: use your password.', true); return; }
      sheet('wait');
      const { error } = await sb.auth.signInWithPasskey();
      if (error) {
        sheet(null);
        say(/disabled/.test(error.code || error.message) ? 'Passkeys are not switched on yet: use your password.'
          : /not_found|NotAllowed|abort/i.test((error.code || '') + error.message) ? 'No passkey for you on this device yet: sign in with your password once, then add one.'
          : 'That did not work: ' + error.message, true);
        return;
      }
      sheet('ok');
    };
    $('pw').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: who.email, password: $('pass').value });
      $('pass').value = '';
      if (error) say(/invalid/i.test(error.message) ? 'That password is not right.' : error.message, true);
    };
    $('mail').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithOtp({ email: who.email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + '/' } });
      say(error ? error.message : `Check ${who.email} for your sign-in link.`, !!error);
      if (!error) $('mail').hidden = true;
    };
    function sheet(st) {
      $('sheet').hidden = !st;
      $('ring').textContent = st === 'ok' ? '✓' : '◎';
      $('ring').style.borderColor = st === 'ok' ? 'var(--teal)' : 'var(--line)';
      $('sheett').textContent = st === 'ok' ? 'Passkey confirmed' : 'Sign in to r4box';
      $('sheets').textContent = st === 'ok' ? 'Opening the box…' : `Use Face ID or your passkey${who ? ' for ' + who.name : ''}.`;
    }

    // ---------------- signed in ----------------
    let places = [];
    // One sign-in: the game room has no sign-in of its own. Going there, the session
    // rides along in the URL fragment (never sent to a server; the game room takes it
    // out of the address at once). Only ever to games.r4box.com.
    async function go(href) {
      const u = new URL(href);
      const { data: { session } } = await sb.auth.getSession();   // refreshed if it was stale
      if (u.protocol === 'https:' && u.hostname === 'games.r4box.com') {
        if (session) {
          const t = btoa(JSON.stringify({ a: session.access_token, r: session.refresh_token })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          const h = u.hash.replace(/^#/, '');
          u.hash = (h ? h + '&' : '') + 'r4sso=' + t;
        }
      } else if (u.protocol === 'https:' && u.hostname.endsWith('.r4box.com') && u.pathname === '/.r4door/enter') {
        handOver(session);   // the box's door asked for this sign-in
      }
      location.assign(u.href);
    }
    for (const id of ['dock', 'hits']) $(id).addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || new URL(a.href).hostname !== 'games.r4box.com') return;
      e.preventDefault(); go(a.href);
    });
    async function showCockpit(session) {
      sheet(null);
      const user = session.user, role = roleOf(user), name = nameOf(user);
      // Came from a box page that asked for a sign-in: go back there.
      const next = new URLSearchParams(location.search).get('next');
      if (next) {
        try { const u = new URL(next); if (u.protocol === 'https:' && (u.hostname === 'r4box.com' || u.hostname.endsWith('.r4box.com'))) { history.replaceState(null, '', '/'); go(u.href); return; } } catch {}
      }
      $('login').hidden = true; $('cockpit').hidden = false;
      $('hello').textContent = role === 'parent' ? `Welcome back, ${name}.` : `Hi, ${name}. Your world grows from what you ask and play.`;
      const tiles = role === 'parent' ? [...BOX, GAMES_TILE, TRIP_TILE, CHAT_TILE, ADMIN_TILE] : [GAMES_TILE, DIARY_TILE, TRIP_TILE, CHAT_TILE];
      places = role === 'parent' ? [...BOX, ...GAMES, TRIP_TILE, CHAT_TILE, ADMIN_TILE] : [...GAMES, DIARY_TILE, TRIP_TILE, CHAT_TILE];
      $('dock').innerHTML = tiles.map((s) => `<a href="${s.u || `https://${s.h}/`}" style="--c:${s.c}"><span class="glyph${s.emoji ? ' emoji' : ''}" style="--s:36px">${s.g}</span><b>${esc(s.t)}</b></a>`).join('');
      $('dock').style.gridTemplateColumns = tiles.length < 4 ? `repeat(${tiles.length}, minmax(0, 140px))` : '';
      $('dock').style.justifyContent = tiles.length < 4 ? 'center' : '';
      $('q').placeholder = role === 'parent' ? 'os, diary, battleship…' : 'Ask anything, or find a game…';
      ME = { role, name };
      unread(user.id);
      if (role === 'parent') showFlags();
      if (location.hash === '#tutor' && role !== 'parent') openTutor();
      background(role);
      offerPasskey();
    }
    $('signout').onclick = async () => { await sb.auth.signOut(); };

    // The chat tile shows how many messages came in since you last read the chat.
    async function unread(uid) {
      const { data: r } = await sb.from('chat_reads').select('read_at').eq('user_id', uid).maybeSingle();
      let q = sb.from('chat_messages').select('id', { count: 'exact', head: true }).or(`author.is.null,author.neq.${uid}`);
      if (r) q = q.gt('created_at', r.read_at);
      const { count } = await q;
      const a = $('dock').querySelector('a[href="/chat.html"]');
      if (a && count) a.insertAdjacentHTML('beforeend', `<span class="badge">${count > 99 ? '99+' : count}</span>`);
    }

    // Where to? Type to jump; Enter opens the first hit.
    $('q').oninput = () => {
      const q = $('q').value.trim().toLowerCase();
      const hits = q ? places.filter((s) => (s.t + ' ' + s.d).toLowerCase().includes(q)).slice(0, 6) : [];
      const ask = q && ME ? `<a class="ask${hits.length ? '' : ' on'}" href="#tutor" data-ask="1"><span class="glyph emoji" style="--s:32px;--c:var(--gold)">✦</span><b>${ME.role === 'parent' ? "Try the kids' tutor" : 'Ask the tutor'}</b><code>${esc($('q').value.trim().slice(0, 40))}</code></a>` : '';
      $('hits').hidden = !hits.length && !ask;
      $('hits').innerHTML = hits.map((s, i) => `<a class="${i ? '' : 'on'}" href="${s.u || `https://${s.h}/`}"><span class="glyph${s.emoji ? ' emoji' : ''}" style="--s:32px;--c:${s.c}">${s.g}</span><b>${esc(s.t)}</b><code>${s.h}</code></a>`).join('') + ask;
    };
    $('q').onkeydown = (e) => { if (e.key === 'Enter') { const a = $('hits').querySelector('a'); if (a?.dataset.ask) askFromBar(); else if (a) go(a.href); } };
    $('hits').addEventListener('click', (e) => { if (e.target.closest('a')?.dataset.ask) { e.preventDefault(); askFromBar(); } });
    function askFromBar() { const t = $('q').value.trim(); $('q').value = ''; $('hits').hidden = true; openTutor(null, t); }

    // ---------------- the tutor ----------------
    // Claude through the kid-tutor Edge Function: text only, no tools. Kids see
    // their own chats; a parent sees only chats flagged as worrying.
    let ME = null, CHAT = null, BUSY = false, READONLY = false;
    const TUTOR = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/kid-tutor';
    const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
      .split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    const bubble = (role, text, flagged) => { const d = document.createElement('div'); d.className = `bub ${role}${flagged ? ' flagged' : ''}`; d.innerHTML = fmt(text); $('tlog').append(d); d.scrollIntoView({ block: 'end' }); return d; };
    const note = (html) => { const d = document.createElement('div'); d.className = 'tnote'; d.innerHTML = html; $('tlog').append(d); return d; };
    async function tutorCall(body) {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch(TUTOR, { method: 'POST', headers: { Authorization: `Bearer ${session?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return r.json().catch(() => ({ error: 'The tutor could not answer just now.' }));
    }
    function sub(st) {
      $('tsub').textContent = READONLY ? 'Flagged chat · read only' : !st ? '' : st.cap == null ? 'Your test chats (no limits for parents)' : st.open ? `${st.left} of ${st.cap} questions left today` : `Open ${st.hours}`;
    }
    async function openTutor(chat = null, first = '') {
      READONLY = false; CHAT = chat; $('tutor').hidden = false; $('tsend').hidden = false; $('tchats').hidden = false;
      $('ttitle').textContent = 'Tutor'; $('tlog').innerHTML = '';
      if (location.hash !== '#tutor') history.pushState(null, '', '#tutor');
      if (chat) {
        const { data: c } = await sb.from('tutor_chats').select('title').eq('id', chat).maybeSingle();
        $('ttitle').textContent = c?.title || 'Tutor';
        const { data: ms } = await sb.from('tutor_messages').select('role, content').eq('chat', chat).order('id');
        (ms || []).forEach((m) => bubble(m.role, m.content));
      } else {
        note(ME.role === 'parent' ? "This is what the kids see. Your test chats are saved under your name." :
          "I'm your tutor. Ask me about homework (I'll help you work it out, not just hand over answers) or anything you're curious about. Your chats are private, unless something sounds like you might need help: then your dad sees that chat.");
      }
      tutorCall({ action: 'status' }).then((st) => { if (!READONLY) sub(st); if (st && st.ready === false) note('The tutor is not set up yet.'); });
      if (first) send(first); else $('ttext').focus();
    }
    async function send(text) {
      if (BUSY || !text) return;
      BUSY = true; $('tgo').disabled = true;
      bubble('user', text);
      const wait = bubble('assistant wait', '…');
      const r = await tutorCall({ text, chat: CHAT });
      wait.remove();
      if (r.error) note(esc(r.error));
      else { CHAT = r.chat; $('ttitle').textContent = r.title; bubble('assistant', r.reply); if (ME.role !== 'parent') tutorCall({ action: 'status' }).then(sub); }
      BUSY = false; $('tgo').disabled = false; $('ttext').focus();
    }
    $('tsend').onsubmit = (e) => { e.preventDefault(); const t = $('ttext').value.trim(); $('ttext').value = ''; $('ttext').style.height = ''; send(t); };
    $('ttext').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); $('tsend').requestSubmit(); } };
    $('ttext').oninput = () => { $('ttext').style.height = ''; $('ttext').style.height = $('ttext').scrollHeight + 'px'; };
    const closeTutor = () => { $('tutor').hidden = true; if (location.hash === '#tutor') history.replaceState(null, '', location.pathname + location.search); if (ME?.role === 'parent') showFlags(); };
    $('tclose').onclick = closeTutor;
    window.addEventListener('popstate', () => { if (location.hash !== '#tutor') $('tutor').hidden = true; });
    $('tchats').onclick = async () => {
      const { data: me } = await sb.auth.getUser();
      const { data } = await sb.from('tutor_chats').select('id, title, updated_at').eq('kid', me.user.id).order('updated_at', { ascending: false }).limit(40);
      $('tlog').innerHTML = ''; $('ttitle').textContent = 'Your chats';
      const list = document.createElement('div'); list.className = 'tlist';
      list.innerHTML = `<button data-id="">＋ New chat</button>` + (data || []).map((c) => `<button data-id="${c.id}">${esc(c.title)}</button>`).join('');
      list.onclick = (e) => { const b = e.target.closest('button'); if (b) openTutor(b.dataset.id || null); };
      $('tlog').append(list);
    };

    // A parent: the flagged chats (and only those), and each kid's limits.
    async function showFlags() {
      const { data: chats } = await sb.from('tutor_chats').select('id, kid, title, flag_reason, flagged_at').eq('flagged', true).order('flagged_at', { ascending: false });
      const ids = [...new Set((chats || []).map((c) => c.kid))];
      const { data: profs } = ids.length ? await sb.from('profiles').select('id, username').in('id', ids) : { data: [] };
      const who = Object.fromEntries((profs || []).map((p) => [p.id, p.username]));
      $('flags').hidden = false;
      $('flags').innerHTML = (chats || []).length
        ? `<p class="eyebrow" style="margin:0;color:var(--gold)">Tutor · flagged for you</p>` + chats.map((c) => `<button data-id="${c.id}"><b>${esc(who[c.kid] || 'A kid')}: ${esc(c.flag_reason || 'flagged')}</b><small>${esc(c.title)} · ${new Date(c.flagged_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</small></button>`).join('') + `<button class="link quiet" id="tlimits" style="justify-self:start">Tutor limits</button>`
        : `<div class="row" style="justify-content:space-between"><small style="color:var(--muted)">Kids' tutor: nothing flagged.</small><button class="link quiet" id="tlimits">Tutor limits</button></div>`;
      $('flags').querySelectorAll('button[data-id]').forEach((b) => b.onclick = () => openFlag(b.dataset.id, who));
      $('tlimits').onclick = limits;
      if (location.hash === '#tutor' && chats?.length) openFlag(chats[0].id, who);
    }
    async function openFlag(id, who) {
      READONLY = true; $('tutor').hidden = false; $('tsend').hidden = true; $('tchats').hidden = true; $('tlog').innerHTML = '';
      const { data: c } = await sb.from('tutor_chats').select('kid, title, flag_reason').eq('id', id).single();
      $('ttitle').textContent = `${who[c.kid] || 'Kid'}: ${c.title}`; sub();
      note(`Flagged: <b>${esc(c.flag_reason || '')}</b>. You see this chat because of the flag; the kids' other chats stay private.`);
      const { data: ms } = await sb.from('tutor_messages').select('role, content, flagged').eq('chat', id).order('id');
      (ms || []).forEach((m) => bubble(m.role, m.content, m.flagged));
      const b = note('<button class="btn">Mark as seen</button>');
      b.querySelector('button').onclick = async () => { await sb.rpc('tutor_clear_flag', { p_chat: id }); closeTutor(); };
    }
    async function limits() {
      READONLY = true; $('tutor').hidden = false; $('tsend').hidden = true; $('tchats').hidden = true; $('tlog').innerHTML = '';
      $('ttitle').textContent = 'Tutor limits'; $('tsub').textContent = 'Times are in this device\'s timezone';
      const { data: rows } = await sb.from('tutor_settings').select('*');
      const { data: profs } = await sb.from('profiles').select('id, username').in('id', (rows || []).map((r) => r.kid));
      const who = Object.fromEntries((profs || []).map((p) => [p.id, p.username]));
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      for (const r of rows || []) {
        const f = document.createElement('form'); f.className = 'card tset';
        f.innerHTML = `<b>${esc(who[r.kid] || 'Kid')}</b><div class="row">
          <label>Questions a day<input name="cap" type="number" min="0" max="500" value="${r.daily_cap}"></label>
          <label>Opens at<input name="start" type="number" min="0" max="23" value="${r.start_hour}"></label>
          <label>Closes at<input name="end" type="number" min="1" max="24" value="${r.end_hour}"></label></div>
          <div class="row"><button class="btn">Save</button><small style="color:var(--muted)">Hours 0 to 24 (${esc(tz)})</small></div>`;
        f.onsubmit = async (e) => {
          e.preventDefault();
          const v = { daily_cap: +f.cap.value, start_hour: +f.start.value, end_hour: +f.end.value, tz, updated_at: new Date().toISOString() };
          const { error } = await sb.from('tutor_settings').update(v).eq('kid', r.kid);
          f.querySelector('small').textContent = error ? 'Could not save: ' + error.message : 'Saved.';
        };
        $('tlog').append(f);
      }
    }

    // After a password sign-in, offer a passkey for this device (once per device).
    async function offerPasskey() {
      $('offer').hidden = true;
      let skip = false; try { skip = localStorage.getItem('r4-nokey') === '1'; } catch {}
      if (skip || !window.PublicKeyCredential || !sb.auth.passkey) return;
      const { data, error } = await sb.auth.passkey.list();
      if (!error && Array.isArray(data) && data.length === 0) $('offer').hidden = false;
    }
    $('addkey').onclick = async () => {
      const { error } = await sb.auth.registerPasskey();
      $('offer').innerHTML = error ? `<p class="msg bad">Could not add a passkey: ${esc(error.message)}</p>` : '<p class="msg">Passkey added. Next time: tap your name, then Face ID.</p>';
    };
    $('nokey').onclick = () => { try { localStorage.setItem('r4-nokey', '1'); } catch {} $('offer').hidden = true; };

    // Behind the cockpit: a parent's diary tree when the diary answers (only from the
    // tailnet); otherwise, and for kids, the curve. No diary data is ever stored here.
    async function background(role) {
      $('bifwrap').classList.add('faint'); $('treewrap').hidden = true; $('ecowrap').hidden = true;
      if (role !== 'parent') {
        // A kid: their own world, grown from their diary, behind the cockpit.
        const { data: { session } } = await sb.auth.getSession();
        const { data: w } = await sb.rpc('r4_kid_world', { p_kid: session.user.id });
        if (!w || !w.topics?.length) return;
        $('ecowrap').hidden = false; $('bifwrap').style.opacity = '.12';
        if (window.__eco) window.__eco.destroy();
        window.__eco = window.mountEcosystem($('eco'), w, { background: true });
        return;
      }
      try {
        const ac = new AbortController(); setTimeout(() => ac.abort(), 4000);
        const r = await fetch('https://diary.r4box.com/data.json', { cache: 'no-store', credentials: 'include', signal: ac.signal });
        const d = r.ok ? await r.json() : null;
        if (!d || !d.ideas || !d.events) return;
        d.events.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id)));
        $('treewrap').hidden = false; $('bifwrap').classList.remove('faint'); $('bifwrap').style.opacity = '.18';
        window.mountDiaryTree($('tree'), d, {
          palette: { '--bark': '#3A335F', '--c-park': '#4A4470', '--c-growth': '#B9A6FF', '--c-turn': '#FF5A4A', '--c-close': '#3DD6C6', '--accent': '#F5C542', '--ground': '#0B0918' },
          flow: { colors: ['#3DD6C6', '#C9FFF8', '#B9A6FF', '#F5C542', '#FF5A4A'], wave: 120, speed: .45, tail: 2.6 },
        });
      } catch { /* not on the tailnet, or the diary does not allow this page yet */ }
    }

    // ---------------- session ----------------
    // One sign-out: the box's door too (reachable only on the tailnet; best effort).
    const doorOut = () => { handOver(null); fetch('https://os.r4box.com/.r4door/out', { mode: 'no-cors', credentials: 'include' }).catch(() => {}); };
    // Signed out in the game room or at the box: out of here too.
    if (new URLSearchParams(location.search).has('signout')) {
      await sb.auth.signOut();
      doorOut();
      history.replaceState(null, '', '/');
    }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        doorOut();
        showLogin();
      }
      else if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) showCockpit(session);
      else if (!session && event === 'INITIAL_SESSION') showLogin();
    });
  </script>

  <script>
    // The bifurcation diagram, drawn left to right as r climbs from 2.5 to 4.
    // Coloured as the games colour the curve: teal calm, violet doubling, gold at the onset, hot in chaos.
    (() => {
      const cv = document.getElementById('bif'), ctx = cv.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const R0 = 2.5, R1 = 4, ONSET = 3.5699;
      const colour = (r) => r < 3 ? [61, 214, 198] : r < 3.449 ? [185, 166, 255] : r < ONSET ? [245, 197, 66]
        : (r > 3.8284 && r < 3.857) ? [201, 255, 248] : [255, 90, 74];
      let w, h, col, raf;
      function size() {
        const dpr = Math.min(devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
        w = cv.width = Math.round(b.width * dpr); h = cv.height = Math.round(b.height * dpr);
        ctx.clearRect(0, 0, w, h); col = 0;
      }
      function column(i) {
        const r = R0 + (R1 - R0) * (i / w), [cr, cg, cb] = colour(r);
        const pts = r < ONSET ? 60 : 260, a = r < ONSET ? .5 : .14;
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        let x = 0.5;
        for (let k = 0; k < 300; k++) x = r * x * (1 - x);
        for (let k = 0; k < pts; k++) { x = r * x * (1 - x); ctx.fillRect(i, h * 0.08 + (1 - x) * h * 0.84, 1, 1); }
      }
      function frame() {
        const step = Math.max(2, Math.round(w / 140));
        for (let n = 0; n < step && col < w; n++) column(col++);
        if (col < w) raf = requestAnimationFrame(frame);
      }
      function draw() { cancelAnimationFrame(raf); size(); if (still) { while (col < w) column(col++); } else frame(); }
      let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
      draw();
    })();
  </script>
</body>
