            ${mayChoose ? `<button class="btn" data-legmore="${n}" ${flyBusy ? 'disabled' : ''} style="margin-top:8px">${flyBusy ? '✦ Looking…' : `✦ Find ${all ? 'more' : ''} flights for this leg`}</button>` : ''}</div>`; }).join('')}
      </div>
      <div class="totals"><div><b>${np ? money(tp * n0) : '–'}</b><small>${np} of ${plan.length} legs · ${np ? `${money(tp)} per person · ${hm(tm)} in the air` : 'pick a flight for each leg'}</small></div><button class="btn p" id="flydone">Done</button></div></div>`;
    const F = (id) => $('fly').querySelector('#' + id);
    F('flyx').onclick = F('flydone').onclick = () => $('fly').close();
    $('fly').querySelectorAll('[data-fstops]').forEach((b) => b.onclick = () => { fs.stops = b.dataset.fstops; renderBuilder(); });
    $('fly').querySelectorAll('[data-fsort]').forEach((b) => b.onclick = () => { fs.sort = b.dataset.fsort; renderBuilder(); });
    $('fly').querySelectorAll('[data-fmore]').forEach((b) => b.onclick = () => { $('fly').close(); view(items.find((i) => i.id === b.dataset.fmore)); });
    $('fly').querySelectorAll('[data-legpick]').forEach((b) => b.onclick = async () => {
      const [n, id] = b.dataset.legpick.split(':'), p2 = plan.map((l) => ({ ...l }));
      p2[+n].pick = p2[+n].pick === id ? null : id;
      if (await savePlan(p2, wasDone)) { render(); if ($('fly').open) renderBuilder(); }
    });
    $('fly').querySelectorAll('[data-usecombo]').forEach((b) => b.onclick = async () => {
      const ids = b.dataset.usecombo.split(','), p2 = plan.map((l, n) => ({ ...l, pick: ids[n] }));
      if (await savePlan(p2, wasDone)) { render(); if ($('fly').open) renderBuilder(); }
    });
    $('fly').querySelectorAll('[data-legmore]').forEach((b) => b.onclick = () => { const l = plan[+b.dataset.legmore];
      askFlights(`Find 2 or 3 more flight options for leg ${b.dataset.legmore} of the flight plan (${l.from}→${l.to} on ${l.date}), different from the ones already there, each as a flight idea with flight kind 'leg' and leg ${b.dataset.legmore}. Change nothing else.`); });
  }

  // ---- flights, side by side: filter by price, stops, flight time, airline and date; choose from here ----
  const fs = { max: null, stops: 'any', hours: null, airlines: new Set(), date: '', sort: 'price' };
  let flyBusy = false;
  const hm = (min) => (min == null ? '?' : `${Math.floor(min / 60)}h${min % 60 ? ' ' + String(min % 60).padStart(2, '0') + 'm' : ''}`);
  const toMin = (t) => { const m = String(t || '').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : null; };
  function flightInfo(i) {
    const f = i.flight || {}, legs = (f.legs || []).filter((l) => l.depart || l.minutes);
    const n = family.length || 1;
    const pp = f.price_pp ?? (f.price_total ? f.price_total / n : null) ?? (+(((i.notes || '').match(/\$\s?([\d,]{2,6})/) || [])[1] || '').replace(/,/g, '') || null);
    const total = f.price_total ?? (pp ? pp * n : null);
    const minutes = legs.reduce((s, l) => s + (l.minutes || 0), 0) || null;
    const stops = legs.length ? Math.max(...legs.map((l) => l.stops ?? 0)) : null;
    const out = legs.find((l) => l.dir !== 'back');
    return { i, f, legs, pp, total, minutes, stops, date: out?.date || '', departMin: toMin(out?.depart), airlines: f.airlines || [], ok: legs.length > 0 };
  }
  function legHTML(l) {
    // The bar is the leg on a 24-hour day; one that runs past midnight wraps round to the morning.
    const d = toMin(l.depart), w = Math.min(1440, l.minutes || (toMin(l.arrive) != null && d != null ? (toMin(l.arrive) + (l.arrive_plus || 0) * 1440 - d) : 0));
    const at = (min) => (((d + min) % 1440) / 1440) * 100;
    const bars = d == null ? '' : d + w <= 1440 ? `<i style="left:${at(0)}%;width:${Math.max(2, (w / 1440) * 100)}%"></i>`
      : `<i style="left:${at(0)}%;width:${100 - at(0)}%"></i><i style="left:0;width:${Math.max(1, ((d + w - 1440) / 1440) * 100)}%"></i>`;
    const dots = d == null ? '' : Array.from({ length: l.stops || 0 }, (_, k) => `<em style="left:${at((w * (k + 1)) / ((l.stops || 0) + 1))}%" title="Change planes${l.via?.[k] ? ' in ' + esc(l.via[k]) : ''}"></em>`).join('');
    return `<div class="leg"><div class="lh"><span>${l.dir === 'back' ? 'Return' : 'Outbound'}${l.date ? ' · ' + esc(nice(l.date)) : ''}</span><span>${(l.flights || []).map(esc).join(' · ')}</span></div>
      <div class="lt"><b>${esc(l.depart || '–')}<small>${esc(l.from || '')}</small></b><div class="tl" aria-hidden="true">${bars}${dots}</div>
        <b class="end">${esc(l.arrive || '–')}${l.arrive_plus ? `<sup>+${l.arrive_plus}</sup>` : ''}<small>${esc(l.to || '')}</small></b></div>
      <div class="lm"><b>${hm(l.minutes)}</b> · ${l.stops ? `${l.stops} stop${l.stops > 1 ? 's' : ''}${l.via?.length ? ' via ' + l.via.map(esc).join(', ') : ''}` : 'Nonstop'}</div></div>`;
  }
  function openFlights() { flyMode = 'flights'; planOf() ? renderBuilder() : renderFlights(); if (!$('fly').open) $('fly').showModal(); }
  function renderFlights() {
    const all = items.filter((i) => i.kind === 'idea' && i.topic === 'flights').map(flightInfo);
    const good = all.filter((x) => x.ok), need = all.filter((x) => !x.ok);
    const prices = good.map((x) => x.pp).filter((x) => x != null), mins = good.map((x) => x.minutes).filter((x) => x != null);
    const pMin = prices.length ? Math.floor(Math.min(...prices)) : 0, pMax = prices.length ? Math.ceil(Math.max(...prices)) : 0;
    const hMax = mins.length ? Math.ceil(Math.max(...mins) / 60) : 0, hMin = mins.length ? Math.floor(Math.min(...mins) / 60) : 0;
    if (fs.max == null || fs.max > pMax || fs.max < pMin) fs.max = pMax;
    if (fs.hours == null || fs.hours > hMax || fs.hours < hMin) fs.hours = hMax;
    const airlines = [...new Set(good.flatMap((x) => x.airlines))], dates = [...new Set(good.map((x) => x.date).filter(Boolean))].sort();
    const shown = good.filter((x) => (x.pp == null || x.pp <= fs.max) && (x.minutes == null || x.minutes <= fs.hours * 60)
      && (fs.stops === 'any' || (x.stops ?? 9) <= +fs.stops) && (!fs.airlines.size || x.airlines.some((a) => fs.airlines.has(a))) && (!fs.date || x.date === fs.date))
      .sort((a, b) => fs.sort === 'fast' ? (a.minutes ?? 1e9) - (b.minutes ?? 1e9) : fs.sort === 'early' ? (a.departMin ?? 1e9) - (b.departMin ?? 1e9) : (a.pp ?? 1e9) - (b.pp ?? 1e9));
    const cheapest = Math.min(...good.map((x) => x.pp ?? 1e9)), fastest = Math.min(...good.map((x) => x.minutes ?? 1e9));
    const mayChoose = canChoose(), n = family.length || 1;
    const chip = (on, attr, label) => `<button type="button" class="chip${on ? ' on' : ''}" ${attr}>${label}</button>`;
    const leg = legHTML;
    const card = (x) => `<div class="fcard${x.i.chosen ? ' on' : ''}">
        <div class="top"><div class="pr"><b>${x.pp != null ? money(x.pp) : '?'}</b><small>per person${x.total != null ? ` · ${money(x.total)} for ${n}` : ''}${x.f.kind === 'oneway' ? ' · one way' : ' · round trip'}</small></div>
          <div class="badges">${x.i.chosen ? '<span class="badge fast">✓ Chosen</span>' : ''}${x.pp === cheapest && good.length > 1 ? '<span class="badge cheap">Cheapest</span>' : ''}${x.minutes === fastest && good.length > 1 ? '<span class="badge fast">Fastest</span>' : ''}</div></div>
        <div class="al">${esc(x.airlines.join(' + ') || x.i.title)}<small>${esc(x.i.title)}</small></div>
        ${x.legs.map(leg).join('')}
        <div class="tot"><span>Total flight time <b>${hm(x.minutes)}</b></span><span>${x.stops ? `Up to ${x.stops} stop${x.stops > 1 ? 's' : ''} each way` : 'Nonstop both ways'}</span></div>
        <div class="acts">${mayChoose ? `<button class="btn${x.i.chosen ? '' : ' p'}" data-fchoose="${x.i.id}">${x.i.chosen ? 'Undo choice' : '✓ Choose this flight'}</button>` : ''}
          <button class="btn" data-fmore="${x.i.id}">Details</button>${safeLink(x.i.link) ? `<a class="btn" href="${esc(x.i.link)}" target="_blank" rel="noopener noreferrer">Live prices ↗</a>` : ''}</div></div>`;
    $('fly').innerHTML = `<div class="wrap">
      <header class="sh"><b>✈️ Compare flights</b><button class="btn" id="flyx" aria-label="Close" autofocus>✕</button></header>
      ${good.length ? `<div class="filters">
        <div class="rng"><label>Price per person <b>up to ${money(fs.max)}</b><input type="range" id="fmax" min="${pMin}" max="${pMax}" step="10" value="${fs.max}" ${pMin === pMax ? 'disabled' : ''}></label>
          <label>Total flight time <b>up to ${fs.hours}h</b><input type="range" id="fhrs" min="${hMin}" max="${hMax}" step="1" value="${fs.hours}" ${hMin === hMax ? 'disabled' : ''}></label></div>
        <div class="frow"><small>Stops</small>${chip(fs.stops === 'any', 'data-fstops="any"', 'Any')}${chip(fs.stops === '0', 'data-fstops="0"', 'Nonstop')}${chip(fs.stops === '1', 'data-fstops="1"', '1 stop or fewer')}</div>
        ${airlines.length > 1 ? `<div class="frow"><small>Airlines</small>${airlines.map((a) => chip(fs.airlines.has(a), `data-fair="${esc(a)}"`, esc(a))).join('')}</div>` : ''}
        ${dates.length > 1 ? `<div class="frow"><small>Leaving</small>${chip(!fs.date, 'data-fdate=""', 'Any day')}${dates.map((d) => chip(fs.date === d, `data-fdate="${d}"`, esc(nice(d)))).join('')}</div>` : ''}
        <div class="frow"><small>Sort</small>${chip(fs.sort === 'price', 'data-fsort="price"', 'Cheapest')}${chip(fs.sort === 'fast', 'data-fsort="fast"', 'Fastest')}${chip(fs.sort === 'early', 'data-fsort="early"', 'Earliest')}</div>
      </div>` : ''}
      <div class="list">
        ${good.length ? `<p class="note" style="margin:0">${shown.length} of ${good.length} flights · prices are typical fares Claude found, not quotes: “Live prices” shows today’s.</p>` : ''}
        ${shown.map(card).join('') || (good.length ? '<p class="empty">No flight matches these filters.</p>' : '')}
        ${need.length ? `<div class="need"><span>${need.length} flight option${need.length > 1 ? 's don’t' : ' doesn’t'} have times and prices to compare yet: ${need.map((x) => esc(x.i.title)).join('; ')}.</span>
          ${mayChoose || PARENT ? `<button class="btn p" id="ffill" style="justify-self:start" ${flyBusy ? 'disabled' : ''}>${flyBusy ? '✦ Looking up schedules and fares… (about a minute)' : '✦ Fill in details'}</button>` : ''}</div>` : ''}
      </div></div>`;
    const F = (id) => $('fly').querySelector('#' + id);
    F('flyx').onclick = () => $('fly').close();
    // While dragging only the label follows; letting go applies the filter (rebuilding mid-drag would drop the thumb).
    if (F('fmax')) { F('fmax').oninput = (e) => { e.target.previousElementSibling.textContent = 'up to ' + money(+e.target.value); }; F('fmax').onchange = (e) => { fs.max = +e.target.value; renderFlights(); }; }
    if (F('fhrs')) { F('fhrs').oninput = (e) => { e.target.previousElementSibling.textContent = `up to ${e.target.value}h`; }; F('fhrs').onchange = (e) => { fs.hours = +e.target.value; renderFlights(); }; }
    $('fly').querySelectorAll('[data-fstops]').forEach((b) => b.onclick = () => { fs.stops = b.dataset.fstops; renderFlights(); });
    $('fly').querySelectorAll('[data-fair]').forEach((b) => b.onclick = () => { const a = b.dataset.fair; fs.airlines.has(a) ? fs.airlines.delete(a) : fs.airlines.add(a); renderFlights(); });
    $('fly').querySelectorAll('[data-fdate]').forEach((b) => b.onclick = () => { fs.date = b.dataset.fdate; renderFlights(); });
    $('fly').querySelectorAll('[data-fsort]').forEach((b) => b.onclick = () => { fs.sort = b.dataset.fsort; renderFlights(); });
    $('fly').querySelectorAll('[data-fmore]').forEach((b) => b.onclick = () => { $('fly').close(); view(items.find((i) => i.id === b.dataset.fmore)); });
    $('fly').querySelectorAll('[data-fchoose]').forEach((b) => b.onclick = async () => {
      const i = items.find((x) => x.id === b.dataset.fchoose);
      const { error } = await sb.rpc('trip_choose', { p_item: i.id, p_on: !i.chosen });
      if (error) { alert(error.message); return; }
      if (!i.chosen) { $('fly').close(); reworkBelow(i); }
      load();
    });
    if (F('ffill')) F('ffill').onclick = async () => {
      flyBusy = true; renderFlights();
      try {
        const { data: { session: s } } = await sb.auth.getSession();
        const r = await (await fetch(HELPER, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ trip: trip.id, text: `Fill in the flight details (each leg's date, real scheduled departure and arrival times, airports, minutes, stops and connection airports, airlines, and the typical fare per person and for the family) for these flight ideas, with update_item: ${need.map((x) => `[${x.i.id.slice(0, 8)}] ${x.i.title}`).join('; ')}. Change nothing else.` }) })).json();
        if (r.error) alert(r.error);
      } catch (e) { alert("Couldn't look them up just now."); }
      flyBusy = false; await load(); if ($('fly').open) renderFlights();
    };
  }

  // ---- edit one item ----
  const KIND = { plan: 'Plan', idea: 'Idea', booking: 'Booking', pack: 'Packing' };
  function edit(i) {
    const isNew = !i.id, k = i.kind;
    const canDel = !isNew && (PARENT || i.created_by === ME.id);
    const dayOpts = `<option value="">Any day</option>` + days().map((d) => `<option value="${d}" ${d === i.day ? 'selected' : ''}>${nice(d)}</option>`).join('');
    $('dform').innerHTML = `<h2>${isNew ? 'New ' + KIND[k].toLowerCase() : KIND[k]}</h2>
      <label>${k === 'booking' ? 'What (flight, hotel, car…)' : 'What'}<input name="title" required maxlength="200" value="${esc(i.title || '')}"></label>
      ${k === 'plan' || k === 'booking' ? `<div class="row"><label>Day<select name="day">${dayOpts}</select></label><label>Time<input name="at" placeholder="9:30" maxlength="20" value="${esc(i.at || '')}"></label></div>` : ''}
      ${k !== 'pack' ? `<label>Part of the trip<select name="topic"><option value="">—</option>${Object.entries(TOPIC).map(([t, [e, n]]) => `<option value="${t}" ${t === i.topic ? 'selected' : ''}>${e} ${n}</option>`).join('')}</select></label>` : ''}
      <label>Notes<textarea name="notes" maxlength="2000">${esc(i.notes || '')}</textarea></label>
      <label>Link<input name="link" type="url" placeholder="https://" value="${esc(i.link || '')}"></label>
      ${k !== 'pack' && k !== 'booking' ? `<label>Video (a YouTube link)<input name="video" type="url" placeholder="https://youtube.com/watch?v=…" value="${esc(i.video || '')}"></label>` : ''}
      ${k === 'plan' || k === 'booking' ? `<div class="row"><label>Cost<input name="cost" type="number" step="0.01" min="0" value="${i.cost ?? ''}"></label>${k === 'booking' ? `<label>Confirmation<input name="conf" maxlength="60" value="${esc(i.conf || '')}"></label>` : '<span></span>'}</div>` : ''}
      <p class="note" id="derr"></p>
      <div class="acts">
        ${canDel ? '<button type="button" class="btn bad" id="ddel">Delete</button>' : ''}
        ${k === 'idea' && !isNew ? '<button type="button" class="btn" id="dplan">Put in the plan</button>' : ''}
        <button type="button" class="btn" id="dcancel">Cancel</button><button class="btn p">Save</button>
      </div>`;
    const f = $('dform');
    $('dcancel').onclick = () => $('dlg').close();
    if ($('ddel')) $('ddel').onclick = async () => { await sb.from('trip_items').delete().eq('id', i.id); $('dlg').close(); load(); };
    if ($('dplan')) $('dplan').onclick = () => { $('dlg').close(); edit({ ...i, kind: 'plan', _from: i.id }); };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = { title: f.elements.title.value.trim(), notes: f.elements.notes.value.trim() || null, link: f.elements.link.value.trim() || null, updated_at: new Date().toISOString() };
      if (f.elements.day) { v.day = f.elements.day.value || null; v.at = f.elements.at.value.trim() || null; v.cost = f.elements.cost.value === '' ? null : +f.elements.cost.value; }
      if (f.elements.conf) v.conf = f.elements.conf.value.trim() || null;
      if (f.elements.topic) v.topic = f.elements.topic.value || null;
      if (f.elements.video) {
        const vv = f.elements.video.value.trim();
        if (vv && !ytId(vv)) { $('derr').textContent = 'The video needs to be a YouTube link.'; return; }
        v.video = vv || null;
      }
      let error;
      if (i._from) ({ error } = await sb.from('trip_items').update({ ...v, kind: k }).eq('id', i._from));   // an idea becoming a plan or a booking
      else if (isNew) ({ error } = await sb.from('trip_items').insert({ ...v, trip: trip.id, kind: k, created_by: ME.id }));
      else ({ error } = await sb.from('trip_items').update(v).eq('id', i.id));
      if (error) { $('derr').textContent = 'Could not save: ' + error.message; return; }
      $('dlg').close(); load();
    };
    $('dlg').showModal();
  }

  // ---- the trip itself (a parent) ----
  function editTrip(t = {}) {
    $('dform').innerHTML = `<h2>${t.id ? 'Edit trip' : 'New trip'}</h2>
      <label>What's the trip?<textarea name="goal" maxlength="1000" placeholder="Watch the Dodgers play the Yankees in New York">${esc(t.goal || '')}</textarea></label>
      <label>Name<input name="name" maxlength="80" value="${esc(t.name && t.name !== 'New trip' ? t.name : '')}" placeholder="Optional: Claude can name it"></label>
      <label>Where<input name="place" maxlength="120" value="${esc(t.place || '')}" placeholder="Optional"></label>
      <label>Travelling from<input name="origin" maxlength="120" value="${esc(t.origin || '')}" placeholder="City and airport, e.g. Raleigh (RDU)"></label>
      <div class="row"><label>From<input name="starts" type="date" value="${t.starts || ''}"></label><label>To<input name="ends" type="date" value="${t.ends || ''}"></label></div>
      <label>Currency<input name="currency" maxlength="3" value="${esc(t.currency || 'USD')}"></label>
      <p class="note">Only the goal is needed: Claude works out where and when, then breaks the trip down (dates, flights, tickets, where to stay, getting around). Add where you travel from so flights are priced from home.</p>
      <p class="note" id="derr"></p>
      <div class="acts"><button type="button" class="btn" id="dcancel">Cancel</button><button class="btn p">Save</button></div>`;
    const f = $('dform');
    $('dcancel').onclick = () => $('dlg').close();
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = { goal: f.elements.goal.value.trim() || null, name: f.elements.name.value.trim() || (t.id ? t.name : 'New trip'), place: f.elements.place.value.trim() || null, origin: f.elements.origin.value.trim() || null, starts: f.elements.starts.value || null, ends: f.elements.ends.value || null, currency: (f.elements.currency.value.trim() || 'USD').toUpperCase() };
      const { data, error } = t.id ? await sb.from('trips').update(v).eq('id', t.id).select().single() : await sb.from('trips').insert(v).select().single();
      if (error) { $('derr').textContent = 'Could not save: ' + error.message; return; }
      $('dlg').close(); history.replaceState(null, '', '?t=' + data.id + (location.hash || '#plan')); await load();
      // A new trip from a goal: Claude starts on it straight away.
      if (!t.id && v.goal) { $('askq').value = `Help us start planning this trip: ${v.goal}. Work out where and when, then break it down into dates, flights, tickets, where to stay and getting around, with real options for each.`; $('askf').requestSubmit(); }
    };
    $('dlg').showModal();
  }
  $('newtrip').onclick = () => editTrip();
  $('edittrip').onclick = () => editTrip(trip);
  $('newtrip2').onclick = () => editTrip();

  // ---- live: everyone's changes show up as they happen ----
  let tick = 0;
  const soon = () => { clearTimeout(tick); tick = setTimeout(load, 300); };
  sb.channel('trips').on('postgres_changes', { event: '*', schema: 'public', table: 'trip_items' }, soon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trips' }, soon)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'trip_asks' }, soon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_comments' }, soon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_polls' }, soon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_poll_votes' }, soon).subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  if (session) load();
</script>
</body>
</html>
