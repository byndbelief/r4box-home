<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0918">
  <meta name="robots" content="noindex">
  <title>r4box trip</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --bg: #0B0918; --panel: #171331; --panel-2: #1F1A3F; --line: #2F2957; --ink: #F3F1FF; --muted: #ACA5D6; --faint: #7A73A8;
      --teal: #3DD6C6; --teal-ink: #062A26; --gold: #F5C542; --gold-ink: #2A2100; --hot: #FF5A4A; --hot-soft: #4A2230; --violet: #B9A6FF;
      --display: "Unbounded", "Arial Black", Impact, sans-serif;
      --body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --grad-mark: conic-gradient(from 210deg, var(--teal), var(--violet), var(--gold), var(--hot), var(--teal));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100dvh;
      background: radial-gradient(900px 420px at 15% -10%, #2A1F5E55, transparent 60%), radial-gradient(700px 380px at 100% 0%, #0E4A4655, transparent 60%), var(--bg); background-attachment: fixed; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }
    button, input, select, textarea { font: inherit; }
    .page { max-width: 860px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font: 800 20px/1 var(--display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
    .mark i { width: 1.05em; height: 1.05em; border-radius: 22%; background: var(--grad-mark); box-shadow: inset 0 0 0 .18em var(--bg), 0 0 18px #3DD6C666; }
    .eyebrow { font: 800 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--teal); margin: 28px 0 10px; }
    h1 { font: 800 clamp(30px, 7vw, 48px)/1.02 var(--display); letter-spacing: -.03em; margin: 0; overflow-wrap: anywhere; }
    .meta { color: var(--muted); margin: 8px 0 0; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
    .count { color: var(--gold); font-weight: 800; }
    .link { all: unset; cursor: pointer; color: var(--teal); font-weight: 700; text-decoration: underline; }
    .link.quiet { color: var(--muted); }
    .btn { appearance: none; cursor: pointer; border: 1.5px solid #ffffff22; background: #ffffff0e; color: var(--ink); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
    .btn:hover { background: #ffffff1a; }
    .btn.p { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
    .btn.bad { background: var(--hot-soft); border-color: transparent; }
    .tabs { display: flex; gap: 6px; margin: 22px 0 6px; overflow-x: auto; position: sticky; top: 0; z-index: 2; padding: 8px 0; background: var(--bg); }
    .tabs a { flex: none; padding: 9px 14px; border-radius: 99px; color: var(--muted); text-decoration: none; font-weight: 700; border: 1px solid var(--line); }
    .tabs a[aria-current="true"] { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
    .day { margin: 18px 0 0; }
    .day h3 { font: 800 14px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--violet); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .day h3 small { color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; }
    .list { display: grid; gap: 10px; }
    /* One card per item, stacked so the words get the full width on a phone:
       the title row (time, title, cost), the notes, then a quiet line of details. */
    .item { display: grid; gap: 6px; padding: 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; overflow-wrap: anywhere; }
    .item:hover { border-color: #ffffff33; }
    .item .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .item .tm.wide { flex-basis: 100%; }   /* a date (bookings) gets its own line above the title */
    .item .tm { flex: none; font: 600 13px/1.4 var(--mono); color: var(--teal); }
    .item .ttl { flex: 1; min-width: 0; font-size: 16.5px; line-height: 1.35; font-weight: 800; }
    .item .cost { flex: none; font: 700 14px/1.4 var(--body); color: var(--gold); }
    /* long notes stay to a few lines on the list; the whole text opens on tap */
    .item .notes { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; white-space: pre-wrap;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .item .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--faint); }
    .item .meta a { color: var(--teal); font-weight: 600; text-decoration: none; }
    .item .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; padding-top: 10px; border-top: 1px solid #ffffff10; }
    .item .foot .btn { flex: none; white-space: nowrap; }
    .item code { font: 600 12px/1 var(--mono); color: var(--gold); background: #F5C5421a; padding: 4px 7px; border-radius: 6px; }
    .add { all: unset; cursor: pointer; color: var(--muted); font-weight: 700; padding: 8px 2px; }
    .add:hover { color: var(--teal); }
    /* Choices to make: each one-or-the-other part of the trip, its options as rows to tap */
    .choices { background: var(--panel-2); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin: 6px 0 4px; }
    .choices > h2 { margin: 0; font: 800 18px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .choices > h2 small { font: 700 13px/1 var(--body); color: var(--teal); }
    .choices > p { margin: 4px 0 0; }
    .choice { margin-top: 16px; }
    /* each part folds up: a summary line when closed, its options when open */
    details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 0; border-radius: 12px; }
    details.fold > summary::-webkit-details-marker { display: none; }
    details.fold > summary .grow { flex: 1; min-width: 0; }
    details.fold > summary h3 { margin: 0 !important; }
    details.fold > summary .sum { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details.fold > summary .sum.ok { color: var(--teal); font-weight: 700; }
    details.fold > summary .chev { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); transition: transform .2s; }
    details.fold[open] > summary .chev { transform: rotate(180deg); }
    details.fold[open] > summary .sum { display: none; }
    details.fold > summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .choices details.fold { border-top: 1px solid #ffffff12; }
    .choices details.fold:first-of-type { margin-top: 10px; }
    details.fold > .opts, details.fold > .list, details.fold > .booked { margin-bottom: 12px; }
    .choice { margin-top: 0; }
    @media (prefers-reduced-motion: reduce) { details.fold > summary .chev { transition: none; } }
    .choice h3 { margin: 0 0 8px; font: 800 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--violet); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .choice h3 small { color: var(--teal); letter-spacing: 0; text-transform: none; font-weight: 700; }
    .opts { display: grid; gap: 8px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--panel); border: 1.5px solid var(--line); cursor: pointer; }
    .opt:hover { border-color: #ffffff33; }
    .opt .dot { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; }
    .opt.on { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 10%, var(--panel)); }
    .opt.on .dot { border-color: var(--teal); background: var(--teal); }
    .opt.on .dot::after { content: "✓"; color: var(--teal-ink); font-size: 13px; font-weight: 900; }
    .opt.off { opacity: .55; }
    .opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .opt .ot b { display: block; font-size: 15.5px; line-height: 1.35; }
    .opt .ot span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
    .opt .more { all: unset; cursor: pointer; flex: none; color: var(--faint); font-size: 13px; font-weight: 700; padding: 2px 4px; }
    .opt .more:hover { color: var(--teal); }
    .opt.ro { cursor: default; }
    /* food and things to do: a gallery of picture tiles */
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
    @media (min-width: 700px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tile { position: relative; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); isolation: isolate; }
    .tile > img, .tile > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .4s; }
    .tile:hover > img { transform: scale(1.04); }
    .tile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, #0B091800 35%, #0B0918d9 78%, #0B0918f2); }
    .tile .tt { position: absolute; left: 12px; right: 12px; bottom: 12px; }
    .tile .tt b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.25; font-weight: 800; text-shadow: 0 1px 8px #000a; }
    .tile .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tile .tags span { padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: #0B0918b3; border: 1px solid #ffffff26; backdrop-filter: blur(4px); }
    .tile .tags .price { color: var(--gold); }
    .tile .play { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #FF5A4Ae6; color: #fff; font-size: 13px; box-shadow: 0 4px 14px #0008; }
    @media (prefers-reduced-motion: reduce) { .tile > img { transition: none; } }
    /* the item page's video: a thumbnail until tapped, then YouTube's privacy-enhanced player */
    #sheet .vid { position: relative; margin: 14px 16px 0; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; cursor: pointer; }
    #sheet .vid img, #sheet .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
    #sheet .vid .pl { position: absolute; inset: 0; display: grid; place-items: center; }
    #sheet .vid .pl span { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #FF5A4Ae6; color: #fff; font-size: 24px; box-shadow: 0 6px 24px #000a; }
    /* small picture and comment count on cards */
    .item .hd .thumb, .opt .thumb { flex: none; width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--panel-2); }
    .opt .thumb { width: 44px; height: 44px; }
    .cc { font-size: 12.5px; color: var(--violet); font-weight: 700; }
    /* the detail sheet: full screen on a phone, a centred panel on a wide screen */
    #sheet { padding: 0; border: 0; width: 100%; max-width: 680px; height: 100dvh; max-height: 100dvh; margin: 0 auto; background: var(--bg); color: var(--ink); border-radius: 0; }
    @media (min-width: 720px) { #sheet { height: 92dvh; margin-top: 4dvh; border-radius: 22px; border: 1px solid var(--line); } }
    #sheet::backdrop { background: #0B0918dd; }
    #sheet .wrap { display: flex; flex-direction: column; height: 100%; }
    #sheet header.sh { flex: none; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
    #sheet header.sh b { flex: 1; min-width: 0; font: 800 15px/1.2 var(--body); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sheet .body { flex: 1; overflow-y: auto; padding: 0 0 16px; overscroll-behavior: contain; }
    #sheet .pics { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 16px 0; }
    #sheet .pics figure { position: relative; flex: none; margin: 0; width: min(86%, 520px); aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; background: var(--panel-2); scroll-snap-align: start; }
    #sheet .pics figure:only-child { width: 100%; }
    #sheet .pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #sheet .pics figcaption { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 99px; background: #0B0918cc; font-size: 11px; color: var(--muted); }
    #sheet .pics .x { position: absolute; top: 8px; right: 8px; all: unset; cursor: pointer; padding: 4px 9px; border-radius: 99px; background: #0B0918cc; font-size: 13px; }
    #sheet .sec { padding: 16px 16px 0; }
    #sheet h2.t { margin: 0; font: 800 clamp(22px, 6vw, 28px)/1.15 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
    #sheet .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #sheet .chip { padding: 4px 10px; border-radius: 99px; background: #ffffff0e; border: 1px solid #ffffff18; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    #sheet .chip.on { color: var(--teal-ink); background: var(--teal); border-color: var(--teal); }
    #sheet .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; }
    #sheet .fact { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
    #sheet .fact small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
    #sheet .fact b { font-size: 16px; }
    #sheet .notes { margin: 14px 0 0; font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; color: #E3DFFA; }
    #sheet .notes a { color: var(--teal); }
    #sheet .linkcard { display: flex; gap: 12px; align-items: stretch; margin-top: 14px; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; }
    #sheet .linkcard img { flex: none; width: 96px; object-fit: cover; background: var(--panel-2); }
    #sheet .linkcard div { padding: 10px 12px 10px 0; min-width: 0; }
    #sheet .linkcard div:first-child { padding-left: 12px; }
    #sheet .linkcard small { display: block; color: var(--teal); font-weight: 700; font-size: 12px; }
    #sheet .linkcard b { display: block; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
    #sheet .linkcard span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 13px; margin-top: 2px; }
    #sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: flex-start; }
    #sheet .acts a.btn { text-decoration: none; }
    :is(#sheet, .tripchat) h3.k { margin: 22px 0 10px; font: 700 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
    :is(#sheet, .tripchat) .talk { display: grid; gap: 10px; }
    :is(#sheet, .tripchat) .cm { display: flex; gap: 10px; align-items: flex-start; }
    :is(#sheet, .tripchat) .cm .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--display); background: var(--panel-2); border: 1px solid var(--line); }
    :is(#sheet, .tripchat) .cm .bx { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
    :is(#sheet, .tripchat) .cm.me .bx { background: color-mix(in srgb, var(--teal) 12%, var(--panel)); border-color: #3DD6C640; }
    :is(#sheet, .tripchat) .cm .bx small { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 12px; }
    :is(#sheet, .tripchat) .cm .bx small b { color: var(--violet); }
    :is(#sheet, .tripchat) .cm .bx p { margin: 2px 0 0; white-space: pre-wrap; font-size: 15px; }
    :is(#sheet, .tripchat) .cm .bx p a { color: var(--teal); }
    :is(#sheet, .tripchat) .cm .del { all: unset; cursor: pointer; color: var(--faint); }
    :is(#sheet, .tripchat) form.say { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
    :is(#sheet, .tripchat) form.say textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; padding: 11px 14px; border-radius: 22px; background: var(--panel); }
    :is(#sheet, .tripchat) form.say button { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--teal); color: var(--teal-ink); font-weight: 900; font-size: 18px; cursor: pointer; }
    /* flight comparison */
    #fly { padding: 0; border: 0; width: 100%; max-width: 760px; height: 100dvh; max-height: 100dvh; margin: 0 auto; background: var(--bg); color: var(--ink); }
    @media (min-width: 800px) { #fly { height: 94dvh; margin-top: 3dvh; border-radius: 22px; border: 1px solid var(--line); } }
    #fly::backdrop { background: #0B0918dd; }
    #fly .wrap { display: flex; flex-direction: column; height: 100%; }
    #fly header.sh { flex: none; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
    #fly header.sh b { flex: 1; font: 800 17px/1.2 var(--display); }
    #fly .filters { flex: none; padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: var(--panel-2); }
    #fly .frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    #fly .frow > small { width: 100%; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
    #fly .chip { appearance: none; cursor: pointer; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: #ffffff08; color: var(--muted); font: 700 13px/1 var(--body); }
    #fly .chip.on { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
    #fly input[type=range] { width: 100%; accent-color: var(--teal); padding: 0; border: 0; background: none; }
    #fly .rng { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #fly .rng label { font-size: 12.5px; color: var(--muted); font-weight: 700; display: grid; gap: 2px; }
    #fly .rng label b { color: var(--ink); }
    #fly .list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
    #fly .list > * { min-width: 0; }   /* the sideways row of combinations scrolls inside, it never widens the page */
    .fcard { padding: 14px; border-radius: 18px; background: var(--panel); border: 1.5px solid var(--line); display: grid; gap: 10px; }
    .fcard.on { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 8%, var(--panel)); }
    .fcard .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .fcard .pr b { display: block; font: 800 24px/1 var(--display); color: var(--gold); }
    .fcard .pr small { color: var(--muted); font-size: 12.5px; }
    .fcard .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .fcard .badge { padding: 3px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: #ffffff10; }
    .fcard .badge.cheap { background: #F5C54226; color: var(--gold); } .fcard .badge.fast { background: #3DD6C626; color: var(--teal); }
    .fcard .al { font-weight: 800; font-size: 15px; } .fcard .al small { display: block; color: var(--faint); font-weight: 600; font-size: 12.5px; margin-top: 2px; }
    .leg { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #ffffff06; }
    .leg .lh { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .leg .lt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
    .leg .lt b { font: 700 16px/1.1 var(--mono); } .leg .lt b small { display: block; font: 600 11.5px/1.2 var(--body); color: var(--muted); }
    .leg .lt .end { text-align: right; } .leg sup { color: var(--hot); font-size: 10px; }
    .leg .tl { position: relative; height: 6px; border-radius: 99px; background: #ffffff10; }
    .leg .tl i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--violet)); }
    .leg .tl em { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold); }
    .leg .lm { font-size: 13px; color: var(--muted); }
    .leg .lm b { color: var(--ink); }
    .fcard .tot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); } .fcard .tot b { color: var(--ink); }
    .fcard .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; }
    .fcard .acts a { text-decoration: none; }
    #fly .need { padding: 12px 14px; border-radius: 14px; border: 1px dashed #B9A6FF66; color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
    /* the flight builder */
    .legrow { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
    .legrow .n { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--body); background: #ffffff10; color: var(--muted); }
    .legrow.ok .n { background: var(--teal); color: var(--teal-ink); }
    .legrow b { font-size: 14.5px; } .legrow small { color: var(--muted); font-size: 13px; }
    .combos { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 82%); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .combo { scroll-snap-align: start; padding: 12px; border-radius: 16px; background: var(--panel); border: 1.5px solid var(--line); display: grid; gap: 8px; align-content: start; }
    .combo.on { border-color: var(--teal); }
    .combo h4 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; font: 800 14px/1.2 var(--body); }
    .combo h4 small { color: var(--gold); font: 800 17px/1 var(--display); }
    .combo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
    .combo ul b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
    .combo .meta { font-size: 12.5px; color: var(--faint); }
    #fly .legsec h3 { margin: 18px 0 8px; font: 800 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--violet); display: flex; justify-content: space-between; gap: 8px; }
    #fly .legsec h3 small { color: var(--muted); letter-spacing: 0; text-transform: none; }
    #fly .totals { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel-2); }
    #fly .totals b { display: block; font: 800 18px/1.1 var(--display); color: var(--gold); } #fly .totals small { color: var(--muted); font-size: 12.5px; }
    .fcard .facts2 { display: flex; flex-wrap: wrap; gap: 6px; }
    .fcard .facts2 span { padding: 3px 9px; border-radius: 99px; background: #ffffff0c; border: 1px solid #ffffff14; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .fcard .facts2 span.good { color: var(--teal); border-color: #3DD6C644; } .fcard .facts2 span.star { color: var(--gold); }
    .fcard .route { font-size: 14px; color: var(--muted); } .fcard .route b { color: var(--ink); }
    /* polls */
    .poll { flex: 1; min-width: 0; padding: 12px; border-radius: 14px; background: var(--panel); border: 1.5px solid #B9A6FF55; }
    .poll .pq { margin: 0 0 8px; font-weight: 800; font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
    .poll .pq small { display: block; font-weight: 700; font-size: 12px; color: var(--violet); margin-bottom: 2px; }
    .po { position: relative; display: flex; justify-content: space-between; gap: 10px; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #ffffff06; color: var(--ink); font: inherit; text-align: left; cursor: pointer; overflow: hidden; isolation: isolate; }
    .po i { position: absolute; inset: 0 auto 0 0; z-index: -1; background: #B9A6FF2e; transition: width .3s; }
    .po.mine { border-color: var(--teal); } .po.mine i { background: #3DD6C640; }
    .po .pl { font-weight: 700; overflow-wrap: anywhere; } .po .pn { flex: none; color: var(--muted); font-size: 13px; font-weight: 700; }
    .po:disabled { cursor: default; }
    .poll .pf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--faint); }
    .poll .pf button { all: unset; cursor: pointer; color: var(--muted); font-weight: 700; }
    .poll .pf button:hover { color: var(--teal); }
    /* the poll being made, above the message box */
    .pb { flex: none; display: grid; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel-2); }
    .pb b { font-size: 14px; }
    .pb input { padding: 10px 12px; }
    .pb .pps { display: flex; gap: 6px; flex-wrap: wrap; }
    .pb .pps button, .pb .padd { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; background: #ffffff0e; border: 1px solid #ffffff1c; }
    .pb .row2 { display: flex; gap: 8px; align-items: center; } .pb .row2 .grow { flex: 1; }
    :is(#sheet, .tripchat) form.say .pollbtn { background: #ffffff10; color: var(--ink); border: 1.5px solid var(--line); font-size: 17px; }
    /* the trip's chat (Chat tab): the message box stays at the bottom of the screen */
    .tripchat .talk { margin-top: 12px; }
    .tripchat form.say, .tripchat .pb { position: sticky; bottom: 0; margin: 14px -16px 0; z-index: 2; }
    .tripchat .pb + form.say { margin-top: 0; }
    .booked { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: #3DD6C614; border: 1px solid #3DD6C655; font-weight: 700; cursor: pointer; }
    .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px; border-radius: 14px; background: var(--panel-2); margin: 10px 0; }
    .total b { font: 800 22px/1 var(--display); color: var(--gold); }
    .packs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 14px; }
    .pack { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .pack h3 { margin: 0 0 8px; font: 800 15px/1.2 var(--display); }
    .pack label { display: flex; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; }
    .pack label.done span { color: var(--faint); text-decoration: line-through; }
    .pack input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
    .pack form { display: flex; gap: 6px; margin-top: 8px; }
    input, select, textarea { color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; font-size: 16px; }
    textarea { resize: vertical; min-height: 70px; }
    .empty { color: var(--muted); padding: 10px 2px; }
    dialog { width: min(480px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 20px; background: var(--panel-2); color: var(--ink); padding: 20px; }
    dialog::backdrop { background: #0B0918bb; }
    dialog form { display: grid; gap: 12px; }
    dialog label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
    dialog .row { display: flex; gap: 10px; } dialog .row > * { flex: 1; }
    dialog .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    dialog h2 { margin: 0; font: 800 20px/1.2 var(--display); }
    .note { color: var(--muted); font-size: 13px; }
    /* search the trip, or ask Claude */
    .ask { position: relative; margin: 18px 0 0; }
    .ask form { display: flex; gap: 8px; }
    .ask input { padding: 14px 16px; background: var(--panel); border-radius: 14px; font-size: 16px; }
    .ask .btn { flex: none; background: var(--gold); border-color: var(--gold); color: var(--gold-ink); border-radius: 14px; padding: 0 16px; }
    .found { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 3; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 24px #0008; max-height: 60vh; overflow-y: auto; }
    .found button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: baseline; width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 10px; }
    .found button:hover, .found button.on { background: #ffffff10; }
    .found .k { flex: none; font: 700 11px/1 var(--mono); text-transform: uppercase; color: var(--violet); min-width: 64px; }
    .found .askrow b { color: var(--gold); }
    .answer { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 9%, var(--panel)); border: 1px solid #F5C54255; }
    .answer .q { color: var(--muted); font-size: 13px; }
    .answer .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .answer .chips button { all: unset; cursor: pointer; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #ffffff12; }
    .answer.wait { color: var(--muted); }
    .claude { color: var(--gold); font-size: 12px; margin-left: 4px; }
    .topic { margin: 20px 0 0; scroll-margin-top: 64px; }
    .topic h3 { font: 800 14px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--violet); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
    .topic h3 small { color: var(--teal); font-weight: 700; letter-spacing: 0; text-transform: none; }
    .ti { margin-right: 6px; }
    details.asks { margin-top: 8px; color: var(--muted); font-size: 13px; }
    details.asks summary { cursor: pointer; }
    details.asks p { margin: 6px 0; }
  </style>
</head>
<body>
<main class="page">
  <header>
    <a class="mark" href="/"><i aria-hidden="true"></i>r4box</a>
    <span id="trips"></span>
  </header>

  <section id="none" hidden>
    <p class="eyebrow">Trips</p>
    <h1>No trip yet</h1>
    <p class="meta" id="nonetext"></p>
    <p><button class="btn p" id="newtrip" hidden>Start a trip</button></p>
  </section>

  <section id="trip" hidden>
    <p class="eyebrow">Trip</p>
    <h1 id="name"></h1>
    <p class="meta"><span id="where"></span><span id="when"></span><span class="count" id="countdown"></span><button class="link quiet" id="edittrip" hidden>Edit</button><button class="link quiet" id="newtrip2" hidden>＋ New trip</button></p>
    <p class="meta" id="goal" hidden></p>
    <div class="ask">
      <form id="askf"><input id="askq" placeholder="Search the trip, or ask Claude…" autocomplete="off" aria-label="Search the trip, or ask Claude" maxlength="2000"><button class="btn" id="askgo">✦ Ask</button></form>
      <div class="found" id="found" hidden></div>
    </div>
    <div id="answer"></div>
    <details class="asks" id="asks" hidden><summary>Recent asks</summary><div id="asklist"></div></details>
    <nav class="tabs" aria-label="Trip sections">
      <a href="#plan">Plan</a><a href="#ideas">Ideas</a><a href="#bookings">Bookings</a><a href="#packing">Packing</a><a href="#chat">💬 Chat</a>
    </nav>
    <div id="view"></div>
  </section>
</main>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<dialog id="sheet" aria-label="Details"></dialog>
<dialog id="fly" aria-label="Compare flights"></dialog>
<input type="file" id="photofile" accept="image/*" hidden>

<script type="module">
  import { sb, roleOf } from './auth.js';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeLink = (u) => /^https?:\/\//i.test(u || '') ? u : '';

  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  const ME = { id: session?.user.id, role: roleOf(session?.user) };
  const PARENT = ME.role === 'parent';

  let trips = [], trip = null, items = [], family = [], asks = [], comments = [];
  const photoUrls = new Map();   // trip-photos path -> signed URL
  let polls = [], pollVotes = [], deepDone = false;
  const cc = (id) => comments.filter((c) => c.item === id).length + polls.filter((q) => q.item === id).length;
  const nameOf = (id) => family.find((f) => f.id === id)?.username || '';

  // ---- dates ----
  const D = (s) => new Date(s + 'T12:00:00');
  const iso = (d) => d.toISOString().slice(0, 10);
  const nice = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => D(s).toLocaleDateString([], o);
  function days() {
    const out = [];
    if (trip.starts && trip.ends && trip.ends >= trip.starts) for (let d = D(trip.starts); iso(d) <= trip.ends && out.length < 60; d.setDate(d.getDate() + 1)) out.push(iso(d));
    for (const i of items) if (i.day && !out.includes(i.day)) out.push(i.day);
    return out.sort();
  }
  const money = (n) => new Intl.NumberFormat([], { style: 'currency', currency: trip?.currency || 'USD' }).format(n || 0);

  // ---- load ----
  async function load() {
    const [{ data: t }, { data: f }] = await Promise.all([sb.from('trips').select('*').order('starts', { ascending: true, nullsFirst: false }), family.length ? { data: family } : sb.rpc('r4_family')]);
    trips = t || []; family = f || [];
    const want = new URLSearchParams(location.search).get('t');
    const today = iso(new Date());
    trip = trips.find((x) => x.id === want) || trips.find((x) => !x.ends || x.ends >= today) || trips[trips.length - 1] || null;
    if (trip) {
      const { data: it } = await sb.from('trip_items').select('*').eq('trip', trip.id).order('created_at');
      items = it || [];
      const { data: cm } = await sb.from('trip_comments').select('id, item, author, body, created_at').eq('trip', trip.id).order('id');
      comments = cm || [];
      const [{ data: pl }, { data: pv }] = await Promise.all([
        sb.from('trip_polls').select('*').eq('trip', trip.id).order('id'),
        sb.from('trip_poll_votes').select('poll, voter, choice'),
      ]);
      polls = pl || []; pollVotes = (pv || []).filter((v) => polls.some((q) => q.id === v.poll));
      const need = [...new Set(items.flatMap((i) => i.photos || []))].filter((p) => !photoUrls.has(p));
      if (need.length) { const { data: su } = await sb.storage.from('trip-photos').createSignedUrls(need, 3600); for (const x of su || []) if (x.signedUrl) photoUrls.set(x.path, x.signedUrl); }
      const { data: a } = await sb.from('trip_asks').select('asker, text, reply, added, created_at').eq('trip', trip.id).order('created_at', { ascending: false }).limit(8);
      asks = a || [];
    }
    // Drafts and the poll being made live in drafts/builder; only focus and scroll need carrying over.
    const focusKey = document.activeElement?.dataset?.f, inSheet = !!document.activeElement?.closest?.('#sheet');
    const nearEnd = window.innerHeight + window.scrollY > document.body.scrollHeight - 120;
    render();
    if ((location.hash || '#plan') === '#chat' && nearEnd) window.scrollTo({ top: document.body.scrollHeight });
    // A link to one item (from the family chat) opens it, once.
    const deep = new URLSearchParams(location.search).get('i');
    if (deep && !deepDone) {
      deepDone = true;
      const it = items.find((x) => x.id === deep);
      if (it) { history.replaceState(null, '', '?t=' + trip.id + '#' + TAB[it.kind]); render(); view(it); }
    }
    if (open && $('sheet').open) {
      const b = $('sheet').querySelector('.body'), atEnd = b && b.scrollHeight - b.scrollTop - b.clientHeight < 60, top = b ? b.scrollTop : 0;
      renderSheet();
      const b2 = $('sheet').querySelector('.body'); if (b2) b2.scrollTop = atEnd ? b2.scrollHeight : top;
    }
    if (focusKey) (inSheet ? $('sheet') : $('view')).querySelector(`[data-f="${focusKey}"]`)?.focus();
    if ($('fly').open && document.activeElement?.type !== 'range') (flyMode !== 'flights' ? renderPartBuilder() : planOf() ? renderBuilder() : renderFlights());   // not mid-drag
  }

  function render() {
    $('none').hidden = !!trip; $('trip').hidden = !trip;
    $('trips').innerHTML = trips.length > 1 ? `<select id="pick" aria-label="Trip">${trips.map((x) => `<option value="${x.id}" ${x.id === trip?.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : '';
    if ($('pick')) $('pick').onchange = () => { history.replaceState(null, '', '?t=' + $('pick').value + location.hash); load(); };
    if (!trip) {
      $('nonetext').textContent = 'Start one and the family can plan it with you.';
      $('newtrip').hidden = false; return;
    }
    $('name').textContent = trip.name;
    $('where').textContent = (trip.origin && trip.place ? trip.origin + ' → ' : '') + (trip.place || '');
    $('when').textContent = trip.starts ? nice(trip.starts, { month: 'short', day: 'numeric' }) + (trip.ends ? ' – ' + nice(trip.ends, { month: 'short', day: 'numeric', year: 'numeric' }) : '') : '';
    const n = trip.starts ? Math.round((D(trip.starts) - D(iso(new Date()))) / 86400000) : null;
    $('countdown').textContent = n == null ? '' : n > 1 ? `in ${n} days` : n === 1 ? 'tomorrow!' : n === 0 ? 'today!' : trip.ends && trip.ends >= iso(new Date()) ? 'happening now' : '';
    // Anyone starts a trip; its starter or a parent edits it (092).
    $('edittrip').hidden = !(PARENT || trip.created_by === ME.id); $('newtrip2').hidden = false;
    $('goal').hidden = !trip.goal; $('goal').textContent = trip.goal ? '🎯 ' + trip.goal : '';
    const tab = (location.hash || '#plan').slice(1);
    document.querySelectorAll('.tabs a').forEach((a) => a.setAttribute('aria-current', String(a.hash === '#' + tab)));
    ({ plan, ideas, bookings, packing, chat }[tab] || plan)();
    $('asks').hidden = !asks.length;
    $('asklist').innerHTML = asks.map((a) => `<p><b>${esc(nameOf(a.asker))}:</b> ${esc(a.text)}<br>✦ ${esc(a.reply || '')}</p>`).join('');
  }

  // ---- search the trip as you type; Enter or ✦ Ask asks Claude ----
  const TAB = { plan: 'plan', idea: 'ideas', booking: 'bookings', pack: 'packing' };
  // What a trip needs, in the order it gets decided (dates first: flights and hotels hang on them).
  const TOPIC = { dates: ['📅', 'Dates'], flights: ['✈️', 'Flights'], tickets: ['🎟️', 'Tickets'], stay: ['🏨', 'Where to stay'],
    transport: ['🚕', 'Getting around'], food: ['🍽️', 'Food'], activities: ['🎯', 'Things to do'], other: ['✦', 'Other'] };
  // The parts of a trip that are one-or-the-other: the Choices card. Food, things to do and the rest stay plain ideas.
  const CHOICES = ['dates', 'flights', 'tickets', 'stay', 'transport'];
  // What a choice changes further down: the parts Claude reworks to fit it.
  const AFFECTS = { dates: ['flights', 'tickets', 'stay', 'transport'], flights: ['transport'], tickets: ['stay', 'transport'], stay: ['transport'], transport: [] };
  let updating = null;     // { text } while Claude reworks the parts below a choice
  const showOthers = new Set();   // decided parts whose other options are shown again
  const bookedFor = (t) => items.find((i) => i.kind === 'booking' && i.topic === t);
  const chosenFor = (t) => items.find((i) => i.kind === 'idea' && i.topic === t && i.chosen);
  const planOf = () => (Array.isArray(trip?.flight_plan) && trip.flight_plan.length ? trip.flight_plan : null);
  const legOpts = (n) => items.filter((i) => i.kind === 'idea' && i.topic === 'flights' && i.flight?.kind === 'leg' && i.flight.leg === n);
  const pickOf = (n) => { const id = planOf()?.[n]?.pick; return id ? items.find((i) => i.id === id && i.flight?.leg === n) : null; };
  const planDone = () => { const p = planOf(); return !!p && p.every((_, n) => pickOf(n)); };
  // Tickets, stay and getting around: plans like the flight plan (trips.plans[part]: pieces, a pick each).
  const PARTS = ['tickets', 'stay', 'transport'];
  const partPlan = (t) => (Array.isArray(trip?.plans?.[t]) && trip.plans[t].length ? trip.plans[t] : null);
  const partOpts = (t, n) => items.filter((i) => i.kind === 'idea' && i.topic === t && i.details && i.details.seg === n);
  const partPick = (t, n) => { const id = partPlan(t)?.[n]?.pick; return id ? items.find((i) => i.id === id && i.details?.seg === n) : null; };
  const partDone = (t) => { const p = partPlan(t); return !!p && p.every((_, n) => partPick(t, n)); };
  const totalOf = (i) => { const d = i?.details || {}; return d.total ?? (d.price_each != null ? d.price_each * (d.count || family.length || 1) : d.nightly != null && d.nights ? d.nightly * d.nights : i?.cost ?? null); };
  const decided = (t) => (t === 'dates' && !!trip.starts) || !!bookedFor(t) || !!chosenFor(t) || (t === 'flights' && planDone()) || (PARTS.includes(t) && partDone(t));
  const canChoose = () => PARENT || trip.created_by === ME.id;
  $('askq').oninput = () => {
    const q = $('askq').value.trim().toLowerCase();
    if (!q) { $('found').hidden = true; return; }
    const hits = items.filter((i) => [i.title, i.notes, i.conf, i.at].join(' ').toLowerCase().includes(q)).slice(0, 8);
    $('found').hidden = false;
    $('found').innerHTML = hits.map((i) => `<button data-id="${i.id}"><span class="k">${i.kind === 'pack' ? 'packing' : i.kind}</span><span>${esc(i.title)}${i.day ? ` <small class="note">${nice(i.day)}</small>` : ''}</span></button>`).join('')
      + `<button class="askrow" data-ask="1"><span class="k">✦ Claude</span><b>Ask: “${esc($('askq').value.trim().slice(0, 60))}”</b></button>`;
    $('found').querySelectorAll('button[data-id]').forEach((b) => b.onclick = () => {
      const i = items.find((x) => x.id === b.dataset.id); $('found').hidden = true; $('askq').value = '';
      location.hash = TAB[i.kind]; setTimeout(() => view(i), 50);
    });
    $('found').querySelector('[data-ask]').onclick = () => $('askf').requestSubmit();
  };
  document.addEventListener('click', (e) => { if (!e.target.closest('.ask')) $('found').hidden = true; });
  const HELPER = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/trip-helper';
  let asking = false;
  $('askf').onsubmit = async (e) => {
    e.preventDefault();
    const text = $('askq').value.trim();
    if (!text || asking) return;
    asking = true; $('askgo').disabled = true; $('found').hidden = true; $('askq').value = '';
    $('answer').innerHTML = `<div class="answer wait"><div class="q">${esc(text)}</div>✦ Claude is on it… (research can take a minute)</div>`;
    let r;
    try {
      const { data: { session: s } } = await sb.auth.getSession();
      r = await (await fetch(HELPER, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ trip: trip.id, text }) })).json();
    } catch { r = { error: 'Claude could not help just now. Try again in a minute.' }; }
    asking = false; $('askgo').disabled = false;
    await load();
    if (r.trip) location.hash = '#ideas';
    const touched = [...(r.added || []), ...(r.changed || [])].map((id) => items.find((i) => i.id === id)).filter(Boolean);
    $('answer').innerHTML = `<div class="answer"><div class="q">${esc(text)}</div>${r.error ? esc(r.error) : '✦ ' + esc(r.reply)}
      ${touched.length ? `<div class="chips">${touched.map((i) => `<button data-id="${i.id}">${i.kind === 'pack' ? 'packing' : i.kind}: ${esc(i.title.slice(0, 40))}</button>`).join('')}</div>` : ''}
      ${r.left != null && r.left < 10 ? `<div class="note" style="margin-top:6px">${r.left} questions left today</div>` : ''}
      <div style="margin-top:6px"><button class="link quiet" id="ansx">Dismiss</button></div></div>`;
    $('ansx').onclick = () => { $('answer').innerHTML = ''; };
    $('answer').querySelectorAll('.chips button').forEach((b) => b.onclick = () => { const i = items.find((x) => x.id === b.dataset.id); if (i) { location.hash = TAB[i.kind]; setTimeout(() => view(i), 50); } });
    if (touched[0]) location.hash = TAB[touched[0].kind];
  };
  window.addEventListener('hashchange', render);

  // tm: time or date before the title; cost: on the title row; meta: extra details (html) for the line below; foot: a footer (e.g. Booked it).
  const itemRow = (i, { tm = i.at, cost = '', icon = false, meta = [], foot = '' } = {}) => {
    const link = safeLink(i.link) ? `<a href="${esc(i.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(new URL(i.link).hostname.replace(/^www\./, ''))} ↗</a>` : '';
    const details = [...meta, link, cc(i.id) ? `<span class="cc">💬 ${cc(i.id)}</span>` : ''].filter(Boolean);
    const pic = picOf(i);
    return `<div class="item" data-id="${i.id}">
      <div class="hd">${tm ? `<span class="tm${String(tm).length > 6 ? ' wide' : ''}">${esc(tm)}</span>` : ''}<span class="ttl">${icon && TOPIC[i.topic] ? `<span class="ti" title="${TOPIC[i.topic][1]}">${TOPIC[i.topic][0]}</span>` : ''}${esc(i.title)}${i.by_claude ? '<span class="claude" title="Added by Claude">✦</span>' : ''}</span>${cost ? `<span class="cost">${cost}</span>` : ''}${pic ? `<img class="thumb" src="${esc(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</div>
      ${i.notes ? `<p class="notes">${esc(i.notes)}</p>` : ''}
      ${details.length ? `<div class="meta">${details.join('<span aria-hidden="true">·</span>')}</div>` : ''}
      ${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
  };
  const wire = () => $('view').querySelectorAll('.item[data-id]').forEach((el) => el.onclick = () => view(items.find((i) => i.id === el.dataset.id)));
  // A YouTube link's video id (watch?v=, youtu.be/, shorts/, embed/), or ''.
  const ytId = (u) => (String(u || '').match(/^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/) || [])[1] || '';
  // An item's picture: one the family added first, else its link's preview image, else its video's thumbnail.
  const picOf = (i) => (i.photos || []).map((p) => photoUrls.get(p)).find(Boolean) || (i.preview?.image && /^https:\/\//.test(i.preview.image) ? i.preview.image : '')
    || (ytId(i.video) ? `https://i.ytimg.com/vi/${ytId(i.video)}/hqdefault.jpg` : '');
  // No picture: a Seed-of-Life rosette in r4box's colours, different for every title.
  function geoArt(seed) {
    let h = 2166136261; for (const c of String(seed)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    const cols = ['#3DD6C6', '#B9A6FF', '#F5C542', '#FF5A4A', '#C9FFF8'], a = cols[h % 5], b = cols[(h >> 3) % 5], n = 6 + (h % 4) * 2, r = 22 + (h >> 7) % 10;
    const circles = Array.from({ length: n }, (_, k) => { const t = (k / n) * Math.PI * 2; return `<circle cx="${(50 + Math.cos(t) * r * 0.55).toFixed(1)}" cy="${(52 + Math.sin(t) * r * 0.55).toFixed(1)}" r="${r}" />`; }).join('');
    return `<svg viewBox="0 0 100 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="125" fill="#171331"/><g fill="none" stroke="${a}" stroke-width=".6" opacity=".7">${circles}</g><circle cx="50" cy="52" r="${r * 1.55}" fill="none" stroke="${b}" stroke-width=".5" opacity=".6"/><circle cx="50" cy="52" r="2" fill="${b}"/></svg>`;
  }
  const priceOf = (i) => i.cost ? money(i.cost) : ((i.notes || '').match(/(?:about|around|roughly|~)\s*\$[\d,]+(?:\s*[–-]\s*\$?[\d,]+)?/i) || [])[0]?.replace(/^(about|around|roughly|~)\s*/i, '') || '';
  const tile = (i) => {
    const pic = picOf(i), tags = [priceOf(i) && `<span class="price">${esc(priceOf(i))}</span>`, cc(i.id) && `<span>💬 ${cc(i.id)}</span>`].filter(Boolean);
    return `<div class="tile" data-id="${i.id}" role="button" tabindex="0" aria-label="${esc(i.title)}">
      ${pic ? `<img src="${esc(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=window.__geo(this.closest('.tile').dataset.id)">` : geoArt(i.id)}
      ${ytId(i.video) ? '<span class="play" aria-label="Has a video">▶</span>' : ''}
      <div class="tt"><b>${esc(i.title)}</b>${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div></div>`;
  };
  window.__geo = geoArt;   // a picture that fails to load becomes the rosette
  // Food and things to do: fetch missing pictures in the background, two at a time; the server keeps them.
  const warmed = new Set();
  async function warmPictures() {
    const want = items.filter((i) => ['food', 'activities'].includes(i.topic) && !picOf(i) && !warmed.has(i.id));
    want.forEach((i) => warmed.add(i.id));
    const { data: { session: s } } = await sb.auth.getSession();
    let changed = false;
    const one = async (i) => {
      try {
        const r = await (await fetch(PREVIEW, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ item: i.id }) })).json();
        if (r.preview?.image) { i.preview = r.preview; changed = true; }
      } catch {}
    };
    for (let k = 0; k < want.length; k += 2) await Promise.all(want.slice(k, k + 2).map(one));
    if (changed && (location.hash || '#plan') === '#ideas') render();
  }

  function plan() {
    const ds = days(), list = items.filter((i) => i.kind === 'plan');
    const sec = (d, title, sub) => {
      const its = list.filter((i) => (i.day || null) === d).sort((a, b) => String(a.at || '99').localeCompare(String(b.at || '99')));
      return `<div class="day"><h3>${title}<small>${sub}</small></h3><div class="list">${its.map((i) => itemRow(i, { cost: i.cost ? money(i.cost) : '', icon: true })).join('')}</div>
        <button class="add" data-day="${d || ''}">＋ Add to ${d ? nice(d, { weekday: 'long' }) : 'any day'}</button></div>`;
    };
    $('view').innerHTML = (ds.length ? ds.map((d, k) => sec(d, nice(d), `Day ${k + 1}`)).join('') : `<p class="empty">No dates yet. Ask Claude above, e.g. “when should we go?”${PARENT ? ', or set them with Edit' : ''}.</p>`)
      + (list.some((i) => !i.day) || !ds.length ? sec(null, 'Any day', 'not scheduled yet') : '');
    $('view').querySelectorAll('.add').forEach((b) => b.onclick = () => edit({ kind: 'plan', day: b.dataset.day || null }));
    wire();
  }

  // Which sections are open, per trip, kept on this device. Unset: only the first
  // undecided part is open, so the page starts short and points at the next decision.
  let folds = {}, foldsFor = null;
  const isOpen = (k) => folds[k] ?? false;
  function ideas() {
    const list = items.filter((i) => i.kind === 'idea');
    if (foldsFor !== trip.id) {
      foldsFor = trip.id; folds = {};
      try { folds = JSON.parse(localStorage.getItem('trip-folds-' + trip.id) || '{}') || {}; } catch {}
      const next = CHOICES.find((t) => list.some((i) => i.topic === t) && !decided(t));
      if (!Object.keys(folds).length) { if (next) folds[next] = true; folds['g:food'] = true; folds['g:activities'] = true; }
    }
    const mayChoose = canChoose();
    // Flights show once there are options, a booking or a flight plan, or as soon as the trip knows when and from where.
    const parts = CHOICES.filter((t) => list.some((i) => i.topic === t) || bookedFor(t) || (t === 'flights' && (planOf() || (trip.origin && trip.starts))) || (PARTS.includes(t) && (partPlan(t) || trip.starts)));
    const done = parts.filter(decided).length;
    const opt = (i) => {
      const on = !!i.chosen, other = !on && !!chosenFor(i.topic);
      return `<div class="opt${on ? ' on' : ''}${other ? ' off' : ''}${mayChoose ? '' : ' ro'}" data-choose="${i.id}" role="radio" aria-checked="${on}" tabindex="0">
        <span class="dot" aria-hidden="true"></span>
        <span class="ot"><b>${esc(i.title)}</b>${i.notes ? `<span>${esc(i.notes)}</span>` : ''}${cc(i.id) ? `<em class="cc" style="font-style:normal">💬 ${cc(i.id)}</em>` : ''}</span>${picOf(i) ? `<img class="thumb" src="${esc(picOf(i))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        <button class="more" data-more="${i.id}" aria-label="Details">Details</button></div>`;
    };
    const card = parts.length ? `<div class="choices"><h2>Choices to make <small>${done} of ${parts.length} decided</small></h2>
      ${updating ? `<div class="answer wait" style="margin-top:10px">✦ ${esc(updating.text)}</div>` : ''}
      <p class="note">${mayChoose ? 'Tap an option to choose it, tap again to undo. Claude builds on what you choose.' : `${trip.created_by && family.find((f) => f.id === trip.created_by)?.role === 'kid' ? 'Whoever started this trip' : 'Dad'} makes the choices. Tap Details to read an option.`}</p>
      ${parts.map((t) => {
        const bk = bookedFor(t), opts = list.filter((i) => i.topic === t);
        const status = bk ? '<small>✓ booked</small>' : chosenFor(t) ? '<small>✓ chosen</small>' : t === 'dates' && trip.starts ? '<small>✓ set</small>' : '';
        if (t === 'flights' && !bk && (planOf() || !opts.length)) return flightPart(status);
        if (PARTS.includes(t) && !bk && (partPlan(t) || !opts.length)) return partSection(t, status);
        const ch = chosenFor(t);
        const sum = bk ? `<span class="sum ok">✓ booked: ${esc(bk.title)}</span>` : ch ? `<span class="sum ok">✓ ${esc(ch.title)}</span>`
          : `<span class="sum">${opts.length} option${opts.length === 1 ? '' : 's'} to choose from</span>`;
        return `<details class="choice fold" id="topic-${t}" data-fold="${t}"${isOpen(t) ? ' open' : ''}><summary><span class="grow"><h3>${TOPIC[t][0]} ${TOPIC[t][1]} ${status}</h3>${sum}</span><span class="chev" aria-hidden="true">⌄</span></summary>
          ${bk ? `<div class="booked" data-more="${bk.id}">✓ ${esc(bk.title)}${bk.conf ? ` <code>${esc(bk.conf)}</code>` : ''}</div>`
            : `<div class="opts" role="radiogroup" aria-label="${TOPIC[t][1]}">${PARTS.includes(t) && canChoose() ? `<button type="button" class="btn p" data-setuppart="${t}" style="justify-self:start" ${flyBusy ? 'disabled' : ''}>${flyBusy ? '✦ Setting up… (about a minute)' : `✦ Set up the ${TOPIC[t][1].toLowerCase()} builder`}</button>` : ''}${t === 'flights' && opts.length > 1 ? '<button type="button" class="btn p" data-compare="1" style="justify-self:start">✈️ Compare flights side by side</button>' : ''}${(ch && !showOthers.has(t) ? [ch] : opts).map(opt).join('')}
              ${ch && opts.length > 1 ? `<button type="button" class="add" data-others="${t}">${showOthers.has(t) ? 'Hide the other options' : `Show ${opts.length - 1} other option${opts.length === 2 ? '' : 's'}`}</button>` : ''}</div>`}</details>`;
      }).join('')}</div>` : '';
    // Everything else: places to go, food to try, other ideas.
    const rest = list.filter((i) => !CHOICES.includes(i.topic));
    const groups = [...Object.keys(TOPIC).filter((t) => !CHOICES.includes(t)), null].map((t) => ({ t, its: rest.filter((i) => (TOPIC[i.topic] ? i.topic : null) === t) })).filter((g) => g.its.length);
    $('view').innerHTML = card
      + (groups.length ? groups.map((g) => { const k = 'g:' + (g.t || 'none'); return `<details class="topic fold" id="topic-${g.t || 'none'}" data-fold="${k}"${isOpen(k) ? ' open' : ''}><summary><span class="grow"><h3>${g.t ? TOPIC[g.t].join(' ') : 'More ideas'}</h3><span class="sum">${g.its.length} idea${g.its.length === 1 ? '' : 's'}: ${esc(g.its.slice(0, 3).map((i) => i.title).join(', '))}</span></span><span class="chev" aria-hidden="true">⌄</span></summary>
          ${['food', 'activities'].includes(g.t) ? `<div class="gallery">${g.its.map(tile).join('')}</div>`
            : `<div class="list">${g.its.map((i) => itemRow(i, { tm: null, meta: [`added by ${esc(nameOf(i.created_by) || 'someone')}`] })).join('')}</div>`}</details>`; }).join('')
        : parts.length ? '' : `<p class="empty">No ideas yet. Add one, or ask Claude to “break the trip down”: dates, flights, tickets and where to stay come back as choices to make.</p>`)
      + `<button class="add" id="addidea">＋ Add an idea</button>`;
    $('view').querySelectorAll('.tile[data-id]').forEach((el) => {
      const go = () => view(items.find((i) => i.id === el.dataset.id));
      el.onclick = go; el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    warmPictures();
    $('view').querySelectorAll('details.fold').forEach((d) => d.addEventListener('toggle', () => {
      folds[d.dataset.fold] = d.open;
      try { localStorage.setItem('trip-folds-' + trip.id, JSON.stringify(folds)); } catch {}
    }));
    $('addidea').onclick = () => edit({ kind: 'idea' });
    $('view').querySelectorAll('[data-more]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); view(items.find((i) => i.id === b.dataset.more)); });
    $('view').querySelectorAll('[data-compare]').forEach((b) => b.onclick = () => openFlights());
    $('view').querySelectorAll('[data-openpart]').forEach((b) => b.onclick = () => openPart(b.dataset.openpart));
    $('view').querySelectorAll('[data-setuppart]').forEach((b) => b.onclick = () => setupPart(b.dataset.setuppart));
    $('view').querySelectorAll('[data-setupflights]').forEach((b) => b.onclick = () => askFlights(`Set up the flights for this trip: set the flight plan from the chosen dates and places${trip.origin ? ' (the family travels from ' + trip.origin + ')' : ''}, every flight the trip takes in order, then find 3 to 5 options for each leg as flight ideas with flight kind 'leg'. Leave everything else as it is.`));
    $('view').querySelectorAll('[data-others]').forEach((b) => b.onclick = () => { const t = b.dataset.others; showOthers.has(t) ? showOthers.delete(t) : showOthers.add(t); render(); });
    $('view').querySelectorAll('[data-choose]').forEach((el) => {
      const pick = async () => {
        const i = items.find((x) => x.id === el.dataset.choose);
        if (!mayChoose) { view(i); return; }
        const { error } = await sb.rpc('trip_choose', { p_item: i.id, p_on: !i.chosen });
        if (error) { alert('Could not choose: ' + error.message); return; }
        if (!i.chosen) { showOthers.delete(i.topic); reworkBelow(i); }
        if (!i.chosen) {   // chosen: fold this part away and open the next one still to decide
          folds[i.topic] = false;
          const next = CHOICES.find((t) => t !== i.topic && list.some((x) => x.topic === t) && !decided(t));
          if (next) folds[next] = true;
          try { localStorage.setItem('trip-folds-' + trip.id, JSON.stringify(folds)); } catch {}
        }
        load();
      };
      el.onclick = pick;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    });
    wire();
  }

  function bookings() {
    const list = items.filter((i) => i.kind === 'booking').sort((a, b) => String(a.day || '9').localeCompare(String(b.day || '9')) || String(a.at || '').localeCompare(String(b.at || '')));
    const planCost = items.filter((i) => i.kind === 'plan').reduce((s, i) => s + (+i.cost || 0), 0);
    const bookCost = list.reduce((s, i) => s + (+i.cost || 0), 0);
    // Chosen on the Choices card, not booked yet.
    const toBook = items.filter((i) => i.kind === 'idea' && i.chosen && ['flights', 'stay', 'tickets', 'transport'].includes(i.topic) && !bookedFor(i.topic));
    const todo = toBook.length ? `<div class="topic"><h3>To book <small>chosen, not booked yet</small></h3><div class="list">${toBook.map((i) => itemRow(i, { tm: null, icon: true,
        foot: PARENT ? `<span class="note">Booked it? Add the confirmation.</span><button class="btn p" data-book="${i.id}">Booked it</button>` : '' })).join('')}</div></div><div class="topic"><h3>Booked</h3></div>` : '';
    $('view').innerHTML = `${todo}<div class="total"><span>Trip total<br><small class="note">bookings ${money(bookCost)} · planned activities ${money(planCost)}</small></span><b>${money(bookCost + planCost)}</b></div>
      <div class="list">${list.map((i) => itemRow(i, { icon: true, tm: i.day ? nice(i.day, { month: 'short', day: 'numeric' }) + (i.at ? ' ' + i.at : '') : '', cost: i.cost ? money(i.cost) : '', meta: i.conf ? [`<code>${esc(i.conf)}</code>`] : [] })).join('')
      || '<p class="empty">No bookings yet: flights, hotels, cars, tickets.</p>'}</div>
      ${PARENT ? '<button class="add" id="addbook">＋ Add a booking</button>' : '<p class="note">Dad adds and changes bookings.</p>'}`;
    if ($('addbook')) $('addbook').onclick = () => edit({ kind: 'booking' });
    $('view').querySelectorAll('[data-book]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); const i = items.find((x) => x.id === b.dataset.book); edit({ ...i, kind: 'booking', _from: i.id }); });
    if (PARENT) wire();
  }

  function packing() {
    const lists = [...family.map((f) => ({ who: f.id, title: f.id === ME.id ? `${f.username} (you)` : f.username })), { who: null, title: 'Shared' }];
    $('view').innerHTML = `<div class="packs">${lists.map((l) => {
      const its = items.filter((i) => i.kind === 'pack' && (i.who || null) === l.who);
      const done = its.filter((i) => i.done).length;
      return `<div class="pack"><h3>${esc(l.title)} <small class="note">${its.length ? `${done}/${its.length}` : ''}</small></h3>
        ${its.map((i) => `<label class="${i.done ? 'done' : ''}"><input type="checkbox" data-id="${i.id}" ${i.done ? 'checked' : ''}><span>${esc(i.title)}</span><button type="button" class="link quiet" data-del="${i.id}" style="margin-left:auto;text-decoration:none" aria-label="Remove">✕</button></label>`).join('')}
        <form data-who="${l.who || ''}"><input placeholder="Add…" aria-label="Add to ${esc(l.title)}" maxlength="200"><button class="btn">＋</button></form></div>`;
    }).join('')}</div>`;
    $('view').querySelectorAll('.pack input[type=checkbox]').forEach((c) => c.onchange = async () => { await sb.from('trip_items').update({ done: c.checked, updated_at: new Date().toISOString() }).eq('id', c.dataset.id); load(); });
    $('view').querySelectorAll('[data-del]').forEach((b) => b.onclick = async (e) => { e.preventDefault(); await sb.from('trip_items').delete().eq('id', b.dataset.del); load(); });
    $('view').querySelectorAll('.pack form').forEach((f) => f.onsubmit = async (e) => {
      e.preventDefault(); const t = f.querySelector('input').value.trim(); if (!t) return;
      await sb.from('trip_items').insert({ trip: trip.id, kind: 'pack', title: t, who: f.dataset.who || null, created_by: ME.id });
      load();
    });
  }

  // ---- talk: comments and polls, in an item's discussion or the trip's own chat (item null) ----
  const drafts = {};      // half-typed messages, per talk, kept across live refreshes
  // Into the family chat: a trip item or poll, as a card (the server reads its title and picture itself).
  const FAMILY_CHAT = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/family-chat';
  async function shareToChat(ref) {
    const { data: { session: s } } = await sb.auth.getSession();
    const r = await fetch(FAMILY_CHAT, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ ref }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  }
  let builder = null;     // the poll being made: { key, q, opts }
  const tkey = (item) => item || 'trip';
  const streamOf = (item) => [...comments.filter((c) => (c.item || null) === (item || null)).map((c) => ({ ...c, t: 'c' })),
    ...polls.filter((q) => (q.item || null) === (item || null)).map((q) => ({ ...q, t: 'p' }))].sort((x, y) => x.created_at.localeCompare(y.created_at));
  const initial = (id) => (nameOf(id) || '?')[0].toUpperCase();
  function pollHTML(q) {
    const vs = pollVotes.filter((v) => v.poll === q.id), mine = vs.find((v) => v.voter === ME.id)?.choice;
    const top = Math.max(0, ...q.options.map((_, k) => vs.filter((v) => v.choice === k).length));
    return `<div class="poll"><p class="pq"><small>📊 Poll${q.closed ? ' · closed' : ''}</small>${esc(q.question)}</p>
      ${q.options.map((o, k) => {
        const who = vs.filter((v) => v.choice === k), pct = vs.length ? Math.round((who.length / vs.length) * 100) : 0;
        return `<button class="po${mine === k ? ' mine' : ''}" data-vote="${q.id}:${k}" ${q.closed ? 'disabled' : ''} aria-pressed="${mine === k}">
          <i style="width:${pct}%"></i><span class="pl">${mine === k ? '✓ ' : ''}${q.closed && who.length && who.length === top ? '🏆 ' : ''}${esc(o)}</span>
          <span class="pn">${who.length ? `${who.length} · ${who.map((v) => initial(v.voter)).join(' ')}` : '0'}</span></button>`;
      }).join('')}
      <div class="pf"><span>${vs.length} of ${family.length || '?'} voted${q.closed ? '' : ' · tap to vote, tap again to take it back'}</span>
