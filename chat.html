<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>r4box chat</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The family chat, around the family world (design system: chat kit). world/world.css is the
       shared look (header, sub-pages, settings rows, view picker); chat.css is the kit's chat. -->
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
  </style>
  <link rel="stylesheet" href="world/world.css?v=9">
  <link rel="stylesheet" href="chat.css?v=3">
  <style>
    :root { --teal-ink: #062A26; --hot-soft: #4A2230; --panel-2: #141130; }
    [hidden] { display: none !important; }
    #app { max-width: 760px; margin: 0 auto; }
    .rcard img { flex: none; width: 48px; height: 48px; border-radius: 9px; object-fit: cover; background: #141130; }
    .rcard ul { margin: 3px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
    .rstory { cursor: default; } a.rstory { cursor: pointer; }
    .preview { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .preview img { height: 52px; border-radius: 10px; border: 1px solid var(--line); }
    .preview button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
    .phimg { cursor: zoom-in; }
    #viewer { position: fixed; inset: 0; z-index: 45; background: #000e; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    #viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    .ibtn:disabled { opacity: .5; cursor: default; }
    #callbtn.incall { color: var(--teal); border-color: #3DD6C655; }
    .alertsrow small a { color: var(--teal); }
    /* the call (kept from before: a tile per person with their video, you in the corner) */
    #call .tile { display: block; background: #08061A; }
    #call .tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #08061A; }
    #call .tile .nm small { font-weight: 600; color: var(--teal); }
    #call .tile .off { position: absolute; inset: 0; display: grid; place-items: center; background: #08061A; }
    #call .tile .off b { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; font: 800 34px/1 var(--display); color: var(--violet); box-shadow: 0 0 0 1px #B9A6FF55, 0 0 0 10px #B9A6FF12, 0 0 0 22px #B9A6FF0a; overflow: hidden; }
    #call .tile .off b img { width: 100%; height: 100%; object-fit: cover; }
    #call .tile .flag { position: absolute; top: 10px; right: 10px; font-size: 13px; padding: 3px 8px; border-radius: 99px; background: #000000b3; }
    #self { position: absolute; z-index: 2; right: 14px; bottom: 14px; width: 104px; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; border: 1.5px solid #ffffff33; box-shadow: 0 8px 22px #0009; background: #08061A; }
    #self video { width: 100%; height: 100%; object-fit: cover; }
    #self.mirror video { transform: scaleX(-1); }
    #self.camoff video { visibility: hidden; }
    .waiting { display: grid; place-items: center; text-align: center; color: var(--muted); align-content: center; gap: 18px; }
    .waiting svg { width: 150px; height: 150px; animation: turn 24s linear infinite; }
    .waiting b { display: block; font: 800 20px/1.2 var(--display); color: var(--ink); margin-bottom: 4px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .waiting svg { animation: none; } }
    .picks .av { width: 34px; height: 34px; } .picks .av img { width: 30px; height: 30px; }
    /* Pickups (124): minutes away, never a map */
    .rpick { margin: 3px 0 2px; padding: 10px; border-radius: 14px; background: #0006; border: 1px solid #ffffff1c; min-width: min(250px, 66vw); }
    .rpick.live { border-color: #3DD6C666; background: #3DD6C612; }
    .rpick.asked { border-color: #F5C54266; }
    .rpick .pt { display: flex; gap: 11px; align-items: center; }
    .rpick .ring { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--teal) calc(var(--p, 0) * 1turn), #ffffff1a 0); }
    .rpick .ring span { width: 48px; height: 48px; border-radius: 50%; background: #0D0B1F; display: grid; place-items: center; text-align: center; line-height: 1; }
    .rpick .ring b { font: 800 19px/1 var(--display); color: var(--ink); } .rpick .ring small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .rpick .ring.em span { font-size: 24px; }
    .rpick .tt { min-width: 0; } .rpick .tt b { display: block; font-size: 14.5px; line-height: 1.3; } .rpick .tt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .rpick .tt small.warn { color: var(--gold); }
    .rpick .kn { margin-top: 8px; font-size: 13px; padding: 5px 9px; border-radius: 10px; background: #ffffff10; }
    .rpick .pa { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .rpick .pa button, .rpick .pa a { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 99px; border: 1px solid #ffffff2a; }
    .rpick .pa .go { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
    .rpick .pa .on { background: #ffffff22; }
    #pkbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin: 0 10px 6px; border-radius: 12px; background: #3DD6C61f; border: 1px solid #3DD6C666; font-size: 13px; }
    #pkbar span { flex: 1; min-width: 0; } #pkbar small { display: block; color: var(--muted); font-size: 11.5px; }
    #pkbar button { all: unset; cursor: pointer; font-weight: 800; font-size: 12.5px; padding: 6px 11px; border-radius: 99px; border: 1px solid #ffffff2a; }
    #pkbar .go { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
    #pkdlg { width: min(420px, calc(100vw - 32px)); }
    #pkdlg h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    #pkdlg .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    #pkdlg .chips button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 14px; }
    #pkdlg .chips button.on { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; }
    #pkdlg .chips .x { padding: 7px 9px; color: var(--hot); }
    #pkdlg input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0D0B1F; color: inherit; font: inherit; font-size: 16px; }
    #pkdlg .newp { margin-top: 8px; padding: 10px; border-radius: 12px; background: #ffffff0a; }
    #pkdlg .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
    #pkdlg .err { color: var(--hot); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
<div id="app">
<header><a class="back" href="/" aria-label="Home">‹</a><a class="mark" href="/"><i aria-hidden="true"></i>r4box</a><span class="sep">/</span><h1>Family</h1><span class="grow"></span><button class="hbtn" id="srch" aria-label="Search the chat and everything attached">⌕</button><button class="hbtn" id="pinsbtn" aria-label="Pinned: trip and polls" aria-expanded="false">📌<i class="badge" id="pinsn" hidden></i></button><button class="hbtn" id="callbtn" aria-label="Start a video call">📹</button><button class="gear" id="gear" aria-label="Settings">⚙</button></header>
<div id="pkbar" hidden></div>
<div class="pins" id="pins"></div>
<div class="devs" id="devs"></div>
<button class="filt" id="gfilt" hidden></button>
<main id="log" aria-live="polite"><div id="msgs"><p class="empty">Loading…</p></div></main>
<div class="comp">
<div class="quick" id="quick"><button type="button">👍</button><button type="button">❤️</button><button type="button">😂</button><button type="button">🎉</button></div>
<div class="preview" id="preview" hidden><img id="previewimg" alt="Photo to send"><button id="unphoto" type="button">Remove</button></div>
<div class="row1"><button class="chipc" id="atclaude" type="button">✦ @claude</button><span class="left" id="left">Write @claude to ask Claude</span></div>
<form id="send"><button class="ibtn" type="button" id="photo" aria-label="Add a photo">📷</button><button class="ibtn" type="button" id="tripbtn" aria-label="Talk about a trip">✈️</button><button class="ibtn" type="button" id="pkbtn" aria-label="Pickup: on my way, or ask for a ride">🚗</button><input type="file" id="file" accept="image/*" hidden><textarea id="text" rows="1" placeholder="Message the family…" maxlength="4000" aria-label="Message"></textarea><button class="ibtn send" id="go" aria-label="Send">↑</button></form>
</div>
<dialog class="cdlg" id="pick"><b>📹 Call who?</b><div class="picks" id="picks"></div><div class="row"><button id="pickno">Cancel</button></div></dialog>
<dialog class="cdlg" id="ring"><b id="ringwho">📹 Video call</b><div style="color:var(--muted);font-size:13px;margin-top:6px" id="ringnote">The family is on a call.</div><div class="row"><button id="ringno">Not now</button><button id="ringyes" style="background:var(--teal);color:var(--teal-ink);border-color:var(--teal)">Join</button></div></dialog>
<dialog class="cdlg" id="tripdlg"><b>✈️ Talk about a trip</b><div style="color:var(--muted);font-size:13px;margin-top:6px">The chat turns into that trip’s conversation. @claude knows its plan there.</div><div class="picks" id="trippicks"></div><div class="row"><button id="tripno">Cancel</button></div></dialog>
<dialog class="cdlg" id="pkdlg" aria-label="Pickup"></dialog>
<dialog class="cdlg" id="del"><b>Delete this message?</b><div style="color:var(--muted);font-size:13px;margin-top:6px">It goes for everyone, with its replies.</div><div class="row"><button id="delno">Cancel</button><button class="bad" id="delyes">Delete</button></div></dialog>
<div id="viewer" hidden><img id="viewimg" alt=""></div>
</div>
<script type="module">
  import { sb, FAMILY, roleOf, gateApp } from './auth.js?v=114';
  const $ = (id) => document.getElementById(id);
  // The real height of the screen we have (see chat.css #app): measured now, again as the app
  // settles, and whenever it can change (keyboard, rotation, coming back to the app).
  const fitH = () => document.documentElement.style.setProperty('--app-h', Math.round(innerHeight) + 'px');
  fitH(); [100, 400, 1200].forEach((ms) => setTimeout(fitH, ms));
  addEventListener('resize', fitH); window.visualViewport?.addEventListener('resize', fitH); addEventListener('pageshow', fitH);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { fitH(); setTimeout(fitH, 300); } });
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const FN = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/family-chat';
  const VAPID = 'BAOMU69cDpXXI0RZl3fTA4hkgIZgztF6BXOoWHXo4A48LT7nubbHVOqq6UfkOzLm28ViX16ZQI6osf_FhVGCjwQ';
  const REACT = ['❤️', '😂', '👍', '😮', '🔥', '🎉'];

  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  await gateApp(session?.user, 'chat');
  const ME = { id: session?.user.id, role: roleOf(session?.user) };

  // msgs: every loaded message, replies too (reply_to set), oldest first.
  let family = [], msgs = [], thinking = 0, filter = null, sub = null, left = null;
  const reacts = new Map();   // message id -> { emoji: [user ids] }
  const urls = new Map();     // image path -> signed URL
  const member = (id) => family.find((f) => f.id === id);
  const avatar = (name) => FAMILY.find((f) => f.name === name)?.avatar;
  const at = (m) => Date.parse(m.created_at);
  const who = (m) => (m.is_claude ? 'Claude' : member(m.author)?.username || 'someone');
  const nameIn = (id) => member(id)?.username || 'someone';
  const tops = () => msgs.filter((m) => !m.reply_to);
  const replies = (id) => msgs.filter((m) => m.reply_to === id);
  const canDel = (m) => !m.is_claude && (m.author === ME.id || ME.role === 'parent');

  function toast(t) { const el = document.createElement('div'); el.className = 'ctoast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 3200); }

  // ---- view (the shared density: r4.density.<id>, set in ⚙ Settings on the home page) ----
  const DENSITY = [
    { id: 'play', name: 'Play', em: '🧸', blurb: 'Big text and a quick emoji row' },
    { id: 'explore', name: 'Explore', em: '🧭', blurb: 'Roomy, the main things' },
    { id: 'pilot', name: 'Pilot', em: '✈️', blurb: 'Tight: more of the chat on screen' },
    ...(ME.role === 'parent' ? [{ id: 'dev', name: 'Developer', em: '⌘', blurb: 'Pilot, plus per-message details and counts' }] : []),
  ];
  const dens = () => { try { const v = localStorage.getItem('r4.density.' + ME.id); if (DENSITY.some((d) => d.id === v)) return v; } catch {} return ME.role === 'parent' ? 'pilot' : 'explore'; };
  function applyDensity() { const d = dens(); document.body.classList.remove('dens-play', 'dens-explore', 'dens-pilot', 'dens-dev'); document.body.classList.add('dens-' + d); if (d === 'dev') document.body.classList.add('dens-pilot'); }

  // ---- reading ----
  async function sign(paths) {
    const need = [...new Set(paths)].filter((p) => p && !urls.has(p));
    if (!need.length) return;
    const { data } = await sb.storage.from('family-chat').createSignedUrls(need, 3600);
    for (const d of data || []) if (d.signedUrl) urls.set(d.path, d.signedUrl);
  }
  async function load() {
    const [{ data: f }, { data: m }] = await Promise.all([
      family.length ? { data: family } : sb.rpc('r4_family'),
      sb.from('chat_messages').select('*').order('id', { ascending: false }).limit(400),
    ]);
    family = f || []; msgs = (m || []).reverse();
    await Promise.all([sign(msgs.map((x) => x.image)), loadPolls(), loadReacts(), loadTrip(), loadPickups()]);
    render(true); seen(true);
  }
  async function loadReacts() {
    const ids = msgs.map((x) => x.id); reacts.clear();
    if (!ids.length) return;
    const { data } = await sb.from('chat_reactions').select('message, user_id, emoji').gte('message', ids[0]);
    for (const r of data || []) addReact(r);
  }
  function addReact(r) { const o = reacts.get(r.message) || {}; (o[r.emoji] = o[r.emoji] || []).includes(r.user_id) || o[r.emoji].push(r.user_id); reacts.set(r.message, o); }
  function dropReact(r) { const o = reacts.get(r.message); if (o && o[r.emoji]) o[r.emoji] = o[r.emoji].filter((u) => u !== r.user_id); }

  // Trip polls: the ones shared into the chat (voted on right here) and every open one (pinned).
  let polls = [], votes = [];
  async function loadPolls() {
    const ids = [...new Set(msgs.filter((x) => x.ref?.type === 'poll').map((x) => x.ref.id))];
    const { data: p } = await sb.from('trip_polls').select('*, trips(name)').or(`closed.eq.false${ids.length ? `,id.in.(${ids.join(',')})` : ''}`);
    polls = p || [];
    const { data: v } = polls.length ? await sb.from('trip_poll_votes').select('poll, voter, choice').in('poll', polls.map((x) => x.id)) : { data: [] };
    votes = v || [];
  }
  // The pinned trip: the next one that isn't over (its last day not yet passed here, and not ended early, 122).
  let trip = null;
  const localDay = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const tripOver = (t) => !!t.ended_at || (!!t.ends && t.ends < localDay());
  async function loadTrip() {
    const { data } = await sb.from('trips').select('*').or(`ends.gte.${localDay()},ends.is.null`).order('starts', { ascending: true, nullsFirst: false });
    trip = (data || []).find((t) => !tripOver(t)) || null;
  }

  // A trip's dates, short: "Dec 3 – 7 · in 44 days"
  const tripWhen = (r) => { if (!r.starts) return r.place || ''; const f = (d) => new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
    const days = Math.round((new Date(r.starts + 'T12:00:00') - new Date()) / 864e5);
    return `${f(r.starts)}${r.ends && r.ends !== r.starts ? ' – ' + f(r.ends) : ''}${days > 0 ? ` · in ${days} day${days === 1 ? '' : 's'}` : r.ends && r.ends >= new Date().toISOString().slice(0, 10) ? ' · now' : ''}`; };
  // Throw a trip in: its card's thread is the chat about that trip (one card per trip; the newest is used).
  async function talkTrip(id) {
    let card = [...msgs].reverse().find((x) => !x.reply_to && x.ref?.type === 'trip' && x.ref.id === id);
    if (!card) {
      const { data: { session: s } } = await sb.auth.getSession();
      const r = await fetch(FN, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: { type: 'trip', id } }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(j.error || 'Could not open the trip.'); return; }
      await load(); card = msgs.find((x) => x.id === j.id);
    }
    if (card) openThread(card.id);
  }
  $('tripbtn').onclick = async () => {
    const { data } = await sb.from('trips').select('*').order('starts', { ascending: false, nullsFirst: false });
    const list = (data || []).sort((a, b) => (tripOver(a) - tripOver(b)) || String(a.starts || '').localeCompare(String(b.starts || '')));   // the ones still to come first
    $('trippicks').innerHTML = list.length ? list.map((t) => `<button data-trip="${esc(t.id)}">✈️ ${esc(t.name)}<small style="display:block;color:var(--muted);font-weight:400">${esc(tripWhen(t))}${tripOver(t) ? ' · over' : ''}</small></button>`).join('') : '<p style="color:var(--muted)">No trips yet. Start one on the trip page.</p>';
    $('trippicks').querySelectorAll('[data-trip]').forEach((b) => (b.onclick = () => { $('tripdlg').close(); talkTrip(b.dataset.trip); }));
    $('tripdlg').showModal();
  };
  $('tripno').onclick = () => $('tripdlg').close();

  // ---- pickups (124): "On my way", minutes away and never a map ----
  // A parent sets off to pick up a kid: while this chat is open on their phone, it sends where they are to the
  // pickup function every 30 s, which keeps only the minutes; the kid's card counts down from those. The screen
  // stays on while it's going (the page can't update from the background). A kid can ask for a pickup first.
  const PK = FN.replace(/family-chat$/, 'pickup');
  const pickups = new Map(), PK_NOTES = ['👍 Ready', '⏳ 5 more min', '🚪 Side door', '🏫 Front'];
  let places = [];
  async function loadPickups() {
    const ids = [...new Set(msgs.filter((x) => x.ref?.type === 'pickup').map((x) => x.ref.id))];
    const [{ data: p }, { data: pl }] = await Promise.all([
      ids.length ? sb.from('pickups').select('*').in('id', ids) : { data: [] },
      sb.from('family_places').select('*').order('created_at')]);
    for (const x of p || []) pickups.set(x.id, x);
    places = pl || [];
    syncDrive();
  }
  function setPickup(p) { pickups.set(p.id, p); syncDrive(); }
  async function pk(payload) {
    const { data: { session: s } } = await sb.auth.getSession();
    const r = await fetch(PK, { method: 'POST', headers: { Authorization: `Bearer ${s?.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "That didn't work. Try again.");
    if (j.pickup) setPickup(j.pickup);
    return j;
  }
  const over = (p) => p.status === 'ended' || Date.now() - Date.parse(p.started_at) > 3600e3;
  const minsLeft = (p) => Math.max(0, Math.ceil((Date.parse(p.eta_at) - Date.now()) / 60000));
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function pickupHTML(id) {
    const p = pickups.get(id);
    if (!p) return '<div class="rpick"><div class="pt"><span class="ring em"><span>🚗</span></span><span class="tt"><b>Pickup</b></span></div></div>';
    const drv = p.driver === ME.id, kid = p.kid === ME.id, d = nameIn(p.driver), k = nameIn(p.kid);
    const note = p.kid_note ? `<div class="kn">${kid ? 'You' : esc(k)}: ${esc(p.kid_note)}</div>` : '';
    const notes = kid ? `<div class="pa">${PK_NOTES.map((n) => `<button data-pk="note" data-id="${p.id}" data-t="${esc(n)}" class="${p.kid_note === n ? 'on' : ''}">${esc(n)}</button>`).join('')}<button data-pk="note" data-id="${p.id}" data-t="">✏️</button></div>` : '';
    if (over(p)) return `<div class="rpick"><div class="pt"><span class="ring em"><span>✓</span></span><span class="tt"><b>${esc(d)} picked up ${esc(k)}</b><small>${esc(p.place_name)}${p.ended_at ? ' · ' + clock(p.ended_at) : ''}</small></span></div></div>`;
    if (p.status === 'asked') return `<div class="rpick asked"><div class="pt"><span class="ring em"><span>🙋</span></span><span class="tt"><b>${kid ? `You asked ${esc(d)} for a pickup` : `${esc(k)} asks ${drv ? 'you' : esc(d)} for a pickup`}</b><small>${esc(p.place_name)} · ${esc(p.ask_when || 'now')}</small></span></div>
      <div class="pa">${ME.role === 'parent' ? `<button class="go" data-pk="go" data-id="${p.id}">🚗 On my way</button>` : ''}${kid || ME.role === 'parent' ? `<button data-pk="stop" data-id="${p.id}">${kid ? 'Never mind' : 'Can’t'}</button>` : ''}</div></div>`;

      const list = k === 'all' ? hitsOf(s ? msgs : att) : hitsOf(att.filter((m) => kindOf(m) === k));
      $('sres').innerHTML = list.length ? list.slice(0, 60).map((m) => isMedia(m) && !words(m)
        ? (() => { const [b, sm] = label(m); return `<button class="mini wide" data-go="${m.id}"><span class="th">${thumb(m)}</span><span class="ml"><b>${s ? rich(b, s) : esc(b)}</b><small>${esc(sm)} · ${esc(dayLabel(at(m)))}</small></span><span class="ex">›</span></button>`; })()
        : `<button data-go="${m.id}"><small>${esc(who(m))} · ${esc(dayLabel(at(m)))} ${time(at(m))}${m.reply_to ? ' · in a thread' : ''}</small><span>${rich(textOf(m).slice(0, 180), s)}</span></button>`).join('')
        : `<p class="hintq">${s ? 'Nothing matches “' + esc(q.value) + '”.' : 'Nothing attached here yet.'}</p>`;
      $('stabs').querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { k = b.dataset.k; paint(); }));
      $('sres').querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { const id = +b.dataset.go; o.remove(); if (isMedia(msgs.find((x) => x.id === id) || {})) opened.add(id); jump(id); }));
    };
    q.oninput = paint; paint();
  }
  function jump(id) {
    const m = msgs.find((x) => x.id === id); if (!m) return;
    if (m.reply_to) return openThread(m.reply_to);
    filter = null; render(false);
    const el = document.querySelector(`#msgs [data-id="${id}"]`); if (!el) return;
    const log = $('log'); log.scrollTop += el.getBoundingClientRect().top - log.getBoundingClientRect().top - log.clientHeight / 2 + el.offsetHeight / 2;
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500);
  }

  // ---- taps in the log and the thread ----
  async function vote(v) {
    const [pid, n] = v.dataset.vote.split(':').map(Number), mine = votes.find((x) => x.poll === pid && x.voter === ME.id);
    const { error } = mine && mine.choice === n ? await sb.from('trip_poll_votes').delete().eq('poll', pid).eq('voter', ME.id)
      : await sb.from('trip_poll_votes').upsert({ poll: pid, voter: ME.id, choice: n });
    if (error) toast('Could not vote: ' + error.message); else { await loadPolls(); render(false); }
  }
  function tap(e) {
    const t = e.target;
    const v = t.closest('[data-vote]'); if (v) { e.stopPropagation(); vote(v); return; }
    if (t.closest('[data-join]')) { e.stopPropagation(); joinCall(); return; }
    const rx = t.closest('[data-react]'); if (rx) { e.stopPropagation(); const [id, em] = rx.dataset.react.split(':'); react(+id, em); return; }
    const th = t.closest('[data-thread]'); if (th) { e.stopPropagation(); openThread(+th.dataset.thread); return; }
    const mo = t.closest('[data-more]'); if (mo) { e.stopPropagation(); fullC.add(+mo.dataset.more); render(false); return; }
    const o = t.closest('[data-open]'); if (o) { e.stopPropagation(); const id = +o.dataset.open; opened.has(id) ? opened.delete(id) : opened.add(id); render(false); return; }
    const sh = t.closest('[data-shrink]'); if (sh) { e.stopPropagation(); const id = +sh.dataset.shrink; opened.delete(id); bigNow.delete(id); markSeen(id); bigNow.delete(id); render(false); return; }
    const ph = t.closest('img.phimg'); if (ph) { e.stopPropagation(); $('viewimg').src = ph.src; $('viewer').hidden = false; return; }
    const pk = t.closest('[data-pk]'); if (pk) { e.stopPropagation(); pickupAct(pk); return; }
    if (t.closest('a, .rpoll, .rcall, .rpick')) return;
    const av = t.closest('.av'); if (av && !t.closest('.thread')) { e.stopPropagation(); const m = msgs.find((x) => x.id === +av.closest('.msg').dataset.id); if (m && !m.is_claude) { filter = filter === m.author ? null : m.author; render(true); } return; }
    const b = t.closest('[data-b]'); if (b) { e.stopPropagation(); openActs(+b.dataset.b, b); }
  }
  $('msgs').addEventListener('click', tap);
  $('app').addEventListener('click', (e) => { if (e.target.closest('.thread .tlog')) tap(e); });
  $('viewer').onclick = () => { $('viewer').hidden = true; };
  $('gfilt').onclick = () => { filter = null; render(true); };

  // ---- pinned: the trip and its open polls, behind 📌 ----
  const pinsOpen = (on) => { $('pins').classList.toggle('open', on); $('pinsbtn').setAttribute('aria-expanded', on); $('pinsbtn').classList.toggle('on', on); };
  $('pinsbtn').onclick = (e) => { e.stopPropagation(); const on = !$('pins').classList.contains('open'); pinsOpen(on); if (on) setTimeout(() => document.addEventListener('click', function off(ev) { if (!ev.target.closest('#pins')) { pinsOpen(false); document.removeEventListener('click', off); } }), 0); };
  $('pins').addEventListener('click', (e) => { const p = e.target.closest('[data-pin]'); if (!p) return; pinsOpen(false);
    if (p.dataset.pin === 'trip') { talkTrip(trip.id); return; }   // the pinned trip opens its conversation here
    const m = [...msgs].reverse().find((x) => x.ref?.type === 'poll' && x.ref.id === +p.dataset.pin);
    if (m) jump(m.id); else { const q = pollOf(+p.dataset.pin); location.href = `/trip.html?t=${encodeURIComponent(q.trip)}${q.item ? '&i=' + encodeURIComponent(q.item) : ''}`; } });
  $('srch').onclick = () => openSearch();

  // ---- settings: the view, and alerts ----
  function openSettings() {
    closeSub(true);
    const pg = document.createElement('section'); pg.className = 'subpage settingsp';
    pg.innerHTML = '<header><button class="sb" aria-label="Back">‹</button><span><b>Settings</b><small>View · alerts</small></span></header><div class="subb" id="sbody"></div>';
    $('app').append(pg); sub = { pg }; history.pushState({ sub: 1 }, '');
    pg.querySelector('.sb').onclick = () => history.back();
    paintSettings();
  }
  async function paintSettings() {
    const el = $('sbody'); if (!el) return;
    const d = dens(), al = await alertsState();
    const cur = DENSITY.find((x) => x.id === d);
    el.innerHTML = `<h3 class="k">View</h3><section class="sset"><a class="srow" href="/#settings" style="color:inherit;text-decoration:none"><div><b>${cur.em} ${cur.name}</b><small>One view for every app: change it in ⚙ Settings on the home page</small></div><span aria-hidden="true">›</span></a></section>
      <h3 class="k">Chat</h3><section class="sset"><div class="srow"><div><b>🔊 Sounds</b><small>A chime for new messages and a ring for calls while the chat is open, on this device</small></div><button class="tog${soundOn() ? ' on' : ''}" id="sndTog" role="switch" aria-checked="${soundOn()}" aria-label="Sounds"><i></i></button></div><div class="srow alertsrow"><div><b>Alerts</b><small>${al.why}</small></div>${al.can ? `<button class="tog${al.on ? ' on' : ''}" id="alTog" role="switch" aria-checked="${al.on}"${al.on ? ' disabled' : ''}><i></i></button>` : ''}</div></section>`;
    $('alTog')?.addEventListener('click', async () => { await turnOnAlerts(); paintSettings(); });
    $('sndTog').addEventListener('click', () => {
      const on = !soundOn(); try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch {}
      $('sndTog').classList.toggle('on', on); $('sndTog').setAttribute('aria-checked', String(on)); if (on) { wake(); setTimeout(() => play('chime'), 50); }
    });
    // With alerts on: what this device hears about (117), the same switches as the games' ⚙️ Settings.
    const topics = al.on ? await alertTopics() : null;
    if (!topics) return;
    el.querySelector('.alertsrow').insertAdjacentHTML('afterend', TOPICS.map(([k, label, hint]) =>
      `<div class="srow"><div><b>${label}</b><small>${hint}</small></div><button class="tog${topics.includes(k) ? ' on' : ''}" data-topic="${k}" role="switch" aria-checked="${topics.includes(k)}" aria-label="${label} alerts"><i></i></button></div>`).join(''));
    el.querySelectorAll('[data-topic]').forEach((t) => t.addEventListener('click', async () => {
      const on = t.getAttribute('aria-checked') !== 'true';
      t.disabled = true;
      try { await setAlertTopic(t.dataset.topic, on); t.classList.toggle('on', on); t.setAttribute('aria-checked', String(on)); }
      catch (err) { toast("Couldn't change alerts: " + (err.message || err)); }
      t.disabled = false;
    }));
  }
  const TOPICS = [['chat', '💬 Messages', 'New messages (a burst is one alert) and Claude’s answers to you'],
    ['calls', '📹 Calls', 'Someone starts a video call'],
    ['games', '🎮 Games', 'Your turn, game over, the next Chaos round']];
  async function mySub() { const reg = await navigator.serviceWorker.getRegistration('/'); return reg?.pushManager.getSubscription(); }
  async function alertTopics() {
    const s = await mySub(); if (!s) return null;
    const { data } = await sb.from('push_subscriptions').select('topics').eq('endpoint', s.endpoint).maybeSingle();
    return data?.topics ?? ['games', 'chat', 'calls'];
  }
  async function setAlertTopic(topic, on) {
    const s = await mySub(), now = (await alertTopics()) ?? [];
    const topics = on ? [...new Set([...now, topic])] : now.filter((t) => t !== topic);
    const { error } = await sb.from('push_subscriptions').update({ topics }).eq('endpoint', s.endpoint);
    if (error) throw error;
  }
  $('gear').onclick = openSettings;

  // ---- video calls ----
  // The call itself lives in call.html: it holds the connections and shows r4box under it, so
  // moving between pages never drops it. Here the chat only watches who is on the call (the
  // private Realtime channel 'family-call', 105: the 📹 Join button, a live call card, a ring)
  // and hands starting or joining to it.
  const MAX = 4;   // people in one call (call.html says the same)
  const PEER = crypto.randomUUID();   // this page on the channel (it never joins the call itself)
  // In a call, this page sits inside call.html, which answers here.
  const shell = () => { try { return window.top !== window && window.top.R4Call ? window.top.R4Call : null; } catch { return null; } };
  const inCallNow = () => !!shell()?.inCall();
  let liveKey = '';
  const callCh = sb.channel('family-call', { config: { private: true, presence: { key: PEER } } });
  const room = () => Object.entries(callCh.presenceState()).map(([peer, v]) => ({ peer, user: v[0]?.user })).filter((x) => x.user);
  const callLive = () => room();
  const lastCallId = () => [...msgs].reverse().find((x) => x.ref?.type === 'call')?.id;
  callCh.on('presence', { event: 'sync' }, syncCall).subscribe(onCallState);
  function onCallState(st) {
    // The button stays: a phone waking up often drops the socket for a moment (CHANNEL_ERROR,
    // TIMED_OUT), and the channel rejoins by itself; hiding it here left it gone until a reload.
    if (st === 'SUBSCRIBED') $('callbtn').hidden = false;
  }
  // Back on the page: nudge a channel that lost its socket while the phone slept.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || callCh.state === 'joined' || callCh.state === 'joining') return;
    sb.auth.getSession().then(({ data: { session: s } }) => { if (s) sb.realtime.setAuth(s.access_token); callCh.subscribe(onCallState); }).catch(() => {});
  });
  function syncCall() {
    const others = callLive(), me = inCallNow();
    const key = others.map((x) => x.peer).sort().join() + me;
    if (key !== liveKey) { liveKey = key; render(false); }
    const b = $('callbtn');
    b.classList.toggle('live', !!others.length && !me); b.classList.toggle('incall', me);
    b.textContent = me ? '📹 On call' : others.length ? `📹 Join · ${new Set(others.map((x) => x.user)).size}` : '📹';
    b.setAttribute('aria-label', me ? 'Show the call' : others.length ? 'Join the video call' : 'Start a video call');
    if ((!others.length || me) && $('ring').open) $('ring').close();
  }
  setInterval(syncCall, 4000);   // picks up joining or leaving in call.html

  const face = (id) => { const n = nameIn(id), a = avatar(n); return a ? `<img src="${a}" alt="">` : esc(n[0].toUpperCase()); };
  // Starting a call: pick who to ring. Joining one that's on: straight in.
  function startOrJoin() {
    if (inCallNow()) { shell().show(); return; }
    if (callLive().length) { joinCall(); return; }
    const others = family.filter((f) => f.id !== ME.id);
    const row = (id, label, inner) => `<button data-to="${id}"><span class="av">${inner}</span>${esc(label)}</button>`;
    $('picks').innerHTML = others.map((f) => row(f.id, f.username, face(f.id))).join('') + (others.length > 1 ? row('', 'Everyone', '👥') : '');
    $('pick').showModal();
  }
  $('picks').onclick = (e) => { const b = e.target.closest('[data-to]'); if (b) { $('pick').close(); joinCall(b.dataset.to || null); } };
  $('pickno').onclick = () => $('pick').close();
  // Into the call: call.html takes the window and keeps this page under it.
  function joinCall(to) {
    if ($('ring').open) $('ring').close();
    const sh = shell(); if (sh) { sh.join(to || null); return; }
    if (new Set(callLive().map((x) => x.peer)).size >= MAX) { toast(`The call is full: ${MAX} people at most for now.`, true); return; }
    window.top.location.assign(`/call.html?join=${encodeURIComponent(typeof to === 'string' ? to : '')}&page=${encodeURIComponent(location.pathname + location.search)}`);
  }
  function ring(from) {
    if (inCallNow() || !callLive().length) return;
    $('ringwho').textContent = `📹 ${from ? nameIn(from) + ' is calling' : 'Video call'}`;
    $('ringnote').textContent = `${callLive().map((x) => nameIn(x.user)).filter((v, k, a) => a.indexOf(v) === k).join(', ')} on the call now.`;
    if (!$('ring').open) $('ring').showModal();
    ringtone(true);
  }
  // The ring sounds (and buzzes, on Android) until Join, Not now, or the call ends; 40 s at most.
  let ringT = 0, ringUntil = 0;
  function ringtone(on) {
    clearInterval(ringT); ringT = 0;
    if (!on) return;
    ringUntil = Date.now() + 40_000;
    const once = () => { if (!$('ring').open || Date.now() > ringUntil) { ringtone(false); return; } play('ring'); navigator.vibrate?.([600, 300, 600]); };
    once(); ringT = setInterval(once, 2600);
  }
  $('ring').addEventListener('close', () => { ringtone(false); navigator.vibrate?.(0); });
  $('callbtn').onclick = () => { if (callCh.state !== 'joined' && !inCallNow()) { toast('Reconnecting the call line… try again in a moment.'); callCh.subscribe(onCallState); return; } startOrJoin(); };
  $('ringyes').onclick = () => joinCall();
  $('ringno').onclick = () => $('ring').close();
  // Opened from a call's ring (an older alert): offer to join once we know the call is still on. From a missed
  // call's alert (Call back): who to call, one tap away (or straight in, when they're calling again). An alert
  // tapped while the chat is open changes only the #, so this runs then too.
  function fromAlert() {
    const h = location.hash;
    if (h !== '#call' && !/^#callback=[0-9a-f-]{36}$/.test(h)) return;
    history.replaceState(null, '', location.pathname + location.search);
    if (h === '#call') for (const ms of [1500, 4000]) setTimeout(() => ring([...msgs].reverse().find((x) => x.ref?.type === 'call')?.author), ms);
    else setTimeout(() => { if (callCh.state === 'joined' && !$('pick').open) startOrJoin(); }, 1500);
  }
  fromAlert(); addEventListener('hashchange', fromAlert);

  // ---- alerts: a push for new messages when the chat isn't open ----
  const b64 = (s) => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  async function alertsState() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      // iPhone: push only reaches a web app added to the Home Screen.
      return { can: false, on: false, why: /iPhone|iPad/.test(navigator.userAgent) ? 'On iPhone: Share → Add to Home Screen, open r4box from there, then turn alerts on here.' : 'This browser can’t show alerts.' };
    }
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && Notification.permission === 'granted' ? await reg.pushManager.getSubscription() : null;
    if (Notification.permission === 'denied') return { can: false, on: false, why: 'Alerts are blocked for r4box in this browser’s settings.' };
    return { can: true, on: !!sub, why: sub ? 'On: a notification when someone writes and you’re not looking at the chat.' : 'A notification when someone writes and you’re not looking at the chat.' };
  }
  async function turnOnAlerts() {
    try {
      if (await Notification.requestPermission() !== 'granted') { toast('Alerts are blocked for r4box in this browser’s settings.'); return; }
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;
      const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
      const j = s.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
      if (error) throw error;
      toast('Alerts on: you’ll get a notification for new messages.');
    } catch (err) { toast("Couldn't turn on alerts: " + (err.message || err)); }
  }
  // Alerts off on this device: the gear says so once, with a dot.
  alertsState().then((a) => { if (a.can && !a.on) $('gear').insertAdjacentHTML('beforeend', '<i class="badge" style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:99px;background:var(--hot)"></i>'); }).catch(() => {});
  $('gear').style.position = 'relative';

  // From the home's ✦ Start Claude: the words wait in the composer as an @claude question.
  try { const d = sessionStorage.getItem('r4.claude.draft'); if (d) { sessionStorage.removeItem('r4.claude.draft'); text.value = '@claude ' + d; grow(text); setTimeout(() => text.focus(), 0); } } catch {}
  applyDensity();
  // ?thread=<id>: straight into that thread (a trip item's "Talk about it" lands here)
  const wantThread = +new URLSearchParams(location.search).get('thread') || 0;
  const wantTrip = new URLSearchParams(location.search).get('trip');
  if (session) { load().then(() => { if (wantTrip) { history.replaceState(null, '', '/chat.html'); talkTrip(wantTrip); } else if (wantThread && msgs.some((x) => x.id === wantThread && !x.reply_to)) { history.replaceState(null, '', '/chat.html'); openThread(wantThread); } }); if (matchMedia('(pointer: fine)').matches) text.focus({ preventScroll: true }); }
</script>
</body>
</html>
