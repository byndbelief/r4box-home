<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0B0918">
  <meta name="robots" content="noindex">
  <title>r4box chat</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); }
    @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url("fonts/sora-latin.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --bg: #0B0918; --panel: #171331; --panel-2: #1F1A3F; --line: #2F2957; --ink: #F3F1FF; --muted: #ACA5D6; --faint: #7A73A8;
      --teal: #3DD6C6; --teal-ink: #062A26; --gold: #F5C542; --gold-ink: #2A2100; --hot: #FF5A4A; --hot-soft: #4A2230; --violet: #B9A6FF;
      --display: "Unbounded", "Arial Black", Impact, sans-serif;
      --body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --grad-mark: conic-gradient(from 210deg, var(--teal), var(--violet), var(--gold), var(--hot), var(--teal));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100dvh;
      background: radial-gradient(900px 420px at 15% -10%, #2A1F5E55, transparent 60%), radial-gradient(700px 380px at 100% 0%, #0E4A4655, transparent 60%), var(--bg); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }
    button, input, textarea { font: inherit; color: inherit; }
    .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-inline: 16px; }
    header { flex: none; border-bottom: 1px solid var(--line); background: #0B0918d9; backdrop-filter: blur(8px); }
    header .wrap { display: flex; align-items: center; gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: 12px; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font: 800 18px/1 var(--display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
    .mark i { width: 1.05em; height: 1.05em; border-radius: 22%; background: var(--grad-mark); box-shadow: inset 0 0 0 .18em var(--bg), 0 0 18px #3DD6C666; }
    header h1 { font: 800 18px/1 var(--display); margin: 0; letter-spacing: -.02em; }
    header .sep { color: var(--faint); }
    header .grow { flex: 1; }
    .pill { appearance: none; cursor: pointer; border: 1px solid var(--line); background: #ffffff0a; border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .pill:hover { background: #ffffff16; }
    .pill.on { color: var(--teal); border-color: #3DD6C655; cursor: default; }

    #log { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    #log .wrap { display: flex; flex-direction: column; gap: 2px; padding-top: 14px; padding-bottom: 14px; }
    .day { align-self: center; margin: 14px 0 8px; font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; margin-top: 2px; }
    .msg.first { margin-top: 10px; }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 13px/1 var(--display); background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .av.claude { background: #F5C5421f; border-color: #F5C54266; color: var(--gold); font-size: 15px; }
    .msg:not(.last) .av { visibility: hidden; }
    .msg.me .av { display: none; }
    .bub { min-width: 0; padding: 8px 12px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; cursor: default; }
    .msg.me .bub { background: color-mix(in srgb, var(--teal) 16%, var(--panel)); border-color: #3DD6C640; }
    .msg.claude .bub { background: color-mix(in srgb, var(--gold) 8%, var(--panel)); border-color: #F5C54240; }
    .msg.mine .bub { cursor: pointer; }
    .bub .who { display: block; font-size: 12px; font-weight: 800; color: var(--violet); margin-bottom: 2px; }
    .msg.claude .who { color: var(--gold); }
    .bub .tx { white-space: pre-wrap; }
    .bub .tx a { color: var(--teal); }
    .bub .tx .at { color: var(--gold); font-weight: 700; }
    /* things from the trip planner, as cards in the chat */
    .rcard { display: flex; gap: 10px; align-items: center; margin: 4px 0 2px; padding: 8px; border-radius: 12px; background: #0B091866; border: 1px solid #ffffff1c; color: inherit; text-decoration: none; min-width: min(250px, 62vw); }
    .rcard img { flex: none; width: 56px; height: 56px; border-radius: 9px; object-fit: cover; background: #1F1A3F; }
    .rcard .ri { flex: none; width: 56px; height: 56px; border-radius: 9px; display: grid; place-items: center; background: #1F1A3F; font-size: 24px; }
    .rcard small { display: block; color: var(--teal); font-weight: 700; font-size: 11.5px; }
    .rcard b { display: block; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
    .rcard ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
    .rpoll { margin: 4px 0 2px; min-width: min(260px, 64vw); }
    .rpoll .q { font-weight: 800; margin-bottom: 4px; } .rpoll .q small { display: block; color: var(--teal); font-size: 11.5px; font-weight: 700; }
    .rpoll .po { position: relative; display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-top: 6px; padding: 9px 11px; border-radius: 11px; border: 1.5px solid #ffffff22; background: #0B091855; color: var(--ink); font: inherit; text-align: left; cursor: pointer; overflow: hidden; isolation: isolate; }
    .rpoll .po i { position: absolute; inset: 0 auto 0 0; z-index: -1; background: #B9A6FF33; transition: width .3s; }
    .rpoll .po.mine { border-color: var(--teal); } .rpoll .po.mine i { background: #3DD6C644; }
    .rpoll .po .pn { flex: none; color: var(--muted); font-size: 12.5px; font-weight: 700; }
    .rpoll .po:disabled { cursor: default; }
    .rpoll .pf { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--faint); }
    .rpoll .pf a { color: var(--teal); text-decoration: none; font-weight: 700; }
    .bub img.ph { display: block; max-width: min(280px, 100%); max-height: 340px; border-radius: 12px; margin: 2px 0 4px; cursor: zoom-in; background: var(--panel-2); }
    .bub .tm { display: block; text-align: right; font-size: 11px; color: var(--faint); margin-top: 2px; }
    .think { align-self: flex-start; color: var(--gold); font-size: 14px; margin: 10px 0 0 38px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .think { animation: none; } }
    .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px 0; }
    .empty b { display: block; font: 800 22px/1.2 var(--display); color: var(--ink); margin-bottom: 6px; }

    footer { flex: none; border-top: 1px solid var(--line); background: #0B0918e6; }
    footer .wrap { padding-top: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .tools { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .chip { appearance: none; cursor: pointer; border: 1px solid #F5C54255; background: #F5C54214; color: var(--gold); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 700; }
    .note { color: var(--muted); font-size: 12px; margin-left: auto; }
    .preview { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .preview img { height: 56px; border-radius: 10px; border: 1px solid var(--line); }
    form { display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; resize: none; max-height: 140px; min-height: 44px; padding: 11px 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--panel); font-size: 16px; line-height: 1.35; }
    .icon { appearance: none; cursor: pointer; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: #ffffff0a; font-size: 19px; display: grid; place-items: center; }
    .icon.send { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); font-weight: 800; }
    .icon:disabled { opacity: .5; cursor: default; }
    #toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 10px 24px #0008; font-size: 14px; }
    #toast.bad { border-color: #FF5A4A88; }
    dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--panel-2); color: var(--ink); padding: 18px; width: min(360px, calc(100% - 32px)); }
    dialog::backdrop { background: #0B0918cc; }
    dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .btn { appearance: none; cursor: pointer; border: 1.5px solid #ffffff22; background: #ffffff0e; border-radius: 12px; padding: 8px 14px; font-weight: 700; }
    .btn.bad { background: var(--hot-soft); border-color: transparent; }
    #viewer { position: fixed; inset: 0; z-index: 6; background: #000e; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    #viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    /* video calls */
    .pill.callb { padding: 7px 10px; }
    header .wrap { min-width: 0; } header h1 { min-width: 0; }
    @media (max-width: 460px) { #alerts .lbl { display: none; } }
    .pill.callb.live { color: var(--teal-ink); background: var(--teal); border-color: var(--teal); animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 0 6px #3DD6C633; } }
    .rcall { display: flex; gap: 10px; align-items: center; margin: 4px 0 2px; padding: 8px; border-radius: 12px; background: #0B091866; border: 1px solid #ffffff1c; min-width: min(250px, 62vw); }
    .rcall .ri { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #1F1A3F; font-size: 20px; }
    .rcall.live .ri { background: #3DD6C626; box-shadow: 0 0 0 1px #3DD6C688; }
    .rcall span:nth-child(2) { flex: 1; min-width: 0; }
    .rcall b { display: block; font-size: 14.5px; }
    .rcall small { display: block; color: var(--muted); font-size: 12px; }
    .rcall.live small { color: var(--teal); font-weight: 700; }
    .rcall button { flex: none; appearance: none; cursor: pointer; border: 0; border-radius: 99px; padding: 8px 14px; background: var(--teal); color: var(--teal-ink); font-weight: 800; }
    .picks { display: grid; gap: 8px; margin-top: 12px; }
    .picks button { appearance: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid #ffffff22; background: #ffffff0a; font-weight: 700; text-align: left; }
    .picks button:hover { border-color: var(--teal); }
    .picks .av { width: 34px; height: 34px; }
    #call { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; background: radial-gradient(700px 500px at 50% 30%, #1F1A3F, var(--bg) 70%); color: var(--ink); }
    #call .stage { position: relative; flex: 1; min-height: 0; display: grid; gap: 6px; padding: max(8px, env(safe-area-inset-top)) 8px 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); grid-auto-rows: minmax(0, 1fr); }
    .tile { position: relative; min-height: 0; border-radius: 18px; overflow: hidden; background: #120F27; border: 1px solid var(--line); }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #120F27; }
    .tile .nm { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 99px; background: #0B0918b3; font-size: 13px; font-weight: 700; }
    .tile .off { position: absolute; inset: 0; display: grid; place-items: center; background: #120F27; }
    .tile .off b { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; font: 800 34px/1 var(--display); color: var(--violet); box-shadow: 0 0 0 1px #B9A6FF55, 0 0 0 10px #B9A6FF12, 0 0 0 22px #B9A6FF0a; overflow: hidden; }
    .tile .off b img { width: 100%; height: 100%; object-fit: cover; }
    .tile .flag { position: absolute; top: 10px; right: 10px; font-size: 13px; padding: 3px 8px; border-radius: 99px; background: #0B0918b3; }
    #self { position: absolute; z-index: 2; right: 14px; bottom: 14px; width: 104px; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; border: 1.5px solid #ffffff33; box-shadow: 0 8px 22px #0009; background: #120F27; }
    #self video { width: 100%; height: 100%; object-fit: cover; }
    #self.mirror video { transform: scaleX(-1); }
    #self.camoff video { visibility: hidden; }
    .waiting { display: grid; place-items: center; text-align: center; color: var(--muted); align-content: center; gap: 18px; }
    .waiting svg { width: 150px; height: 150px; animation: turn 24s linear infinite; }
    .waiting b { display: block; font: 800 20px/1.2 var(--display); color: var(--ink); margin-bottom: 4px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .waiting svg, .pill.callb.live { animation: none; } }
    #call .bar { flex: none; display: flex; justify-content: center; gap: 14px; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); }
    #call .bar button { appearance: none; cursor: pointer; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid #ffffff2a; background: #ffffff12; font-size: 22px; display: grid; place-items: center; }
    #call .bar button[aria-pressed="true"] { background: #F3F1FF; color: #0B0918; }
    #call .bar .end { background: var(--hot); border-color: var(--hot); width: 68px; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="mark" href="/"><i aria-hidden="true"></i>r4box</a><span class="sep">/</span><h1>Family</h1>
    <span class="grow"></span>
    <button class="pill" id="alerts" hidden>🔔 Turn on alerts</button>
    <button class="pill callb" id="callbtn" aria-label="Start a video call">📹</button>
  </div></header>

  <main id="log" aria-live="polite"><div class="wrap" id="msgs"><p class="empty">Loading…</p></div></main>

  <footer><div class="wrap">
    <div class="preview" id="preview" hidden><img id="previewimg" alt="Photo to send"><button class="btn" id="unphoto">Remove</button></div>
    <div class="tools"><button class="chip" id="atclaude" type="button">✦ @claude</button><span class="note" id="hint">Write @claude to ask Claude</span></div>
    <form id="send">
      <button class="icon" type="button" id="photo" aria-label="Add a photo">📷</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="text" rows="1" placeholder="Message the family…" maxlength="4000" aria-label="Message"></textarea>
      <button class="icon send" id="go" aria-label="Send">↑</button>
    </form>
  </div></footer>

  <div id="toast" hidden></div>
  <div id="viewer" hidden><img id="viewimg" alt=""></div>
  <div id="call" hidden role="dialog" aria-label="Video call">
    <div class="stage" id="stage"></div>
    <div class="bar">
      <button id="mic" aria-pressed="false" aria-label="Mute">🎤</button>
      <button id="cam" aria-pressed="false" aria-label="Turn camera off">📷</button>
      <button id="flip" aria-label="Switch camera" hidden>🔄</button>
      <button id="hang" class="end" aria-label="Leave the call">✕</button>
    </div>
  </div>
  <dialog id="pick"><b>📹 Call who?</b><div class="picks" id="picks"></div>
    <div class="acts"><button class="btn" id="pickno">Cancel</button></div></dialog>
  <dialog id="ring"><b id="ringwho">📹 Video call</b><div class="note" style="margin:6px 0 0" id="ringnote">The family is on a call.</div>
    <div class="acts"><button class="btn" id="ringno">Not now</button><button class="btn" id="ringyes" style="background:var(--teal);color:var(--teal-ink);border-color:var(--teal)">Join</button></div></dialog>
  <dialog id="del"><b>Delete this message?</b><div class="note" style="margin:6px 0 0">It goes for everyone.</div>
    <div class="acts"><button class="btn" id="delno">Cancel</button><button class="btn bad" id="delyes">Delete</button></div></dialog>

<script type="module">
  import { sb, FAMILY, roleOf } from './auth.js';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const FN = 'https://okywhdfmdpdvrfhbkyeo.supabase.co/functions/v1/family-chat';
  const VAPID = 'BAOMU69cDpXXI0RZl3fTA4hkgIZgztF6BXOoWHXo4A48LT7nubbHVOqq6UfkOzLm28ViX16ZQI6osf_FhVGCjwQ';

  const { data: { session } } = await sb.auth.getSession();
  if (!session) location.replace('/?next=' + encodeURIComponent(location.href));
  const ME = { id: session?.user.id, role: roleOf(session?.user) };

  let family = [], msgs = [], thinking = 0;
  const urls = new Map();   // image path -> signed URL
  const member = (id) => family.find((f) => f.id === id);
  const avatar = (name) => FAMILY.find((f) => f.name === name)?.avatar;

  function toast(text, bad) {
    const t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4000);
  }

  // ---- reading ----
  async function sign(paths) {
    const need = [...new Set(paths)].filter((p) => p && !urls.has(p));
    if (!need.length) return;
    const { data } = await sb.storage.from('family-chat').createSignedUrls(need, 3600);
    for (const d of data || []) if (d.signedUrl) urls.set(d.path, d.signedUrl);
  }
  async function load() {
    const [{ data: f }, { data: m }] = await Promise.all([
      family.length ? { data: family } : sb.rpc('r4_family'),
      sb.from('chat_messages').select('*').order('id', { ascending: false }).limit(200),
    ]);
    family = f || []; msgs = (m || []).reverse();
    await Promise.all([sign(msgs.map((x) => x.image)), loadPolls()]);
    render(true); seen(true);
  }

  // Trip polls shared into the chat, voted on right here (the same votes the trip page shows).
  let polls = [], votes = [];
  async function loadPolls() {
    const ids = [...new Set(msgs.filter((x) => x.ref?.type === 'poll').map((x) => x.ref.id))];
    if (!ids.length) { polls = []; votes = []; return; }
    const [{ data: p }, { data: v }] = await Promise.all([sb.from('trip_polls').select('*').in('id', ids), sb.from('trip_poll_votes').select('poll, voter, choice').in('poll', ids)]);
    polls = p || []; votes = v || [];
  }
  // Where a card goes: the item itself (a shared item, a poll on an item, what Claude added), else the trip's Ideas or Chat.
  const tripUrl = (r) => {
    const item = r.type === 'item' ? r.id : r.type === 'poll' ? r.item : r.type === 'added' ? r.ids?.[0] : null;
    return `/trip.html?t=${encodeURIComponent(r.trip)}${item ? '&i=' + encodeURIComponent(item) : r.type === 'poll' ? '#chat' : '#ideas'}`;
  };
  const initial = (id) => (member(id)?.username || '?')[0].toUpperCase();
  function refHTML(r, m) {
    if (r.type === 'call') {
      const live = callLive(), latest = m && m.id === lastCallId();
      return `<div class="rcall${latest && live.length ? ' live' : ''}"><span class="ri">📹</span><span><b>${r.to ? `Called ${esc(nameIn(r.to))}` : 'Video call'}</b><small>${latest && live.length ? `Live now · ${esc(live.map((x) => member(x.user)?.username || 'someone').join(', '))}` : 'Ended'}</small></span>${latest && live.length && !inCall ? '<button data-join>Join</button>' : ''}</div>`;
    }
    if (r.type === 'item') return `<a class="rcard" href="${esc(tripUrl(r))}">${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="ri">📍</span>'}<span><small>${esc(r.trip_name)} ↗</small><b>${esc(r.title)}</b></span></a>`;
    if (r.type === 'added') return `<a class="rcard" href="${esc(tripUrl(r))}"><span class="ri">✦</span><span><small>Added to ${esc(r.trip_name)} ↗</small><ul>${(r.titles || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul></span></a>`;
    if (r.type === 'poll') {
      const q = polls.find((x) => x.id === r.id);
      if (!q) return `<a class="rcard" href="${esc(tripUrl(r))}"><span class="ri">📊</span><span><small>${esc(r.trip_name)} ↗</small><b>${esc(r.question)}</b></span></a>`;
      const vs = votes.filter((v) => v.poll === q.id), mine = vs.find((v) => v.voter === ME.id)?.choice;
      return `<div class="rpoll"><div class="q"><small>📊 Poll · ${esc(r.trip_name)}${q.closed ? ' · closed' : ''}</small>${esc(q.question)}</div>
        ${q.options.map((o, k) => { const w = vs.filter((v) => v.choice === k), pct = vs.length ? Math.round((w.length / vs.length) * 100) : 0;

      const [t] = (await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: want }, width: { ideal: 640 }, height: { ideal: 480 } } })).getVideoTracks();
      t.enabled = old.enabled;
      local.removeTrack(old); local.addTrack(t); facing = want;
      for (const p of peers.values()) p.pc.getSenders().find((x) => x.track?.kind === 'video' || x.track === old)?.replaceTrack(t);
      const sv = document.querySelector('#self video'); if (sv) sv.srcObject = local;
      paint();
    } catch { toast("Couldn't switch the camera.", true); }
  };
  // Back to the page with the screen on: the wake lock was let go while it was hidden.
  document.addEventListener('visibilitychange', async () => { if (inCall && !document.hidden && (!wake || wake.released)) try { wake = await navigator.wakeLock?.request('screen'); } catch {} });
  addEventListener('pagehide', leaveCall);
  // Opened from a call's ring: offer to join once we know the call is still on.
  if (location.hash === '#call') {
    history.replaceState(null, '', location.pathname + location.search);
    for (const ms of [1500, 4000]) setTimeout(() => ring([...msgs].reverse().find((x) => x.ref?.type === 'call')?.author), ms);
  }

  // ---- alerts: a push for new messages when the chat isn't open ----
  const b64 = (s) => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  async function alertsState() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      // iPhone: push only reaches a web app added to the Home Screen.
      if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone) { $('alerts').hidden = false; $('alerts').dataset.ios = '1'; }
      return;
    }
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && Notification.permission === 'granted' ? await reg.pushManager.getSubscription() : null;
    $('alerts').hidden = false;
    $('alerts').classList.toggle('on', !!sub);
    $('alerts').innerHTML = sub ? '🔔<span class="lbl"> Alerts on</span>' : '🔔<span class="lbl"> Turn on alerts</span>';
    $('alerts').setAttribute('aria-label', sub ? 'Alerts on' : 'Turn on alerts');
  }
  $('alerts').onclick = async () => {
    if ($('alerts').dataset.ios) { toast('On iPhone: Share → Add to Home Screen, open r4box from there, then turn on alerts.'); return; }
    if ($('alerts').classList.contains('on')) return;
    try {
      if (await Notification.requestPermission() !== 'granted') { toast('Alerts are blocked for r4box in this browser’s settings.', true); return; }
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
      const j = sub.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
      if (error) throw error;
      toast('Alerts on: you’ll get a notification for new messages.');
    } catch (err) { toast("Couldn't turn on alerts: " + (err.message || err), true); }
    alertsState();
  };

  if (session) { load(); alertsState(); text.focus({ preventScroll: true }); }
</script>
</body>
